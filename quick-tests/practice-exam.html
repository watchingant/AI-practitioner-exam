ith LIKE operators"}, {"letter": "B", "text": "Simple string matching algorithms"}, {"letter": "C", "text": "Vector embeddings that represent semantic meaning in mathematical space"}, {"letter": "D", "text": "File system directory structure"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSemantic search uses vector embeddings to represent text meaning as mathematical vectors in high-dimensional space, where conceptually similar content has vectors close together regardless of exact wording. SQL LIKE operators and string matching only find literal text matches. File system structure has no semantic understanding.", "multi": false}, {"num": 74, "text": "A developer is implementing a Bedrock Agent that needs to decide between multiple action groups based on user intent. The agent must determine whether to search a knowledge base, call an API, or ask for clarification. What enables this decision-making capability?", "options": [{"letter": "A", "text": "Hard-coded if-else rules in the application"}, {"letter": "B", "text": "User manually selecting which action to take each time"}, {"letter": "C", "text": "A separate classification model that must be trained first"}, {"letter": "D", "text": "The foundation model's reasoning capabilities combined with action group descriptions and instructions"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nBedrock Agents leverage the underlying foundation model's reasoning ability to interpret user intent and select appropriate action groups based on their descriptions and the agent's instructions. This is orchestrated by the model, not hard-coded rules. No separate classification model is needed. Users don't manually select actions.", "multi": false}, {"num": 75, "text": "A company wants to use generative AI to analyze their existing codebase, identify bugs, and suggest improvements. Which AWS service provides AI-powered code analysis and security scanning integrated into the development workflow?", "options": [{"letter": "A", "text": "Amazon Q Developer"}, {"letter": "B", "text": "AWS CloudTrail"}, {"letter": "C", "text": "Amazon Kinesis"}, {"letter": "D", "text": "AWS Config"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Q Developer provides AI-powered code analysis, security vulnerability scanning, bug detection, and improvement suggestions integrated into IDEs and CI/CD workflows. CloudTrail logs API activity. Kinesis processes streaming data. AWS Config tracks resource configurations.", "multi": false}, {"num": 76, "text": "A team has built a RAG application that retrieves relevant documents but sometimes generates responses that don't properly synthesize the retrieved information. Which approach would MOST improve the generation quality given already-relevant retrieved documents?", "options": [{"letter": "A", "text": "Retrieving more documents regardless of relevance"}, {"letter": "B", "text": "Using a smaller context window"}, {"letter": "C", "text": "Optimizing the generation prompt with clear instructions on how to use retrieved context and cite sources"}, {"letter": "D", "text": "Removing the system prompt"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nWhen retrieval quality is good but generation quality is poor, the issue is in how the model uses the context. Clear prompt instructions on synthesizing retrieved information and citing sources improve generation quality. More irrelevant documents add noise. Smaller context windows limit available information. Removing system prompts reduces control over response formatting.", "multi": false}, {"num": 77, "text": "A developer needs to configure inference parameters for a text generation model on Amazon Bedrock. They want to limit the response length to prevent excessive token usage. Which parameter controls the maximum number of tokens the model will generate?", "options": [{"letter": "A", "text": "Temperature"}, {"letter": "B", "text": "Max tokens (maximum generation length)"}, {"letter": "C", "text": "Top-p"}, {"letter": "D", "text": "Stop sequences"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nThe max tokens parameter directly limits how many tokens the model will generate in its response, controlling output length and token costs. Temperature controls randomness. Top-p filters token probabilities. Stop sequences terminate generation at specific strings but don't set a hard length limit.", "multi": false}, {"num": 78, "text": "A company is deploying a Bedrock-powered application that needs to handle high traffic with consistent low-latency responses. They want guaranteed throughput rather than shared on-demand capacity. Which Bedrock pricing option should they choose?", "options": [{"letter": "A", "text": "On-demand pricing with pay-per-token"}, {"letter": "B", "text": "Free tier with rate limiting"}, {"letter": "C", "text": "Spot instances for foundation models"}, {"letter": "D", "text": "Provisioned Throughput with reserved model capacity"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nProvisioned Throughput reserves dedicated model capacity ensuring consistent performance and guaranteed throughput for high-traffic applications. On-demand pricing is pay-per-use but shares capacity and may have variable latency under load. There are no spot instances for Bedrock models. Free tier has significant limitations.", "multi": false}, {"num": 79, "text": "A team is building a RAG application and needs to decide on a vector database solution that integrates natively with Amazon Bedrock Knowledge Bases. Which options are supported as vector stores? (Select TWO)", "options": [{"letter": "A", "text": "Amazon DynamoDB"}, {"letter": "B", "text": "Amazon OpenSearch Serverless"}, {"letter": "C", "text": "Amazon Redshift Serverless"}, {"letter": "D", "text": "Pinecone"}, {"letter": "E", "text": "Amazon RDS for MySQL"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nAmazon Bedrock Knowledge Bases supports multiple vector store options including Amazon OpenSearch Serverless, Pinecone, Redis Enterprise Cloud, and Amazon Aurora PostgreSQL with pgvector. DynamoDB is a key-value store without vector search. Redshift is for analytics. Standard RDS MySQL doesn't support vector operations natively.", "multi": true}, {"num": 80, "text": "A developer is building a text summarization application and needs to handle documents that exceed the foundation model's context window. Which technique allows processing documents longer than the model's maximum input length?", "options": [{"letter": "A", "text": "Chunking the document and using iterative/hierarchical summarization (map-reduce approach)"}, {"letter": "B", "text": "Simply truncating the document to fit the context window"}, {"letter": "C", "text": "Increasing the temperature to process more text"}, {"letter": "D", "text": "Switching to a model with infinite context length"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nThe map-reduce approach splits long documents into chunks that fit the context window, summarizes each chunk separately, then combines the summaries for a final summary. Truncation loses information. Temperature doesn't affect context capacity. No current model has truly infinite context length.", "multi": false}, {"num": 81, "text": "A company is using Amazon Q Business to help employees find information. They need to ensure that employees can only access answers derived from documents they have permission to view. Which feature enables this access control?", "options": [{"letter": "A", "text": "Document-level access control lists (ACLs) that respect existing enterprise permissions"}, {"letter": "B", "text": "Setting the model temperature to zero"}, {"letter": "C", "text": "Deploying a separate Q instance for each employee"}, {"letter": "D", "text": "Using content filters to block all responses"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Q Business integrates with enterprise identity providers and respects document-level ACLs, ensuring users only receive answers from documents they're authorized to access. Temperature settings don't affect access control. Separate instances per employee is impractical and expensive. Blocking all responses defeats the purpose.", "multi": false}, {"num": 82, "text": "A team is fine-tuning a foundation model on Amazon Bedrock and wants to evaluate whether the fine-tuned model outperforms the base model on their specific task. Which evaluation approach provides the MOST comprehensive comparison?", "options": [{"letter": "A", "text": "Comparing only the training loss between models"}, {"letter": "B", "text": "Comparing the models' pre-training dataset sizes"}, {"letter": "C", "text": "Checking which model has more parameters"}, {"letter": "D", "text": "Running both models on a held-out test set and comparing task-specific metrics plus human evaluation"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nComprehensive evaluation requires testing on unseen data with task-relevant metrics (accuracy, ROUGE, BLEU) combined with human evaluation for quality aspects that automated metrics may miss. Training loss alone doesn't measure real-world performance. Parameter count doesn't determine task-specific quality. Pre-training dataset size is irrelevant to fine-tuned performance comparison.", "multi": false}, {"num": 83, "text": "A developer wants to create an application that can search through company meeting transcripts and answer questions about past discussions. Which combination of Amazon Bedrock features would create this application with minimal custom development? (Select TWO)", "options": [{"letter": "A", "text": "Amazon Bedrock Knowledge Bases to index and retrieve relevant transcript passages"}, {"letter": "B", "text": "Amazon Bedrock Custom Model Import to train a model on transcripts"}, {"letter": "C", "text": "A foundation model (like Claude) to generate answers based on retrieved context"}, {"letter": "D", "text": "Amazon Bedrock Provisioned Throughput to train the model"}, {"letter": "E", "text": "Amazon Bedrock Guardrails to generate the answers"}], "correct": ["A", "C"], "explanation": "<strong>Explanation:</strong>\nKnowledge Bases handles document ingestion, chunking, embedding, and retrieval of relevant transcript passages. A foundation model then generates natural language answers from the retrieved context. This is standard RAG architecture. Custom Model Import is for bringing external models. Provisioned Throughput is for capacity, not training. Guardrails filter content but don't generate answers.", "multi": true}, {"num": 84, "text": "A company is considering using parameter-efficient fine-tuning (PEFT) techniques like LoRA instead of full fine-tuning for their foundation model. Which advantage does PEFT provide over full fine-tuning?", "options": [{"letter": "A", "text": "PEFT always produces better model accuracy than full fine-tuning"}, {"letter": "B", "text": "PEFT eliminates the need for any training data"}, {"letter": "C", "text": "PEFT requires more training data than full fine-tuning"}, {"letter": "D", "text": "PEFT reduces computational cost and storage by training only a small number of additional parameters while freezing most of the original model"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nPEFT techniques like LoRA add small trainable matrices while keeping the original model frozen, dramatically reducing compute, memory, and storage requirements. Full fine-tuning can still achieve better accuracy in some cases, so PEFT doesn't always outperform it. PEFT doesn't require more data, and it still requires some training data.", "multi": false}, {"num": 85, "text": "A team is deploying a generative AI application and wants to implement content moderation that scans both user inputs and model outputs for harmful content. They need to filter hate speech, violence, and sexual content. Which approach provides the MOST integrated solution on AWS?", "options": [{"letter": "A", "text": "Building a custom classification model from scratch for each content category"}, {"letter": "B", "text": "Manually reviewing all inputs and outputs before displaying them"}, {"letter": "C", "text": "Configuring Amazon Bedrock Guardrails with content filter policies for specific harm categories"}, {"letter": "D", "text": "Blocking all requests that contain more than 100 words"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nBedrock Guardrails provides built-in content filters that can be configured for specific harm categories (hate, insults, sexual, violence, misconduct) with adjustable strength levels, applied to both inputs and outputs. Building custom models is costly and complex. Manual review doesn't scale. Word count limits don't identify harmful content.", "multi": false}, {"num": 86, "text": "A developer is working with Amazon Bedrock and needs to maintain a persistent conversation with context. They are using the Converse API. How does the API handle conversation state?", "options": [{"letter": "A", "text": "The API automatically stores all conversation history server-side indefinitely"}, {"letter": "B", "text": "Each API call automatically includes the previous 100 messages from a session database"}, {"letter": "C", "text": "Conversation state is stored in the model's weights permanently"}, {"letter": "D", "text": "The developer must pass the full message history array with each API call since the service is stateless"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nThe Bedrock Converse API is stateless - it doesn't store conversation history between calls. Developers must maintain and pass the full message array (conversation turns) with each request to provide context. The service doesn't store history server-side, model weights don't change at inference time, and there's no automatic session database.", "multi": false}, {"num": 87, "text": "A company wants to deploy a generative AI solution that answers questions about their product catalog. They need the solution to be production-ready with minimal development effort. Which approach provides the fastest path to production while maintaining accuracy?", "options": [{"letter": "A", "text": "Training a custom LLM from scratch on product data"}, {"letter": "B", "text": "Hiring a team to manually write answers for every possible question"}, {"letter": "C", "text": "Using Amazon Bedrock Knowledge Bases with their product documentation as the data source"}, {"letter": "D", "text": "Using a general-purpose search engine without AI"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nBedrock Knowledge Bases provides a managed RAG solution that ingests product documentation, creates embeddings, and enables accurate Q&A with minimal development effort. Training from scratch requires massive resources and time. Manual answer writing doesn't scale. A search engine without AI can't generate natural language answers.", "multi": false}, {"num": 88, "text": "A company has deployed a loan approval ML model and discovers it disproportionately denies applications from certain demographic groups, even when applicants have similar financial profiles. What is this type of issue called in responsible AI?", "options": [{"letter": "A", "text": "Model drift"}, {"letter": "B", "text": "Feature leakage"}, {"letter": "C", "text": "Underfitting"}, {"letter": "D", "text": "Algorithmic bias leading to disparate impact"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nDisparate impact occurs when a model's decisions disproportionately affect protected demographic groups negatively, even without explicit discriminatory intent. This is a form of algorithmic bias. Model drift refers to performance degradation over time. Underfitting is when models are too simple. Feature leakage is when test data information leaks into training.", "multi": false}, {"num": 89, "text": "A healthcare company is using an ML model to assist doctors in diagnosing diseases. They need to explain to patients why the model made a specific recommendation. Which tool in the AWS ecosystem helps generate explanations for individual model predictions?", "options": [{"letter": "A", "text": "Amazon SageMaker Clarify"}, {"letter": "B", "text": "Amazon SageMaker Model Monitor"}, {"letter": "C", "text": "Amazon SageMaker Data Wrangler"}, {"letter": "D", "text": "Amazon SageMaker Autopilot"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nSageMaker Clarify provides model explainability through SHAP values and feature attribution, showing which factors influenced specific predictions. It also detects bias in data and models. Model Monitor tracks data quality and drift. Data Wrangler prepares data. Autopilot automates model building but doesn't focus on explanations.", "multi": false}, {"num": 90, "text": "A financial services company wants to ensure their AI credit scoring model treats all applicants fairly. They need to measure whether the model's approval rates are equal across different demographic groups. Which fairness metric specifically measures this?", "options": [{"letter": "A", "text": "Root Mean Squared Error"}, {"letter": "B", "text": "AUC-ROC"}, {"letter": "C", "text": "Demographic parity (statistical parity)"}, {"letter": "D", "text": "Perplexity"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nDemographic parity measures whether the positive prediction rate (e.g., loan approval rate) is equal across different demographic groups. RMSE measures regression error. AUC-ROC measures overall model discrimination ability. Perplexity evaluates language model quality. None of these other metrics directly assess fairness across groups.", "multi": false}, {"num": 91, "text": "A company is deploying an AI system for hiring recommendations. To maintain accountability and transparency, their legal team requires documentation of the model's intended use, limitations, evaluation results, and ethical considerations. What type of document serves this purpose?", "options": [{"letter": "A", "text": "API documentation"}, {"letter": "B", "text": "Service level agreement"}, {"letter": "C", "text": "User manual"}, {"letter": "D", "text": "Model card"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nModel cards are standardized documents that describe a model's intended use cases, limitations, evaluation metrics, training data characteristics, ethical considerations, and potential biases. They promote transparency and informed decision-making. API documentation covers technical interfaces. User manuals guide end users. SLAs define service guarantees.", "multi": false}, {"num": 92, "text": "A team has deployed an AI content moderation system that makes automated decisions about removing user posts. Some users have complained about incorrect removals. Which responsible AI principle suggests that affected users should have a mechanism to challenge and appeal automated decisions?", "options": [{"letter": "A", "text": "Feature engineering"}, {"letter": "B", "text": "Gradient descent optimization"}, {"letter": "C", "text": "Human-in-the-loop and contestability"}, {"letter": "D", "text": "Data augmentation"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nHuman-in-the-loop ensures humans can review, override, and appeal automated decisions, particularly for high-stakes cases. Contestability gives affected individuals the ability to challenge AI decisions. Feature engineering is a data preparation technique. Gradient descent is an optimization algorithm. Data augmentation increases training data variety.", "multi": false}, {"num": 93, "text": "A data scientist wants to understand why their image classification model misclassifies certain images. They need a technique that highlights which regions of the input image most influenced the model's prediction. Which explainability method provides visual explanations for image models?", "options": [{"letter": "A", "text": "Confusion matrix"}, {"letter": "B", "text": "One-hot encoding visualization"}, {"letter": "C", "text": "LIME (Local Interpretable Model-agnostic Explanations) with image superpixels"}, {"letter": "D", "text": "ROC curve analysis"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nLIME for images perturbs superpixels (regions) of the input and observes changes in prediction, creating visual explanations showing which image regions most influenced the classification. One-hot encoding is a feature representation method. Confusion matrices show aggregate performance. ROC curves measure threshold trade-offs, none of which explain individual image predictions.", "multi": false}, {"num": 94, "text": "A company is building an AI-powered resume screening tool. During testing, they discover the model penalizes resumes that mention women's colleges or women's sports leagues. Which steps should they take to address this bias? (Select TWO)", "options": [{"letter": "A", "text": "Deploy the model immediately since it has high overall accuracy"}, {"letter": "B", "text": "Audit training data for historical hiring biases and remove or rebalance biased examples"}, {"letter": "C", "text": "Ignore the issue since the model wasn't explicitly programmed to be biased"}, {"letter": "D", "text": "Implement bias detection using SageMaker Clarify and retrain with debiased data"}, {"letter": "E", "text": "Add more biased data to make the bias consistent"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nAddressing bias requires both identifying the source (auditing training data for historical biases) and implementing systematic detection (SageMaker Clarify) followed by remediation. High accuracy doesn't excuse discriminatory outcomes. Bias doesn't require explicit programming - it often comes from historical data patterns. Adding more biased data worsens the problem.", "multi": true}, {"num": 95, "text": "A company is developing an AI system that makes medical treatment recommendations. Which responsible AI principle requires that patients and doctors understand how and why the system arrived at its recommendation?", "options": [{"letter": "A", "text": "Scalability"}, {"letter": "B", "text": "Transparency and explainability"}, {"letter": "C", "text": "Cost optimization"}, {"letter": "D", "text": "Data compression"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nTransparency requires that AI systems' decision-making processes be understandable to stakeholders, especially in high-stakes domains like healthcare. Explainability provides the mechanisms to understand specific decisions. Scalability, cost optimization, and data compression are technical concerns unrelated to responsible AI principles.", "multi": false}, {"num": 96, "text": "A team is using Amazon SageMaker Clarify to evaluate their model for bias. Which types of bias can SageMaker Clarify detect? (Select TWO)", "options": [{"letter": "A", "text": "Pre-training bias in the training dataset (before model training)"}, {"letter": "B", "text": "Hardware manufacturing bias in GPU chips"}, {"letter": "C", "text": "Post-training bias in model predictions (after model training)"}, {"letter": "D", "text": "Network latency bias in API responses"}, {"letter": "E", "text": "Storage bias in S3 bucket configurations"}], "correct": ["A", "C"], "explanation": "<strong>Explanation:</strong>\nSageMaker Clarify detects pre-training bias (imbalances in training data before model training) and post-training bias (unfair predictions after the model is trained). It analyzes data distributions and model outputs across groups. Hardware, network, and storage biases are infrastructure concepts unrelated to ML fairness.", "multi": true}, {"num": 97, "text": "A company is designing an AI-powered customer service chatbot for a diverse global audience. Which inclusive design principle should guide the development of this system?", "options": [{"letter": "A", "text": "Designing only for the majority demographic to maximize efficiency"}, {"letter": "B", "text": "Testing with diverse user groups and ensuring equitable performance across languages, accents, and cultural contexts"}, {"letter": "C", "text": "Using only English language training data since it's the most common business language"}, {"letter": "D", "text": "Optimizing exclusively for response speed regardless of accuracy across demographics"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nInclusive design requires considering diverse users from the start, testing with representative populations, and ensuring equitable performance regardless of language, culture, or ability. Designing for only the majority excludes significant populations. English-only ignores global users. Speed without equitable accuracy creates disparate service quality.", "multi": false}, {"num": 98, "text": "A data scientist is using SHAP values to explain their model's predictions. A customer's loan application was denied, and the SHAP analysis shows that \"employment_length\" had the highest negative contribution. What does this tell the team?", "options": [{"letter": "A", "text": "The employment_length feature should be removed from the model entirely"}, {"letter": "B", "text": "SHAP values indicate the feature is not important to the model"}, {"letter": "C", "text": "The model is completely broken and should be retrained"}, {"letter": "D", "text": "The customer's short employment length was the primary factor pushing the prediction toward denial"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nSHAP values show how each feature contributes to a specific prediction relative to the baseline. A high negative SHAP value for employment_length means this feature strongly pushed the prediction toward denial for this customer. It doesn't mean the feature should be removed (it may be legitimately predictive) or that the model is broken.", "multi": false}, {"num": 99, "text": "A company is deploying a facial recognition system and is concerned about disparate performance across different skin tones and ethnicities. Which responsible AI practice should they implement BEFORE deployment?", "options": [{"letter": "A", "text": "Deploy first and address complaints as they arise"}, {"letter": "B", "text": "Focus solely on overall accuracy without subgroup analysis"}, {"letter": "C", "text": "Only test with synthetic data generated by AI"}, {"letter": "D", "text": "Evaluate model performance across demographic subgroups and ensure equitable accuracy rates"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nPre-deployment evaluation across demographic subgroups (disaggregated evaluation) identifies performance disparities before they cause harm. Deploying first and waiting for complaints causes real-world harm. Synthetic data may not represent real demographic diversity. Overall accuracy can mask significant performance gaps between subgroups.", "multi": false}, {"num": 100, "text": "A team has deployed an AI system that autonomously makes decisions affecting people's lives (insurance claims, bail decisions). Which governance framework principle requires that there always be a designated person or entity responsible for the AI system's outcomes?", "options": [{"letter": "A", "text": "Accountability"}, {"letter": "B", "text": "Feature importance"}, {"letter": "C", "text": "Gradient optimization"}, {"letter": "D", "text": "Tokenization"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAccountability in AI governance requires clear designation of who is responsible for the AI system's decisions and their impacts. It ensures that humans cannot abdicate responsibility by attributing decisions solely to an algorithm. Feature importance, gradient optimization, and tokenization are technical ML concepts unrelated to governance principles.", "multi": false}, {"num": 101, "text": "A company wants to implement responsible AI practices for their generative AI application. They need to prevent the model from generating harmful, biased, or inappropriate content in production. Which layered approach provides the MOST comprehensive protection?", "options": [{"letter": "A", "text": "Relying solely on the model's built-in training alignment"}, {"letter": "B", "text": "Only implementing output filtering and ignoring input validation"}, {"letter": "C", "text": "Combining model alignment, input/output guardrails, content filtering, and human review for edge cases"}, {"letter": "D", "text": "Asking users to self-moderate their interactions"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nA defense-in-depth approach layers multiple safeguards: model alignment during training, runtime guardrails for both inputs and outputs, content filtering rules, and human review for challenging cases. No single layer is sufficient alone. Relying only on training alignment misses adversarial prompts. Output-only filtering misses harmful inputs. User self-moderation is unreliable.", "multi": false}, {"num": 102, "text": "A machine learning team wants to document their model's limitations and appropriate use cases to prevent misuse. According to responsible AI best practices, which information should be included in their model documentation? (Select TWO)", "options": [{"letter": "A", "text": "The exact salary of each team member who built the model"}, {"letter": "B", "text": "Known limitations, failure modes, and populations where the model may not perform well"}, {"letter": "C", "text": "Intended use cases and explicitly out-of-scope applications"}, {"letter": "D", "text": "Competitors' proprietary model architectures"}, {"letter": "E", "text": "Personal information of the training data subjects"}], "correct": ["B", "C"], "explanation": "<strong>Explanation:</strong>\nResponsible model documentation should clearly state known limitations and failure modes so users understand risks, and define intended vs. out-of-scope use cases to prevent misuse. Team salaries are private HR information. Competitors' architectures are proprietary. Including personal data of training subjects would violate privacy.", "multi": true}, {"num": 103, "text": "A company is developing an AI system for automated content generation. They want to ensure users can always distinguish between AI-generated content and human-created content. Which responsible AI principle does this represent?", "options": [{"letter": "A", "text": "Cost efficiency"}, {"letter": "B", "text": "Model compression"}, {"letter": "C", "text": "Transparency through AI content disclosure and watermarking"}, {"letter": "D", "text": "Distributed computing"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nTransparency in generative AI includes disclosing when content is AI-generated, potentially through watermarking or explicit labeling, so users can make informed judgments about the content's origin and reliability. Cost efficiency, model compression, and distributed computing are technical implementation concerns unrelated to responsible AI disclosure.", "multi": false}, {"num": 104, "text": "A healthcare AI company is implementing responsible AI governance. Their model assists in diagnosing rare diseases, but the team acknowledges the model has a 15% error rate for certain rare conditions. Which responsible AI practice should guide their deployment decision?", "options": [{"letter": "A", "text": "Implement human-in-the-loop oversight where clinicians validate AI suggestions before acting, and clearly communicate the model's limitations"}, {"letter": "B", "text": "Deploy without disclosure since 85% accuracy is sufficient"}, {"letter": "C", "text": "Remove the model from all medical use cases entirely"}, {"letter": "D", "text": "Only deploy in regions where medical regulations don't apply"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nFor high-stakes medical decisions with known error rates, human-in-the-loop ensures qualified professionals validate AI recommendations before patient action, while communicating limitations enables informed use. Deploying without disclosure is irresponsible. Complete removal may deny patients a useful assistive tool. Avoiding regulations is unethical.", "multi": false}, {"num": 105, "text": "A company is deploying an Amazon SageMaker training job that processes sensitive patient health data. They need to ensure the training data is encrypted both at rest and in transit. Which AWS services and features should they use? (Select TWO)", "options": [{"letter": "A", "text": "AWS KMS for managing encryption keys used by SageMaker to encrypt data at rest"}, {"letter": "B", "text": "Storing data in unencrypted public S3 buckets"}, {"letter": "C", "text": "TLS/SSL encryption for data in transit between S3 and the training instance"}, {"letter": "D", "text": "Disabling VPC configuration for easier network access"}, {"letter": "E", "text": "Using HTTP instead of HTTPS for faster data transfer"}], "correct": ["A", "C"], "explanation": "<strong>Explanation:</strong>\nAWS KMS provides managed encryption keys that SageMaker uses to encrypt training data, model artifacts, and volumes at rest. TLS/SSL secures data in transit between services. Unencrypted public buckets expose sensitive data. Disabling VPC removes network isolation. HTTP without encryption exposes data during transfer.", "multi": true}, {"num": 106, "text": "A company wants to ensure their Amazon SageMaker notebook instances and training jobs are isolated within their own private network and cannot be accessed from the public internet. Which AWS networking feature enables this isolation?", "options": [{"letter": "A", "text": "Amazon CloudFront distribution"}, {"letter": "B", "text": "Amazon Route 53 public hosted zone"}, {"letter": "C", "text": "Amazon VPC (Virtual Private Cloud) with private subnets"}, {"letter": "D", "text": "AWS Global Accelerator"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nDeploying SageMaker resources within a VPC using private subnets ensures network isolation from the public internet. Security groups and NACLs provide additional access control. CloudFront is a CDN for content delivery. Route 53 manages DNS. Global Accelerator optimizes network performance but doesn't provide isolation.", "multi": false}, {"num": 107, "text": "A security team needs to audit all API calls made to Amazon Bedrock in their AWS account, including who made the call, when it was made, and from which IP address. Which AWS service provides this audit trail?", "options": [{"letter": "A", "text": "Amazon CloudWatch Metrics"}, {"letter": "B", "text": "AWS Trusted Advisor"}, {"letter": "C", "text": "Amazon Inspector"}, {"letter": "D", "text": "AWS CloudTrail"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAWS CloudTrail records all AWS API calls including those to Amazon Bedrock, capturing the identity of the caller, timestamp, source IP, request parameters, and response. CloudWatch Metrics provides operational metrics. Inspector assesses security vulnerabilities. Trusted Advisor provides best practice recommendations.", "multi": false}, {"num": 108, "text": "A company is using Amazon Bedrock and needs to control which IAM users and roles can invoke specific foundation models. Which AWS mechanism provides this fine-grained access control?", "options": [{"letter": "A", "text": "Amazon Bedrock Guardrails"}, {"letter": "B", "text": "AWS WAF rules"}, {"letter": "C", "text": "Amazon VPC security groups"}, {"letter": "D", "text": "IAM policies with Bedrock-specific actions and resource ARNs"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nIAM policies allow fine-grained access control specifying which users/roles can perform which Bedrock actions (like InvokeModel) on which specific model resources (using ARNs). Bedrock Guardrails filter content, not access. VPC security groups control network traffic, not service permissions. WAF protects web applications from exploits.", "multi": false}, {"num": 109, "text": "A healthcare organization is building an AI application on AWS that processes protected health information (PHI). Which compliance framework must they ensure their AWS services configuration adheres to?", "options": [{"letter": "A", "text": "HIPAA (Health Insurance Portability and Accountability Act)"}, {"letter": "B", "text": "PCI DSS only"}, {"letter": "C", "text": "SOX (Sarbanes-Oxley) only"}, {"letter": "D", "text": "FISMA only"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nHIPAA governs the protection of protected health information (PHI) and requires specific safeguards for healthcare data. AWS offers HIPAA-eligible services and Business Associate Agreements (BAAs). PCI DSS covers payment card data. SOX covers financial reporting. FISMA covers federal government information systems.", "multi": false}, {"num": 110, "text": "A company operating in Europe is using Amazon Bedrock and must ensure that their data is processed and stored only within the EU to comply with data sovereignty requirements. Which AWS capability helps address this?", "options": [{"letter": "A", "text": "Using AWS Global Accelerator to route traffic worldwide"}, {"letter": "B", "text": "Using CloudFront to cache data globally"}, {"letter": "C", "text": "Enabling cross-region replication to all regions"}, {"letter": "D", "text": "Choosing an AWS Region located within the EU for Bedrock resources"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAWS Regions are physically isolated locations, and selecting an EU Region ensures data processing and storage remain within EU boundaries for data residency compliance. CloudFront global caching, cross-region replication, and Global Accelerator all distribute data beyond the EU, violating sovereignty requirements.", "multi": false}, {"num": 111, "text": "A security engineer needs to establish a private connection between their VPC and Amazon SageMaker endpoints without traffic traversing the public internet. Which AWS service creates this private connectivity?", "options": [{"letter": "A", "text": "AWS PrivateLink (VPC Endpoints)"}, {"letter": "B", "text": "AWS Direct Connect"}, {"letter": "C", "text": "Internet Gateway"}, {"letter": "D", "text": "NAT Gateway"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAWS PrivateLink creates private connections between VPCs and AWS services through VPC endpoints, ensuring traffic stays within the AWS network without traversing the public internet. Direct Connect connects on-premises to AWS. Internet Gateways provide public internet access. NAT Gateways allow outbound internet access from private subnets.", "multi": false}, {"num": 112, "text": "A company wants to detect sensitive data like credit card numbers and personal identifiers in their S3 data lake before using it for ML training. Which AWS service automatically discovers, classifies, and protects sensitive data at scale?", "options": [{"letter": "A", "text": "Amazon GuardDuty"}, {"letter": "B", "text": "Amazon Macie"}, {"letter": "C", "text": "AWS Config"}, {"letter": "D", "text": "Amazon Detective"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Macie uses machine learning to automatically discover, classify, and protect sensitive data (PII, financial data, credentials) stored in Amazon S3. GuardDuty detects threats and suspicious activity. AWS Config tracks resource configurations. Detective investigates security findings. None of these others specialize in sensitive data discovery.", "multi": false}, {"num": 113, "text": "A company is using both Amazon Bedrock and Amazon SageMaker. Under the AWS Shared Responsibility Model, which security responsibilities belong to the CUSTOMER? (Select TWO)", "options": [{"letter": "A", "text": "Physical security of AWS data centers"}, {"letter": "B", "text": "Configuring IAM policies to control access to AI services"}, {"letter": "C", "text": "Patching the underlying hypervisor and hardware"}, {"letter": "D", "text": "Encrypting sensitive training data and managing encryption keys"}, {"letter": "E", "text": "Maintaining the global AWS network infrastructure"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nUnder the Shared Responsibility Model, customers are responsible for security \"in\" the cloud: IAM configuration, data encryption, access management, and application security. AWS is responsible for security \"of\" the cloud: physical data center security, hypervisor patching, and global network infrastructure maintenance.", "multi": true}, {"num": 114, "text": "A security team wants to prevent prompt injection attacks where malicious users try to manipulate their Bedrock-powered application into ignoring system instructions. Which combination of defenses is MOST effective?", "options": [{"letter": "A", "text": "Only increasing the model's temperature setting"}, {"letter": "B", "text": "Input validation, Amazon Bedrock Guardrails with denied topics, and robust system prompts with clear boundaries"}, {"letter": "C", "text": "Removing all system prompts so there's nothing to override"}, {"letter": "D", "text": "Allowing all user inputs without any filtering"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nDefending against prompt injection requires multiple layers: validating and sanitizing inputs, using Bedrock Guardrails to filter dangerous patterns, and designing robust system prompts that are difficult to override. Temperature settings don't prevent injection. Removing system prompts removes desired behavior controls. No filtering allows all attacks through.", "multi": false}, {"num": 115, "text": "A company processes data subject to GDPR and needs to implement the \"right to be forgotten\" for their ML models trained on personal data. Which challenge does this present for machine learning systems?", "options": [{"letter": "A", "text": "It's impossible to comply with GDPR when using ML"}, {"letter": "B", "text": "They may need to retrain models after removing specific individual's data, or use techniques like machine unlearning"}, {"letter": "C", "text": "GDPR doesn't apply to machine learning models"}, {"letter": "D", "text": "Simply deleting the S3 training files is always sufficient compliance"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nThe right to erasure under GDPR can require removing an individual's influence from trained models, potentially necessitating model retraining or machine unlearning techniques. It's not impossible to comply, but it requires careful planning. GDPR does apply to ML systems processing personal data. Deleting source files doesn't remove learned patterns from model weights.", "multi": false}, {"num": 116, "text": "A company wants to log and monitor all interactions with their Amazon Bedrock application for compliance and security analysis. Which approach provides comprehensive logging of model invocations including prompts and responses?", "options": [{"letter": "A", "text": "Checking the model's training logs"}, {"letter": "B", "text": "Only monitoring CPU utilization of the service"}, {"letter": "C", "text": "Relying solely on AWS billing reports"}, {"letter": "D", "text": "Amazon Bedrock model invocation logging to S3 and CloudWatch Logs"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nBedrock model invocation logging captures full request and response data (including prompts and completions) and sends them to S3 and/or CloudWatch Logs for compliance auditing. CPU utilization is an infrastructure metric. Billing reports show costs, not content. Training logs are from model development, not runtime invocations.", "multi": false}, {"num": 117, "text": "A security architect is designing the network architecture for their SageMaker deployment. They need to ensure that training instances can download packages from the internet for dependencies while keeping the model endpoint completely isolated. Which architecture achieves this?", "options": [{"letter": "A", "text": "Use a VPC with NAT Gateway for training instances' internet access and VPC endpoints for endpoint isolation"}, {"letter": "B", "text": "Place all resources in public subnets with unrestricted security groups"}, {"letter": "C", "text": "Disable all networking for both training and endpoints"}, {"letter": "D", "text": "Use the same security group for all resources with all ports open"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nA NAT Gateway allows training instances in private subnets to access the internet for dependencies without being directly accessible. VPC endpoints keep inference traffic private. Public subnets with open security groups expose everything. Disabling networking prevents all operations. Open security groups violate least-privilege principles.", "multi": false}, {"num": 118, "text": "A company has multiple AWS accounts and wants to centrally manage which foundation models their teams can access through Amazon Bedrock. Which approach provides centralized governance across accounts?", "options": [{"letter": "A", "text": "AWS Organizations with Service Control Policies (SCPs) restricting Bedrock model access"}, {"letter": "B", "text": "Letting each team manage their own permissions independently"}, {"letter": "C", "text": "Using a single shared AWS account for all teams"}, {"letter": "D", "text": "Disabling IAM entirely and using only root credentials"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAWS Organizations with SCPs provides centralized governance by defining permission boundaries across all member accounts, allowing administrators to restrict which Bedrock models can be accessed organization-wide. Independent management lacks central control. A single shared account creates security risks. Disabling IAM or using root credentials violates security best practices.", "multi": false}, {"num": 119, "text": "A development team is using Amazon Bedrock in production and wants to be alerted when the model's response patterns change significantly or when unusual usage patterns emerge that might indicate a security breach. Which monitoring approach is MOST appropriate?", "options": [{"letter": "A", "text": "Checking logs manually once per year"}, {"letter": "B", "text": "Relying on end users to report issues"}, {"letter": "C", "text": "Only monitoring the monthly AWS bill"}, {"letter": "D", "text": "Setting up Amazon CloudWatch alarms on Bedrock metrics combined with CloudTrail anomaly detection"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nCloudWatch alarms can trigger on Bedrock operational metrics (invocation counts, latency, errors) while CloudTrail monitors for unusual API call patterns indicating potential security issues. Manual yearly checks miss real-time threats. Bill monitoring is too delayed for security. Relying on users misses backend attacks.", "multi": false}, {"num": 120, "text": "A company is building an AI application that processes customer data from multiple countries. Their compliance team requires that they can demonstrate exactly what data was used to train or fine-tune their models, how it was processed, and where it is stored at any point in time. Which combination of AWS capabilities supports this data governance requirement? (Select TWO)", "options": [{"letter": "A", "text": "Amazon S3 versioning and object lock for immutable training data records"}, {"letter": "B", "text": "Deleting all logs after model training completes"}, {"letter": "C", "text": "SageMaker ML Lineage Tracking for end-to-end data and model provenance"}, {"letter": "D", "text": "Using untagged resources without any naming conventions"}, {"letter": "E", "text": "Disabling AWS CloudTrail to reduce storage costs"}], "correct": ["A", "C"], "explanation": "<strong>Explanation:</strong>\nS3 versioning with object lock creates immutable records of training data at each point in time. SageMaker ML Lineage Tracking automatically records the relationships between datasets, processing steps, training jobs, and models for full provenance. Deleting logs destroys audit evidence. Untagged resources make tracking impossible. Disabling CloudTrail eliminates API audit trails.", "multi": true}];

function buildQuiz() {
  const container = document.getElementById('questions');
  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q${idx}`;

    const multiBadge = q.multi ? `<span class="multi-badge">Select 2</span>` : '';
    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q${q.num}</span>
        <span class="q-text">${escHtml(q.text)}${multiBadge}</span>
      </div>
      <div class="options" id="opts_${idx}">
        ${q.options.map(o => `
          <label class="option-label" id="lbl_${idx}_${o.letter}">
            <input type="${q.multi ? 'checkbox' : 'radio'}" name="q${idx}" value="${o.letter}" />
            <span class="letter">${o.letter})</span>
            <span>${escHtml(o.text)}</span>
          </label>`).join('')}
      </div>
      <button class="submit-btn" onclick="submitAnswer(${idx})">Check Answer</button>
      <div id="badge_${idx}" style="margin-top:12px;"></div>
      <details class="explanation" id="exp_${idx}">
        <summary>💡 Explanation</summary>
        <div class="explanation-body">${q.explanation}</div>
      </details>
    `;
    container.appendChild(card);
  });
}

function getSelected(idx) {
  const inputs = document.querySelectorAll(`[name="q${idx}"]:checked`);
  return Array.from(inputs).map(i => i.value);
}

function submitAnswer(idx) {
  const q = QUESTIONS[idx];
  const selected = getSelected(idx);
  if (selected.length === 0) return;

  // Disable all inputs
  document.querySelectorAll(`[name="q${idx}"]`).forEach(inp => inp.disabled = true);
  document.querySelector(`#q${idx} .submit-btn`).disabled = true;

  // Apply visual feedback
  q.options.forEach(o => {
    const lbl = document.getElementById(`lbl_${idx}_${o.letter}`);
    lbl.classList.add('disabled');
    const isCorrect = q.correct.includes(o.letter);
    const isSelected = selected.includes(o.letter);
    if (isCorrect) lbl.classList.add('correct');
    else if (isSelected && !isCorrect) lbl.classList.add('wrong');
  });

  // Determine result
  const correctSet = new Set(q.correct);
  const selectedSet = new Set(selected);
  let result;
  if (q.multi) {
    const allCorrect = q.correct.every(l => selectedSet.has(l)) && selected.every(l => correctSet.has(l));
    const partialCorrect = q.correct.some(l => selectedSet.has(l));
    result = allCorrect ? 'correct' : (partialCorrect ? 'partial' : 'wrong');
  } else {
    result = (selected.length === 1 && selected[0] === q.correct[0]) ? 'correct' : 'wrong';
  }

  const badge = document.getElementById(`badge_${idx}`);
  if (result === 'correct') {
    badge.innerHTML = `<span class="result-badge correct">✓ Correct!</span>`;
    document.getElementById(`q${idx}`).classList.add('answered-correct');
    correctCount++;
  } else if (result === 'partial') {
    const corrStr = q.correct.join(', ');
    badge.innerHTML = `<span class="result-badge partial">Partially Correct — full answer: ${corrStr}</span>`;
    document.getElementById(`q${idx}`).classList.add('answered-partial');
  } else {
    const corrStr = q.correct.join(', ');
    badge.innerHTML = `<span class="result-badge wrong">✗ Incorrect — correct answer: ${corrStr}</span>`;
    document.getElementById(`q${idx}`).classList.add('answered-wrong');
  }

  // Auto-open explanation
  document.getElementById(`exp_${idx}`).setAttribute('open', '');

  answeredCount++;
  updateProgress();

  if (answeredCount === TOTAL) showScore();
}

function updateProgress() {
  const pct = (answeredCount / TOTAL) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${answeredCount} / ${TOTAL} answered`;
}

function showScore() {
  const panel = document.getElementById('score-panel');
  panel.style.display = 'block';
  document.getElementById('score-correct').textContent = correctCount;
  document.getElementById('score-pct').textContent = `out of ${TOTAL} questions (${Math.round(correctCount/TOTAL*100)}%)`;
  const pct = correctCount / TOTAL * 100;
  let grade;
  if (pct >= 90) grade = '🏆 Excellent — you're exam-ready!';
  else if (pct >= 75) grade = '👍 Good — review your misses and try again.';
  else if (pct >= 60) grade = '📚 Needs more study — keep going!';
  else grade = '💪 Keep practicing — you'll get there!';
  document.getElementById('score-grade').textContent = grade;
  panel.scrollIntoView({ behavior: 'smooth' });
}

buildQuiz();
updateProgress();
</script>
</body>
</html>
