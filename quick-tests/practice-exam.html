<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AWS AI Practitioner — Practice Test 1</title>
<style>
  :root {
    --aws-orange: #FF9900;
    --aws-navy:   #232F3E;
    --aws-blue:   #1A73E8;
    --correct-bg: #d4edda;
    --correct-border: #28a745;
    --wrong-bg:   #f8d7da;
    --wrong-border: #dc3545;
    --neutral-bg: #f4f6f8;
    --card-bg:    #ffffff;
    --radius:     10px;
    --shadow:     0 2px 8px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--neutral-bg);
    color: #222;
    line-height: 1.6;
  }
  header {
    background: var(--aws-navy);
    color: #fff;
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    flex: 1;
  }
  header h1 span {
    color: var(--aws-orange);
  }
  #progress-bar-wrap {
    width: 100%;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    height: 6px;
    margin-top: 8px;
  }
  #progress-bar {
    height: 6px;
    border-radius: 4px;
    background: var(--aws-orange);
    transition: width 0.3s;
    width: 0%;
  }
  #progress-text {
    font-size: 0.82rem;
    color: #ccc;
    white-space: nowrap;
  }
  main {
    max-width: 860px;
    margin: 28px auto;
    padding: 0 16px 60px;
  }
  .question-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 28px;
    border-left: 5px solid #ddd;
    transition: border-color 0.3s;
  }
  .question-card.answered-correct  { border-left-color: var(--correct-border); }
  .question-card.answered-wrong    { border-left-color: var(--wrong-border); }
  .question-card.answered-partial  { border-left-color: var(--aws-orange); }
  .q-header {
    display: flex;
    gap: 12px;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .q-num {
    font-size: 0.75rem;
    font-weight: 700;
    background: var(--aws-navy);
    color: #fff;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .q-text {
    font-size: 0.97rem;
    font-weight: 600;
    line-height: 1.5;
  }
  .multi-badge {
    font-size: 0.72rem;
    background: var(--aws-orange);
    color: #fff;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
    white-space: nowrap;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .option-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    font-size: 0.92rem;
  }
  .option-label:hover { border-color: var(--aws-orange); background: #fff8ec; }
  .option-label input { flex-shrink: 0; margin-top: 3px; accent-color: var(--aws-orange); }
  .option-label .letter {
    font-weight: 700;
    color: var(--aws-navy);
    flex-shrink: 0;
    min-width: 22px;
  }
  /* Feedback states applied after submit */
  .option-label.correct {
    border-color: var(--correct-border);
    background: var(--correct-bg);
  }
  .option-label.wrong {
    border-color: var(--wrong-border);
    background: var(--wrong-bg);
  }
  .option-label.disabled { cursor: default; pointer-events: none; }
  .option-label.correct::after { content: " ✓"; color: var(--correct-border); font-weight: 700; }
  .option-label.wrong::after   { content: " ✗"; color: var(--wrong-border); font-weight: 700; }
  .submit-btn {
    display: inline-block;
    padding: 9px 22px;
    background: var(--aws-navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .submit-btn:hover { background: var(--aws-orange); }
  .submit-btn:disabled { background: #aaa; cursor: default; }
  /* Explanation details */
  .explanation {
    margin-top: 16px;
    border-radius: 8px;
    border: 1px solid #d0d0d0;
    overflow: hidden;
  }
  .explanation summary {
    list-style: none;
    padding: 10px 16px;
    background: #f0f0f0;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  .explanation summary::-webkit-details-marker { display: none; }
  .explanation summary::before {
    content: "▶";
    font-size: 0.7rem;
    transition: transform 0.2s;
  }
  .explanation[open] summary::before { transform: rotate(90deg); }
  .explanation-body {
    padding: 14px 16px;
    font-size: 0.9rem;
    line-height: 1.65;
    background: #fafafa;
    border-top: 1px solid #d0d0d0;
  }
  .result-badge {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .result-badge.correct { background: var(--correct-bg); color: var(--correct-border); border: 1px solid var(--correct-border); }
  .result-badge.wrong   { background: var(--wrong-bg); color: var(--wrong-border); border: 1px solid var(--wrong-border); }
  .result-badge.partial { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
  /* Score panel */
  #score-panel {
    display: none;
    background: var(--aws-navy);
    color: #fff;
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    margin-bottom: 40px;
    box-shadow: var(--shadow);
  }
  #score-panel h2 { font-size: 1.5rem; margin-bottom: 8px; }
  #score-panel .score-num { font-size: 3rem; font-weight: 900; color: var(--aws-orange); }
  #score-panel .score-pct { font-size: 1.1rem; color: #ccc; margin-bottom: 16px; }
  #score-panel .score-grade { font-size: 1rem; }
  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .question-card { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div style="flex:1">
    <h1>☁️ <span>Practice Test 1</span></h1>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  </div>
  <div id="progress-text">0 / 120 answered</div>
</header>
<main>
  <div id="score-panel">
    <h2>Quiz Complete!</h2>
    <div class="score-num" id="score-correct">0</div>
    <div class="score-pct" id="score-pct">out of 120 questions</div>
    <div class="score-grade" id="score-grade"></div>
  </div>
  <div id="questions"></div>
</main>
<script>
const QUESTIONS = [{"num": 1, "text": "A machine learning team is building a model to predict customer churn for a subscription service. They have historical data with labeled outcomes showing which customers canceled. Which type of machine learning approach is most appropriate for this use case?", "options": [{"letter": "A", "text": "Unsupervised learning with k-means clustering"}, {"letter": "B", "text": "Reinforcement learning with a reward function"}, {"letter": "C", "text": "Supervised learning with a classification algorithm"}, {"letter": "D", "text": "Semi-supervised learning with autoencoders"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSince the team has labeled historical data (customers who did or did not churn), this is a supervised learning classification problem. Unsupervised learning would be used when labels are not available. Reinforcement learning is for sequential decision-making with rewards, not for predicting outcomes from historical data. Semi-supervised learning is used when only a small portion of data is labeled.", "multi": false}, {"num": 2, "text": "A data scientist is analyzing customer purchase behavior to identify distinct groups for targeted marketing campaigns. The dataset contains transaction history but no predefined categories. Which machine learning approach should they use?", "options": [{"letter": "A", "text": "Supervised learning with logistic regression"}, {"letter": "B", "text": "Unsupervised learning with clustering algorithms"}, {"letter": "C", "text": "Supervised learning with random forests"}, {"letter": "D", "text": "Reinforcement learning with Q-learning"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nWhen there are no predefined categories or labels and the goal is to discover natural groupings in data, unsupervised learning with clustering is the appropriate approach. Supervised learning requires labeled data. Reinforcement learning is designed for sequential decision-making problems, not pattern discovery in static datasets.", "multi": false}, {"num": 3, "text": "A company is training a deep learning model to classify medical images. The model performs well on training data but poorly on unseen test data. Which technique would MOST likely help address this issue?", "options": [{"letter": "A", "text": "Applying regularization techniques such as dropout"}, {"letter": "B", "text": "Increasing the number of layers in the neural network"}, {"letter": "C", "text": "Removing the validation dataset from the pipeline"}, {"letter": "D", "text": "Increasing the learning rate significantly"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nThe described scenario is classic overfitting, where the model memorizes training data but fails to generalize. Regularization techniques like dropout help prevent overfitting by randomly disabling neurons during training. Increasing network depth or learning rate could worsen overfitting. Removing the validation dataset would eliminate the ability to detect overfitting early.", "multi": false}, {"num": 4, "text": "A team is evaluating a binary classification model for fraud detection where fraudulent transactions are rare (0.1% of total). The model achieves 99.9% accuracy. Which metric would provide the MOST useful evaluation of model performance?", "options": [{"letter": "A", "text": "Precision and recall (F1 score)"}, {"letter": "B", "text": "Training loss"}, {"letter": "C", "text": "Overall accuracy"}, {"letter": "D", "text": "Mean absolute error"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nWith highly imbalanced datasets, accuracy is misleading because a model that predicts all transactions as non-fraudulent would still achieve 99.9% accuracy. Precision and recall (combined in the F1 score) measure how well the model identifies actual fraud cases. Training loss measures optimization progress, not real-world performance. Mean absolute error is used for regression problems.", "multi": false}, {"num": 5, "text": "A data scientist wants to reduce the dimensionality of a dataset with 500 features before training a model. They need to retain as much variance in the data as possible. Which technique is MOST appropriate?", "options": [{"letter": "A", "text": "L1 regularization (Lasso)"}, {"letter": "B", "text": "K-nearest neighbors"}, {"letter": "C", "text": "Gradient boosting"}, {"letter": "D", "text": "Principal Component Analysis (PCA)"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nPCA is a dimensionality reduction technique that transforms features into principal components while retaining maximum variance. L1 regularization performs feature selection but doesn't transform features. Gradient boosting is an ensemble learning method, not a dimensionality reduction technique. K-nearest neighbors is a classification/regression algorithm.", "multi": false}, {"num": 6, "text": "A company is using Amazon SageMaker to train a model. They need to automatically find the best combination of hyperparameters to optimize model performance. Which SageMaker feature should they use?", "options": [{"letter": "A", "text": "SageMaker Data Wrangler"}, {"letter": "B", "text": "SageMaker Feature Store"}, {"letter": "C", "text": "SageMaker Automatic Model Tuning (Hyperparameter Optimization)"}, {"letter": "D", "text": "SageMaker Model Monitor"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSageMaker Automatic Model Tuning (also called Hyperparameter Optimization) automatically searches for the best hyperparameter combinations using Bayesian optimization or other strategies. Data Wrangler is for data preparation and transformation. Feature Store manages ML features. Model Monitor detects data drift in deployed models.", "multi": false}, {"num": 7, "text": "A team is building a convolutional neural network (CNN) for image classification. Which layer type is primarily responsible for detecting spatial features like edges and textures in input images?", "options": [{"letter": "A", "text": "Convolutional layers with filters/kernels"}, {"letter": "B", "text": "Recurrent layers"}, {"letter": "C", "text": "Fully connected (dense) layers"}, {"letter": "D", "text": "Embedding layers"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nConvolutional layers apply learnable filters/kernels across the input image to detect spatial features such as edges, textures, and patterns. Fully connected layers combine features for final classification but don't detect spatial patterns. Recurrent layers process sequential data. Embedding layers convert categorical data into dense vectors.", "multi": false}, {"num": 8, "text": "A company is developing a time-series forecasting model to predict stock prices based on historical sequential data. Which neural network architecture is BEST suited for capturing temporal dependencies in this data?", "options": [{"letter": "A", "text": "Convolutional Neural Network (CNN)"}, {"letter": "B", "text": "Generative Adversarial Network (GAN)"}, {"letter": "C", "text": "Recurrent Neural Network (RNN) or LSTM"}, {"letter": "D", "text": "Feedforward Neural Network"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nRNNs and LSTMs are specifically designed to process sequential data and capture temporal dependencies through their recurrent connections and memory mechanisms. CNNs are optimized for spatial data like images. GANs are used for data generation. Feedforward networks don't have memory of previous inputs needed for sequence modeling.", "multi": false}, {"num": 9, "text": "A machine learning engineer is splitting their dataset for model development. They want to ensure proper evaluation while maximizing training data usage for a small dataset of 2,000 samples. Which approach is MOST appropriate?", "options": [{"letter": "A", "text": "Using 100% of the data for training and evaluating on the same data"}, {"letter": "B", "text": "Using a 95/5 train/test split with no validation set"}, {"letter": "C", "text": "K-fold cross-validation"}, {"letter": "D", "text": "Training only on the most recent 50% of data"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nK-fold cross-validation maximizes both training data usage and evaluation reliability by rotating which portion serves as the test set across multiple folds. Training and evaluating on the same data leads to overfitting without detection. A 95/5 split provides too few test samples for reliable evaluation. Using only recent data wastes valuable training samples.", "multi": false}, {"num": 10, "text": "A data scientist notices that their gradient boosting model has high variance and is overfitting the training data. Which combination of techniques would MOST effectively address this? (Select TWO)", "options": [{"letter": "A", "text": "Increasing the maximum tree depth"}, {"letter": "B", "text": "Reducing the learning rate and increasing the number of estimators"}, {"letter": "C", "text": "Removing all regularization parameters"}, {"letter": "D", "text": "Adding L2 regularization and limiting tree depth"}, {"letter": "E", "text": "Converting the problem to unsupervised learning"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nReducing the learning rate with more estimators creates a more gradual learning process that generalizes better. L2 regularization penalizes complex models and limiting tree depth prevents individual trees from memorizing training data. Increasing tree depth or removing regularization would worsen overfitting. Converting to unsupervised learning changes the problem entirely.", "multi": true}, {"num": 11, "text": "A company wants to deploy a machine learning model that predicts whether loan applications should be approved or denied. The model needs to minimize the number of approved loans that actually default. Which metric should they prioritize?", "options": [{"letter": "A", "text": "Recall (sensitivity)"}, {"letter": "B", "text": "Area Under the ROC Curve (AUC-ROC)"}, {"letter": "C", "text": "Overall accuracy"}, {"letter": "D", "text": "Precision for the \"approve\" class"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nPrecision for the approve class measures what proportion of approved loans are actually good loans (true positives among predicted positives). This directly minimizes defaults among approved loans. Recall focuses on finding all good loans, which could approve risky ones. Overall accuracy doesn't distinguish between error types. AUC-ROC measures general discriminative ability but doesn't specifically optimize for minimizing defaults.", "multi": false}, {"num": 12, "text": "A machine learning team is building a recommendation system for an e-commerce platform. They have user interaction data including clicks, purchases, and ratings. Which approach would MOST effectively leverage all these signal types?", "options": [{"letter": "A", "text": "Content-based filtering using only product descriptions"}, {"letter": "B", "text": "A simple popularity-based ranking system"}, {"letter": "C", "text": "Rule-based recommendations using only purchase history"}, {"letter": "D", "text": "Collaborative filtering combined with implicit and explicit feedback signals"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nCollaborative filtering with both implicit signals (clicks) and explicit signals (ratings, purchases) leverages all available user interaction data for comprehensive recommendations. Content-based filtering ignores user behavior patterns. Popularity-based ranking doesn't personalize. Rule-based approaches using only purchases miss valuable click and rating signals.", "multi": false}, {"num": 13, "text": "A data engineer is preparing features for a machine learning model. The dataset contains a categorical variable \"country\" with 195 unique values. Which feature engineering technique is MOST appropriate to encode this variable without creating excessive dimensionality?", "options": [{"letter": "A", "text": "One-hot encoding all 195 categories"}, {"letter": "B", "text": "Converting country names to their ASCII character sum"}, {"letter": "C", "text": "Dropping the country feature entirely"}, {"letter": "D", "text": "Target encoding (mean encoding) with proper cross-validation"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nTarget encoding replaces each category with the mean of the target variable for that category, creating a single numeric feature regardless of cardinality. One-hot encoding 195 categories creates excessive dimensionality and sparse features. Dropping the feature loses potentially valuable information. ASCII character sums have no meaningful relationship to the target variable.", "multi": false}, {"num": 14, "text": "A team is training a neural network and observes that the loss function oscillates wildly and fails to converge during training. Which adjustment is MOST likely to resolve this issue?", "options": [{"letter": "A", "text": "Reducing the learning rate"}, {"letter": "B", "text": "Increasing the batch size to the full dataset"}, {"letter": "C", "text": "Adding more hidden layers"}, {"letter": "D", "text": "Removing all activation functions"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nOscillating loss that fails to converge is a classic sign of a learning rate that is too high, causing gradient descent to overshoot the minimum. Reducing the learning rate allows smaller, more stable steps toward convergence. Using the full dataset as batch size would slow training significantly. Adding layers increases complexity. Removing activation functions eliminates the network's ability to learn non-linear patterns.", "multi": false}, {"num": 15, "text": "A company wants to build a complete ML pipeline on AWS that includes data preparation, model training, and deployment. They need an integrated development environment with built-in algorithms and notebook support. Which AWS service provides this end-to-end capability?", "options": [{"letter": "A", "text": "AWS Lambda"}, {"letter": "B", "text": "Amazon SageMaker"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "AWS Glue"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker provides a complete ML platform with Jupyter notebooks, built-in algorithms, training infrastructure, and deployment capabilities for end-to-end ML workflows. AWS Lambda is for serverless computing, not ML development. Amazon Comprehend is a pre-built NLP service, not a development platform. AWS Glue is for ETL data processing, not model development.", "multi": false}, {"num": 16, "text": "A data scientist is evaluating a regression model that predicts house prices. Which metric is MOST appropriate for measuring how far predictions deviate from actual values in the same unit as the target variable?", "options": [{"letter": "A", "text": "AUC-ROC"}, {"letter": "B", "text": "F1 Score"}, {"letter": "C", "text": "Root Mean Squared Error (RMSE)"}, {"letter": "D", "text": "Log loss"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nRMSE measures prediction error in the same units as the target variable (dollars for house prices), making it directly interpretable. AUC-ROC and F1 Score are classification metrics, not applicable to regression. Log loss measures probability calibration for classification tasks, not regression prediction accuracy.", "multi": false}, {"num": 17, "text": "A machine learning engineer is implementing an ensemble method that trains multiple decision trees on random subsets of features and data, then aggregates their predictions by majority vote. Which algorithm does this describe?", "options": [{"letter": "A", "text": "Gradient Boosting"}, {"letter": "B", "text": "AdaBoost"}, {"letter": "C", "text": "Random Forest"}, {"letter": "D", "text": "Support Vector Machine"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nRandom Forest trains multiple decision trees on random subsets of both data (bagging) and features, then aggregates predictions through majority voting (classification) or averaging (regression). Gradient Boosting trains trees sequentially to correct previous errors. AdaBoost adjusts sample weights based on misclassifications. SVMs find optimal hyperplanes for classification.", "multi": false}, {"num": 18, "text": "A team is working with a dataset where 5% of samples belong to the positive class and 95% to the negative class. They need to train a classifier that performs well on the minority class. Which strategies would help address this class imbalance? (Select TWO)", "options": [{"letter": "A", "text": "Using SMOTE (Synthetic Minority Over-sampling Technique) to generate synthetic samples"}, {"letter": "B", "text": "Removing all minority class samples to simplify the problem"}, {"letter": "C", "text": "Adjusting class weights in the loss function to penalize minority class errors more heavily"}, {"letter": "D", "text": "Increasing the decision threshold to 0.99"}, {"letter": "E", "text": "Using only accuracy as the evaluation metric"}], "correct": ["A", "C"], "explanation": "<strong>Explanation:</strong>\nSMOTE creates synthetic examples of the minority class to balance the dataset distribution. Adjusting class weights makes the model pay more attention to minority class errors during training. Removing minority samples eliminates the signal entirely. A very high threshold would classify almost nothing as positive. Accuracy is misleading with imbalanced data.", "multi": true}, {"num": 19, "text": "A company uses Amazon SageMaker to manage their ML workflow. They need to store, discover, and share curated features across multiple ML projects and teams. Which SageMaker component serves this purpose?", "options": [{"letter": "A", "text": "SageMaker Model Registry"}, {"letter": "B", "text": "SageMaker Feature Store"}, {"letter": "C", "text": "SageMaker Experiments"}, {"letter": "D", "text": "SageMaker Pipelines"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nSageMaker Feature Store is a centralized repository for storing, sharing, and managing ML features across teams and projects, supporting both online (low-latency) and offline (batch) access patterns. Model Registry manages model versions. Experiments tracks training runs. Pipelines orchestrates ML workflows.", "multi": false}, {"num": 20, "text": "A data scientist is training a logistic regression model and wants to prevent overfitting while also performing automatic feature selection by driving some feature coefficients to exactly zero. Which regularization technique should they apply?", "options": [{"letter": "A", "text": "Elastic Net with alpha = 0"}, {"letter": "B", "text": "L2 regularization (Ridge)"}, {"letter": "C", "text": "L1 regularization (Lasso)"}, {"letter": "D", "text": "No regularization with early stopping"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nL1 regularization (Lasso) adds the absolute value of coefficients as a penalty, which can drive coefficients to exactly zero, effectively performing feature selection. L2 regularization (Ridge) shrinks coefficients toward zero but rarely makes them exactly zero. Elastic Net with alpha=0 is equivalent to pure L2. Early stopping without regularization doesn't provide feature selection.", "multi": false}, {"num": 21, "text": "A machine learning team wants to track and compare multiple training experiments, including hyperparameters, metrics, and artifacts. Which Amazon SageMaker capability enables this systematic experiment tracking?", "options": [{"letter": "A", "text": "SageMaker Ground Truth"}, {"letter": "B", "text": "SageMaker Experiments"}, {"letter": "C", "text": "SageMaker Debugger"}, {"letter": "D", "text": "SageMaker Neo"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nSageMaker Experiments enables tracking, organizing, and comparing ML experiments including hyperparameters, metrics, and model artifacts across multiple training runs. Ground Truth is for data labeling. Debugger monitors training issues in real-time. Neo optimizes models for deployment on edge devices.", "multi": false}, {"num": 22, "text": "A company is building a fraud detection model and needs to understand which features contribute most to individual predictions for regulatory compliance. Which technique provides instance-level feature importance explanations?", "options": [{"letter": "A", "text": "Global feature importance from random forests"}, {"letter": "B", "text": "SHAP (SHapley Additive exPlanations) values"}, {"letter": "C", "text": "Confusion matrix analysis"}, {"letter": "D", "text": "Learning curve plots"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nSHAP values provide instance-level (local) explanations showing how each feature contributes to a specific prediction, which is essential for regulatory compliance. Global feature importance shows overall importance but not per-prediction reasoning. Confusion matrices show aggregate performance. Learning curves show training progress, not feature contributions.", "multi": false}, {"num": 23, "text": "A machine learning engineer observes that their model's training loss continues decreasing while validation loss starts increasing after epoch 50. Which strategy directly addresses this behavior?", "options": [{"letter": "A", "text": "Training for more epochs to allow further optimization"}, {"letter": "B", "text": "Increasing model complexity with additional layers"}, {"letter": "C", "text": "Implementing early stopping based on validation loss"}, {"letter": "D", "text": "Using a larger learning rate for faster convergence"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nWhen training loss decreases but validation loss increases, the model is overfitting. Early stopping halts training when validation loss stops improving, preventing further overfitting. Training for more epochs or increasing complexity would worsen overfitting. A larger learning rate might cause instability but doesn't address the fundamental overfitting issue.", "multi": false}, {"num": 24, "text": "A team is using gradient descent to optimize a neural network. They notice training is very slow with their dataset of 10 million samples. Which variant of gradient descent balances computational efficiency with stable convergence?", "options": [{"letter": "A", "text": "Batch gradient descent using all samples per update"}, {"letter": "B", "text": "Stochastic gradient descent using one sample per update"}, {"letter": "C", "text": "Mini-batch gradient descent using subsets of 32-256 samples"}, {"letter": "D", "text": "Second-order optimization using the full Hessian matrix"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nMini-batch gradient descent strikes a balance between the stability of batch gradient descent and the speed of stochastic gradient descent by computing gradients on small subsets. Full batch gradient descent is computationally expensive with 10 million samples. Pure stochastic (one sample) updates are noisy and unstable. Second-order methods with full Hessian are computationally prohibitive at this scale.", "multi": false}, {"num": 25, "text": "A company wants to understand how large language models process input text. In the transformer architecture, which mechanism allows the model to weigh the relevance of different parts of the input when generating each output token?", "options": [{"letter": "A", "text": "Batch normalization"}, {"letter": "B", "text": "Dropout regularization"}, {"letter": "C", "text": "Self-attention mechanism"}, {"letter": "D", "text": "Pooling layers"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nThe self-attention mechanism in transformers computes relevance scores between all positions in the input sequence, allowing the model to focus on the most relevant parts when processing each token. Batch normalization normalizes activations for training stability. Dropout is a regularization technique. Pooling layers reduce spatial dimensions in CNNs.", "multi": false}, {"num": 26, "text": "A team is evaluating different foundation models for their text generation application. They need a model that can handle multiple languages and produce high-quality creative content. Which characteristic of foundation models makes this possible without training from scratch?", "options": [{"letter": "A", "text": "Foundation models are pre-trained on massive diverse datasets and can be adapted to many tasks"}, {"letter": "B", "text": "Foundation models are small models designed for single tasks"}, {"letter": "C", "text": "Foundation models only work with English language data"}, {"letter": "D", "text": "Foundation models require task-specific architectures for each use case"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nFoundation models are trained on massive, diverse datasets spanning multiple languages and domains, giving them broad capabilities that can be adapted to specific tasks without training from scratch. They are typically very large (not small), multilingual (not English-only), and use general architectures like transformers that handle multiple tasks.", "multi": false}, {"num": 27, "text": "A developer is using a large language model and wants to get accurate answers about recent company policies without any examples in the prompt. They simply ask the question directly. Which prompting technique does this describe?", "options": [{"letter": "A", "text": "Few-shot prompting"}, {"letter": "B", "text": "Chain-of-thought prompting"}, {"letter": "C", "text": "Zero-shot prompting"}, {"letter": "D", "text": "Retrieval-augmented generation"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nZero-shot prompting involves giving the model a task or question without providing any examples, relying on the model's pre-trained knowledge to generate a response. Few-shot provides examples in the prompt. Chain-of-thought asks the model to reason step by step. RAG retrieves external documents to augment the prompt.", "multi": false}, {"num": 28, "text": "A data scientist is configuring an LLM for a creative writing application. They want the model to generate diverse and unexpected text rather than always choosing the most probable next token. Which parameter should they increase?", "options": [{"letter": "A", "text": "Temperature"}, {"letter": "B", "text": "Stop sequences"}, {"letter": "C", "text": "Maximum token limit"}, {"letter": "D", "text": "Top-k with k=1"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nIncreasing temperature makes the probability distribution over tokens more uniform, allowing the model to select less probable tokens more frequently, resulting in more diverse and creative output. Maximum token limit only controls output length. Stop sequences define where to end generation. Top-k=1 (greedy decoding) always selects the most probable token, reducing diversity.", "multi": false}, {"num": 29, "text": "A company is experiencing issues with their LLM-powered chatbot generating factually incorrect but confident-sounding responses about their product specifications. What is this phenomenon called?", "options": [{"letter": "A", "text": "Hallucination"}, {"letter": "B", "text": "Catastrophic forgetting"}, {"letter": "C", "text": "Model drift"}, {"letter": "D", "text": "Mode collapse"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nHallucination refers to LLMs generating plausible-sounding but factually incorrect information with high confidence. Model drift occurs when real-world data distributions change over time. Catastrophic forgetting happens when fine-tuning causes a model to lose previously learned knowledge. Mode collapse is a GAN training issue where the generator produces limited output variety.", "multi": false}, {"num": 30, "text": "A team wants to use Amazon Bedrock to access foundation models. Which statements accurately describe Amazon Bedrock's capabilities? (Select TWO)", "options": [{"letter": "A", "text": "It requires customers to manage the underlying infrastructure and GPU instances"}, {"letter": "B", "text": "It provides serverless access to foundation models from multiple providers through a unified API"}, {"letter": "C", "text": "It only supports models built by Amazon"}, {"letter": "D", "text": "It allows customization of foundation models with proprietary data without managing infrastructure"}, {"letter": "E", "text": "It requires deploying models to customer-owned EC2 instances"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nAmazon Bedrock is a fully managed, serverless service providing access to foundation models from Amazon (Titan), Anthropic (Claude), Meta (Llama), and others through a single API. It also supports model customization with proprietary data without infrastructure management. Customers don't manage GPU instances or deploy to EC2.", "multi": true}, {"num": 31, "text": "A developer wants to improve their LLM's performance on complex reasoning tasks. They modify their prompt to include the instruction \"Let's think through this step by step\" before the question. Which prompting technique is this?", "options": [{"letter": "A", "text": "Few-shot prompting"}, {"letter": "B", "text": "Zero-shot prompting"}, {"letter": "C", "text": "Chain-of-thought prompting"}, {"letter": "D", "text": "Instruction tuning"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nChain-of-thought prompting encourages the model to break down complex problems into intermediate reasoning steps, often triggered by phrases like \"let's think step by step.\" This improves performance on math, logic, and multi-step reasoning tasks. Few-shot provides examples. Zero-shot gives no examples or reasoning guidance. Instruction tuning is a training technique, not a prompting method.", "multi": false}, {"num": 32, "text": "A machine learning engineer needs to convert raw text into numerical representations that capture semantic meaning for use in a natural language processing model. Which technique transforms words into dense vector representations where similar words have similar vectors?", "options": [{"letter": "A", "text": "One-hot encoding"}, {"letter": "B", "text": "Word embeddings (Word2Vec/GloVe)"}, {"letter": "C", "text": "Bag of words with TF-IDF"}, {"letter": "D", "text": "ASCII character encoding"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nWord embeddings like Word2Vec and GloVe create dense vector representations where semantically similar words are mapped to nearby points in the vector space. One-hot encoding creates sparse, high-dimensional vectors without semantic relationships. TF-IDF captures term frequency but not semantic similarity. ASCII encoding has no linguistic meaning.", "multi": false}, {"num": 33, "text": "A company has a pre-trained foundation model and wants to adapt it to their specific domain (medical literature) while keeping computational costs low. They have a small labeled dataset of 5,000 medical documents. Which approach is MOST cost-effective?", "options": [{"letter": "A", "text": "Pre-training a new model from scratch on medical data"}, {"letter": "B", "text": "Training a traditional rule-based system instead"}, {"letter": "C", "text": "Using only zero-shot prompting without any adaptation"}, {"letter": "D", "text": "Fine-tuning the foundation model on the medical dataset"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nFine-tuning adapts a pre-trained model to a specific domain using a relatively small labeled dataset, leveraging the model's existing knowledge while learning domain-specific patterns cost-effectively. Pre-training from scratch requires massive data and compute. Zero-shot prompting alone may not capture domain-specific nuances. Rule-based systems cannot handle the complexity of medical language.", "multi": false}, {"num": 34, "text": "A team is building an LLM application and needs to control the randomness of text generation. They want the model to consider only the top 90% cumulative probability of tokens at each step. Which parameter controls this behavior?", "options": [{"letter": "A", "text": "Temperature"}, {"letter": "B", "text": "Top-p (nucleus sampling)"}, {"letter": "C", "text": "Maximum sequence length"}, {"letter": "D", "text": "Frequency penalty"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nTop-p (nucleus sampling) filters the token vocabulary to the smallest set whose cumulative probability exceeds the threshold p (0.9 in this case), then samples from this reduced set. Temperature scales the entire probability distribution but doesn't set a cumulative threshold. Maximum sequence length controls output length. Frequency penalty reduces repetition.", "multi": false}, {"num": 35, "text": "A company wants to improve an existing LLM's ability to follow specific instructions and align with human preferences. Which training technique uses human feedback to optimize the model's responses after initial pre-training?", "options": [{"letter": "A", "text": "Transfer learning from a computer vision model"}, {"letter": "B", "text": "Reinforcement Learning from Human Feedback (RLHF)"}, {"letter": "C", "text": "Unsupervised pre-training with next-token prediction"}, {"letter": "D", "text": "Data augmentation with synthetic examples"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nRLHF is a post-training technique that uses human preference data to train a reward model, which then guides the LLM to generate responses that align with human expectations. Transfer learning from vision models isn't relevant to instruction following. Pre-training with next-token prediction is the initial training phase. Data augmentation doesn't incorporate human preferences.", "multi": false}, {"num": 36, "text": "A developer is working with a tokenizer for a large language model. They notice that the word \"unhappiness\" is split into [\"un\", \"happi\", \"ness\"]. What is the purpose of this subword tokenization approach?", "options": [{"letter": "A", "text": "To increase the vocabulary size to include every possible word"}, {"letter": "B", "text": "To make the text longer for more training data"}, {"letter": "C", "text": "To handle out-of-vocabulary words by breaking them into known subword units"}, {"letter": "D", "text": "To remove stop words from the input"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSubword tokenization (like BPE or WordPiece) breaks unknown or rare words into smaller known units, allowing the model to handle any word including novel compounds and morphological variants. It actually reduces vocabulary size compared to word-level tokenization. It doesn't aim to increase text length or remove stop words.", "multi": false}, {"num": 37, "text": "A team is selecting a foundation model on Amazon Bedrock for their customer service chatbot. The chatbot needs to provide accurate, factual responses and minimize creative embellishment. Which configuration approach is MOST appropriate?", "options": [{"letter": "A", "text": "Set temperature to maximum (1.0) for diverse responses"}, {"letter": "B", "text": "Use a large top-p value (0.99) to maximize vocabulary usage"}, {"letter": "C", "text": "Disable all safety guardrails for unrestricted output"}, {"letter": "D", "text": "Set a low temperature (close to 0) for deterministic, focused responses"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nA low temperature makes the model more deterministic by sharpening the probability distribution, causing it to select the most likely (and typically most factual) tokens. High temperature increases randomness and creativity. A high top-p allows too many unlikely tokens. Disabling guardrails is a safety concern unrelated to factual accuracy.", "multi": false}, {"num": 38, "text": "A company is deciding between using a pre-trained foundation model directly versus fine-tuning it for their specific task. Which factors should they consider when deciding to fine-tune? (Select TWO)", "options": [{"letter": "A", "text": "They have a large domain-specific labeled dataset that differs significantly from the model's pre-training data"}, {"letter": "B", "text": "They need the model to work immediately without any additional training time or cost"}, {"letter": "C", "text": "The pre-trained model's zero-shot performance already meets their accuracy requirements"}, {"letter": "D", "text": "They need the model to learn specialized terminology and response patterns for their industry"}, {"letter": "E", "text": "They want to minimize all computational costs and deployment time"}], "correct": ["A", "D"], "explanation": "<strong>Explanation:</strong>\nFine-tuning is most beneficial when domain-specific data differs from pre-training data and when specialized terminology or response patterns are needed. If the model already meets requirements with zero-shot performance, fine-tuning is unnecessary. Fine-tuning requires additional time and cost, so it's not chosen when immediate deployment or cost minimization is the priority.", "multi": true}, {"num": 39, "text": "A machine learning engineer is comparing different LLM architectures. Which statement BEST describes the difference between encoder-only, decoder-only, and encoder-decoder transformer models?", "options": [{"letter": "A", "text": "Encoder-only models generate text, decoder-only models classify text, encoder-decoder models do both"}, {"letter": "B", "text": "Encoder-only models are best for understanding tasks (classification), decoder-only for generation, and encoder-decoder for sequence-to-sequence tasks like translation"}, {"letter": "C", "text": "All three architectures perform identically on all tasks"}, {"letter": "D", "text": "Encoder-only models use attention while decoder-only models use recurrence"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nEncoder-only models (like BERT) excel at understanding and classification by processing bidirectional context. Decoder-only models (like GPT) are optimized for text generation with autoregressive (left-to-right) processing. Encoder-decoder models (like T5) handle tasks requiring both input understanding and output generation, like translation or summarization. All three use attention mechanisms.", "multi": false}, {"num": 40, "text": "A developer notices that their LLM application sometimes generates text that contradicts information provided earlier in the same conversation. Which limitation of transformer-based models contributes to this issue?", "options": [{"letter": "A", "text": "Transformers cannot handle natural language at all"}, {"letter": "B", "text": "The model's inability to process any text input"}, {"letter": "C", "text": "Finite context window limiting how much prior conversation the model can reference"}, {"letter": "D", "text": "The model requires images as input to function"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nTransformers have a fixed context window (e.g., 4K, 8K, or 128K tokens), and information beyond this window is lost. In long conversations, earlier context may fall outside the window, causing inconsistencies. The other options are incorrect as transformers are specifically designed to process natural language text effectively.", "multi": false}, {"num": 41, "text": "A startup is building a generative AI application and wants to use Amazon Bedrock. They are evaluating foundation models from different providers. Which model families are available through Amazon Bedrock? (Select TWO)", "options": [{"letter": "A", "text": "OpenAI GPT-4 and GPT-3.5"}, {"letter": "B", "text": "Anthropic Claude models"}, {"letter": "C", "text": "Google PaLM exclusively"}, {"letter": "D", "text": "Amazon Titan models"}, {"letter": "E", "text": "Apple Foundation models"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nAmazon Bedrock provides access to multiple foundation model families including Anthropic Claude, Amazon Titan, Meta Llama, Mistral, Cohere, and Stability AI. OpenAI models are not available through Bedrock (they use their own API). Google PaLM and Apple models are not offered through Bedrock.", "multi": true}, {"num": 42, "text": "A data scientist is preparing a prompt that includes three examples of the desired input-output format before asking the model to complete a new task. Which prompting technique is being used?", "options": [{"letter": "A", "text": "Zero-shot prompting"}, {"letter": "B", "text": "Few-shot prompting"}, {"letter": "C", "text": "Chain-of-thought prompting"}, {"letter": "D", "text": "Instruction tuning"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nFew-shot prompting provides a small number of input-output examples within the prompt to demonstrate the desired behavior or format before presenting the actual task. Zero-shot provides no examples. Chain-of-thought focuses on reasoning steps rather than input-output examples. Instruction tuning is a model training technique, not a prompting strategy.", "multi": false}, {"num": 43, "text": "A company wants to make their pre-trained LLM better at following specific formatting instructions and refusing harmful requests. Which post-training technique specifically addresses instruction following and alignment?", "options": [{"letter": "A", "text": "Continued pre-training with more web data"}, {"letter": "B", "text": "Instruction tuning with curated prompt-response pairs"}, {"letter": "C", "text": "Reducing the model's parameter count"}, {"letter": "D", "text": "Increasing the tokenizer's vocabulary size"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nInstruction tuning fine-tunes a model on carefully curated datasets of instructions paired with desired responses, teaching the model to follow formatting requirements, answer questions helpfully, and refuse harmful requests. Continued pre-training adds general knowledge but not instruction-following ability. Reducing parameters or changing tokenizer vocabulary don't improve alignment.", "multi": false}, {"num": 44, "text": "A team is working with a generative AI model and wants to understand how the model processes input text internally. In the transformer architecture, what role do positional encodings serve?", "options": [{"letter": "A", "text": "They determine the model's output language"}, {"letter": "B", "text": "They provide information about the order/position of tokens in the sequence since attention is position-agnostic"}, {"letter": "C", "text": "They encrypt the input for security purposes"}, {"letter": "D", "text": "They compress the input to reduce memory usage"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nSelf-attention mechanisms are inherently permutation-invariant (they don't inherently know token order), so positional encodings are added to provide sequence position information. Without them, the model would treat \"the cat sat on the mat\" and \"mat the on sat cat the\" identically. They don't determine output language, provide encryption, or compress input.", "multi": false}, {"num": 45, "text": "A company is building a customer support system using generative AI. They want to prevent the model from generating responses about competitor products or making financial promises. Which Amazon Bedrock feature is MOST appropriate for implementing these content restrictions?", "options": [{"letter": "A", "text": "Amazon Bedrock Knowledge Bases"}, {"letter": "B", "text": "Amazon Bedrock Agents"}, {"letter": "C", "text": "Amazon Bedrock Model Evaluation"}, {"letter": "D", "text": "Amazon Bedrock Guardrails"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nBedrock Guardrails allows configuration of content filters, denied topics, and word filters to prevent models from generating specific types of content or discussing restricted topics. Knowledge Bases connect models to external data sources. Agents enable multi-step task execution. Model Evaluation assesses model performance on benchmarks.", "multi": false}, {"num": 46, "text": "A developer is designing a prompt for an LLM to extract structured data from unstructured text. Which prompt engineering best practice would MOST improve extraction accuracy?", "options": [{"letter": "A", "text": "Making the prompt as short as possible with no context"}, {"letter": "B", "text": "Asking the model to be creative in its response format"}, {"letter": "C", "text": "Providing a clear output schema/format specification with examples of the expected JSON structure"}, {"letter": "D", "text": "Using maximum temperature for diverse interpretations"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nFor structured data extraction, providing explicit output format specifications with examples ensures the model understands exactly what structure to produce. Short prompts without context lead to ambiguous outputs. Encouraging creativity produces inconsistent formats. High temperature introduces randomness that harms extraction precision.", "multi": false}, {"num": 47, "text": "A machine learning team is training a large language model from scratch. During the pre-training phase, which objective is MOST commonly used for decoder-only models like GPT?", "options": [{"letter": "A", "text": "Masked language modeling (predicting randomly masked tokens)"}, {"letter": "B", "text": "Named entity recognition"}, {"letter": "C", "text": "Image classification"}, {"letter": "D", "text": "Next-token prediction (causal language modeling)"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nDecoder-only models like GPT are pre-trained with causal language modeling, where the model predicts the next token given all previous tokens in a left-to-right fashion. Masked language modeling (predicting masked tokens using bidirectional context) is used for encoder-only models like BERT. Image classification and NER are downstream tasks, not pre-training objectives.", "multi": false}, {"num": 48, "text": "A company wants to reduce hallucinations in their generative AI application that answers questions about their internal documentation. Which approach would MOST effectively reduce hallucinations while maintaining response quality?", "options": [{"letter": "A", "text": "Retrieval-Augmented Generation (RAG) that grounds responses in retrieved documents"}, {"letter": "B", "text": "Increasing the temperature parameter to explore more diverse responses"}, {"letter": "C", "text": "Removing all system prompts to give the model more freedom"}, {"letter": "D", "text": "Using a smaller model with fewer parameters"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nRAG reduces hallucinations by retrieving relevant documents and including them in the context, allowing the model to generate responses grounded in factual source material. Increasing temperature would increase randomness and potentially more hallucinations. Removing system prompts reduces control. Smaller models may hallucinate more due to less learned knowledge.", "multi": false}, {"num": 49, "text": "A developer is working with Amazon Bedrock and wants to understand model pricing. How does Amazon Bedrock typically charge for foundation model usage?", "options": [{"letter": "A", "text": "A fixed monthly subscription regardless of usage"}, {"letter": "B", "text": "Per input/output token processed, with on-demand and provisioned throughput options"}, {"letter": "C", "text": "Only based on the number of API calls made, regardless of prompt length"}, {"letter": "D", "text": "Free tier only with no paid option"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Bedrock charges based on tokens processed (input and output tokens), with on-demand pricing for variable workloads and provisioned throughput for predictable, high-volume usage at committed rates. It's not a flat subscription, not purely per-call regardless of size, and while there may be free tier for experimentation, paid usage is token-based.", "multi": false}, {"num": 50, "text": "A team is evaluating whether to use a generative AI model or a traditional ML model for their task. Which use case is BEST suited for a generative AI foundation model rather than a traditional supervised learning approach?", "options": [{"letter": "A", "text": "Generating natural language summaries of long documents with varied topics"}, {"letter": "B", "text": "Predicting a single numeric value from tabular data with clear features"}, {"letter": "C", "text": "Binary classification on structured data with millions of labeled examples"}, {"letter": "D", "text": "Time-series forecasting with well-defined numerical inputs"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nGenerative AI models excel at open-ended natural language tasks like summarization across varied topics where the output is creative text. Traditional ML models are often more efficient and appropriate for structured prediction tasks (numeric regression, binary classification on tabular data, time-series forecasting) where inputs and outputs are well-defined.", "multi": false}, {"num": 51, "text": "A company has fine-tuned a foundation model and wants to prevent it from losing the general capabilities it learned during pre-training while adapting to their specific domain. What is this phenomenon of losing previously learned knowledge called?", "options": [{"letter": "A", "text": "Overfitting"}, {"letter": "B", "text": "Catastrophic forgetting"}, {"letter": "C", "text": "Underfitting"}, {"letter": "D", "text": "Gradient vanishing"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nCatastrophic forgetting occurs when fine-tuning on new data causes the model to lose knowledge acquired during pre-training or earlier training stages. Overfitting is memorizing training data rather than generalizing. Underfitting is failing to capture patterns. Gradient vanishing is a training difficulty in deep networks where gradients become too small.", "multi": false}, {"num": 52, "text": "A developer is building a multi-turn conversational AI system. They need the model to maintain context from previous messages in the conversation. Which approach enables the model to reference earlier parts of the dialogue?", "options": [{"letter": "A", "text": "Training a new model for each conversation turn"}, {"letter": "B", "text": "Including the conversation history in the prompt context window"}, {"letter": "C", "text": "Using a separate model for each message"}, {"letter": "D", "text": "Resetting the model's weights after each response"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nSince LLMs are stateless (they don't retain information between API calls), conversation history must be passed in the prompt context window for each turn to maintain coherence. Training a new model per turn is impractical. Using separate models fragments context. Resetting weights would destroy all learned knowledge.", "multi": false}, {"num": 53, "text": "A team is using prompt engineering to improve their LLM application. They want to assign the model a specific persona and set of behavioral guidelines that persist across all user interactions. Where should they place these instructions?", "options": [{"letter": "A", "text": "In the system prompt/message"}, {"letter": "B", "text": "In the user message of each turn"}, {"letter": "C", "text": "In the model's tokenizer configuration"}, {"letter": "D", "text": "In the API authentication headers"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nThe system prompt/message is designed for persistent instructions, persona definitions, and behavioral guidelines that apply across all interactions. User messages contain the actual queries. The tokenizer configuration handles text-to-token conversion, not behavioral instructions. Authentication headers handle security, not model behavior.", "multi": false}, {"num": 54, "text": "A company wants to build a question-answering system that can respond accurately about their internal knowledge base of 50,000 documents. They want to minimize hallucinations and keep information current without retraining the model. Which Amazon Bedrock feature should they use?", "options": [{"letter": "A", "text": "Amazon Bedrock Model Evaluation"}, {"letter": "B", "text": "Amazon Bedrock Guardrails"}, {"letter": "C", "text": "Amazon Bedrock Knowledge Bases with RAG"}, {"letter": "D", "text": "Amazon Bedrock Custom Model Import"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nBedrock Knowledge Bases implements RAG by automatically chunking, embedding, and indexing documents into a vector store, then retrieving relevant context for each query. This grounds responses in actual documents, reducing hallucinations and keeping information current without retraining. Model Evaluation benchmarks models. Guardrails filter content. Custom Model Import brings external models to Bedrock.", "multi": false}, {"num": 55, "text": "A development team is building an AI assistant that needs to autonomously perform multi-step tasks like booking travel, including searching for flights, comparing prices, and making reservations through external APIs. Which Amazon Bedrock capability enables this?", "options": [{"letter": "A", "text": "Amazon Bedrock Agents"}, {"letter": "B", "text": "Amazon Bedrock Knowledge Bases"}, {"letter": "C", "text": "Amazon Bedrock Guardrails"}, {"letter": "D", "text": "Amazon Bedrock Model Evaluation"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nBedrock Agents enable foundation models to autonomously plan and execute multi-step tasks by connecting to external APIs and data sources through action groups. They can break down complex requests, call APIs, and orchestrate workflows. Knowledge Bases provide document retrieval. Guardrails filter content. Model Evaluation assesses model quality.", "multi": false}, {"num": 56, "text": "A company is implementing RAG and needs to store document embeddings for fast similarity search. Which type of database is specifically designed for storing and querying high-dimensional vector embeddings?", "options": [{"letter": "A", "text": "Vector database (Amazon OpenSearch Serverless with vector engine)"}, {"letter": "B", "text": "Key-value store (Amazon DynamoDB)"}, {"letter": "C", "text": "Relational database (Amazon RDS)"}, {"letter": "D", "text": "Graph database (Amazon Neptune)"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nVector databases are optimized for storing high-dimensional embeddings and performing efficient similarity searches using algorithms like approximate nearest neighbor (ANN). Relational databases handle structured data with SQL queries. Key-value stores are for simple lookups. Graph databases model relationships between entities, not vector similarity.", "multi": false}, {"num": 57, "text": "A software development team wants to use AI to help developers write code faster, get code suggestions inline, and generate code from natural language comments. Which AWS service is designed for this purpose?", "options": [{"letter": "A", "text": "Amazon Q Developer (formerly CodeWhisperer)"}, {"letter": "B", "text": "Amazon CodeGuru"}, {"letter": "C", "text": "AWS CloudFormation"}, {"letter": "D", "text": "Amazon SageMaker Autopilot"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Q Developer (formerly CodeWhisperer) is an AI-powered coding companion that provides real-time code suggestions, generates code from natural language comments, and assists with code completion within IDEs. CodeGuru provides code reviews and performance recommendations. CloudFormation is for infrastructure as code. SageMaker Autopilot automates ML model building.", "multi": false}, {"num": 58, "text": "A company wants to fine-tune a foundation model in Amazon Bedrock using their proprietary customer interaction data. Which requirement must they meet for the training data?", "options": [{"letter": "A", "text": "Training data must be publicly available on the internet"}, {"letter": "B", "text": "Training data must be stored in Amazon S3 in the supported format (JSONL with prompt-completion pairs)"}, {"letter": "C", "text": "Training data must be stored in Amazon DynamoDB"}, {"letter": "D", "text": "Training data must be at least 1 TB in size"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nBedrock fine-tuning requires training data stored in Amazon S3 in specific formats like JSONL with prompt-completion pairs. The data doesn't need to be public - private proprietary data is the typical use case. DynamoDB is not a supported source for fine-tuning data. There's no minimum 1 TB requirement; fine-tuning works with relatively small datasets.", "multi": false}, {"num": 59, "text": "A company is building a generative AI application using Amazon Bedrock Knowledge Bases. They need their documents chunked appropriately for retrieval. Which chunking strategy would work BEST for technical documentation with clear section boundaries?", "options": [{"letter": "A", "text": "Fixed-size chunking with 50-character chunks regardless of content"}, {"letter": "B", "text": "Random chunking with overlapping segments of varying sizes"}, {"letter": "C", "text": "No chunking - using entire documents as single retrievable units"}, {"letter": "D", "text": "Hierarchical chunking that respects document structure (sections and paragraphs)"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nHierarchical chunking preserves semantic coherence by following document structure, keeping related content together within sections and paragraphs. Very small fixed-size chunks may split important context. Using entire documents as single units returns too much irrelevant content and may exceed context windows. Random chunking disregards content structure.", "multi": false}, {"num": 60, "text": "A company is using Amazon Q to help employees find information across their enterprise systems. Which statement BEST describes Amazon Q's primary capability?", "options": [{"letter": "A", "text": "It is a vector database for storing embeddings"}, {"letter": "B", "text": "It is a generative AI-powered assistant that connects to enterprise data sources to provide contextual answers and complete tasks"}, {"letter": "C", "text": "It is a model training platform for building custom LLMs"}, {"letter": "D", "text": "It is a data labeling tool for supervised learning"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Q is an enterprise generative AI assistant that integrates with various data sources (wikis, documents, ticketing systems) to provide contextual answers, generate content, and automate tasks within enterprise workflows. It's not a vector database, model training platform, or data labeling tool.", "multi": false}, {"num": 61, "text": "A team wants to build a no-code generative AI application for rapid prototyping and experimentation with foundation models. Which AWS tool allows business users to create AI-powered applications without writing code?", "options": [{"letter": "A", "text": "PartyRock (Amazon Bedrock Playground)"}, {"letter": "B", "text": "Amazon SageMaker Studio"}, {"letter": "C", "text": "AWS CloudFormation"}, {"letter": "D", "text": "Amazon EMR"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nPartyRock is a no-code playground built on Amazon Bedrock that allows anyone to create, share, and experiment with generative AI applications without writing code or needing an AWS account. SageMaker Studio requires coding expertise. CloudFormation is for infrastructure provisioning. EMR is for big data processing.", "multi": false}, {"num": 62, "text": "A developer is implementing a RAG system and needs to decide how to generate embeddings for their documents. Which consideration is MOST important when selecting an embedding model?", "options": [{"letter": "A", "text": "The embedding model must be the same model used for text generation"}, {"letter": "B", "text": "The embedding dimensions should match the vector database configuration, and the model should be trained on similar domain data"}, {"letter": "C", "text": "Embeddings should always be exactly 2 dimensions for visualization"}, {"letter": "D", "text": "The embedding model should only support English language text"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nThe embedding model's output dimensions must be compatible with the vector database index configuration, and domain-relevant training improves semantic similarity accuracy. The embedding and generation models are typically different. 2D embeddings lose too much information for retrieval. Multilingual support may be needed depending on the use case.", "multi": false}, {"num": 63, "text": "A company is using Amazon Bedrock Agents and needs their agent to access current inventory data from their database when answering customer questions. How should the agent be configured to access this external data?", "options": [{"letter": "A", "text": "Configure action groups with Lambda functions that query the inventory database"}, {"letter": "B", "text": "The agent should be trained on all possible inventory data combinations"}, {"letter": "C", "text": "Hard-code all inventory levels into the system prompt"}, {"letter": "D", "text": "Use a larger foundation model that has memorized the inventory data"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nBedrock Agents use action groups backed by Lambda functions to interact with external systems and databases in real-time. This allows dynamic data access without retraining. Pre-training on inventory data creates stale information. Hard-coding in prompts is impractical for changing data. No model memorizes specific business data.", "multi": false}, {"num": 64, "text": "A team is building a multi-modal AI application that needs to analyze both images and text to generate descriptions of products from photographs. Which capability of foundation models enables this?", "options": [{"letter": "A", "text": "Models that only process text input but generate image descriptions from metadata"}, {"letter": "B", "text": "Multi-modal foundation models that accept both image and text inputs and generate text outputs"}, {"letter": "C", "text": "Separate models that must be trained independently for each modality"}, {"letter": "D", "text": "Models that convert all images to text before processing"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nMulti-modal foundation models (like Claude 3, GPT-4V) can process multiple input types simultaneously, understanding visual content and generating text descriptions. They don't simply extract metadata from images. Modern multi-modal models process modalities jointly rather than requiring separate models. They analyze image pixels directly, not text conversions.", "multi": false}, {"num": 65, "text": "A company wants to customize a foundation model's behavior for their specific use case without the full cost of fine-tuning. They want to add specific knowledge and adjust the response style using only prompt engineering. Which techniques should they combine? (Select TWO)", "options": [{"letter": "A", "text": "System prompts with detailed persona and behavioral instructions"}, {"letter": "B", "text": "Modifying the model's neural network weights directly"}, {"letter": "C", "text": "Few-shot examples demonstrating the desired input-output format"}, {"letter": "D", "text": "Changing the model's tokenizer vocabulary"}, {"letter": "E", "text": "Reducing the model's context window size"}], "correct": ["A", "C"], "explanation": "<strong>Explanation:</strong>\nSystem prompts define persistent behavior guidelines and persona, while few-shot examples demonstrate the specific format and style expected. Together they customize model behavior without modifying weights, which is what makes them prompt engineering (not fine-tuning). Modifying weights or tokenizer requires training. Reducing context window limits capability.", "multi": true}, {"num": 66, "text": "A developer is implementing conversation memory for their chatbot built on Amazon Bedrock. The application needs to maintain context across multiple user interactions within a session. Which approach is MOST appropriate?", "options": [{"letter": "A", "text": "Use a separate model for each conversation turn"}, {"letter": "B", "text": "Retrain the model after each user message"}, {"letter": "C", "text": "Store the entire conversation history and pass it with each new request within the context window"}, {"letter": "D", "text": "Store only the first message and discard all subsequent context"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSince LLMs are stateless, conversation memory is implemented by storing the chat history and including it in each subsequent API request within the model's context window. This allows the model to reference prior turns. Retraining per message is impractical. Separate models fragment context. Discarding history eliminates the ability to reference previous exchanges.", "multi": false}, {"num": 67, "text": "A company has deployed a RAG application but finds that retrieved documents sometimes don't contain the answer to the user's question, leading to low-quality responses. Which improvement would MOST help address this retrieval quality issue?", "options": [{"letter": "A", "text": "Increasing the temperature of the generation model"}, {"letter": "B", "text": "Removing the retrieval step entirely and relying on the model's training knowledge"}, {"letter": "C", "text": "Using a smaller embedding model with fewer dimensions"}, {"letter": "D", "text": "Improving the chunking strategy and adding metadata filtering to refine retrieval results"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nBetter chunking preserves semantic context, and metadata filtering narrows retrieval to relevant document subsets, both improving retrieval quality. Higher temperature affects generation randomness, not retrieval. Smaller embeddings may lose important semantic information. Removing retrieval eliminates the RAG benefit and increases hallucination risk.", "multi": false}, {"num": 68, "text": "A data scientist is using Amazon Bedrock to evaluate different foundation models for a summarization task. They want to objectively compare model outputs across multiple dimensions. Which Amazon Bedrock feature supports automated and human model evaluation?", "options": [{"letter": "A", "text": "Amazon Bedrock Model Evaluation"}, {"letter": "B", "text": "Amazon Bedrock Knowledge Bases"}, {"letter": "C", "text": "Amazon Bedrock Guardrails"}, {"letter": "D", "text": "Amazon Bedrock Provisioned Throughput"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nBedrock Model Evaluation enables both automatic evaluation (using metrics like accuracy, robustness, toxicity) and human evaluation workflows to compare foundation model outputs for specific use cases. Guardrails filter content. Knowledge Bases implement RAG. Provisioned Throughput reserves model capacity for consistent performance.", "multi": false}, {"num": 69, "text": "A team is building a document processing pipeline using generative AI. They need to extract structured information (names, dates, amounts) from unstructured contracts. Which approach combines the strengths of foundation models with structured output requirements?", "options": [{"letter": "A", "text": "Prompting a foundation model with explicit output schema instructions and validation"}, {"letter": "B", "text": "Using regular expressions only for all extraction"}, {"letter": "C", "text": "Manual human review of every document"}, {"letter": "D", "text": "Using only keyword matching without AI"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nFoundation models can understand natural language context in contracts and extract information into structured formats when given explicit schema instructions, combining AI understanding with structured output. Regex alone can't handle natural language variability. Manual review doesn't scale. Keyword matching misses contextual information.", "multi": false}, {"num": 70, "text": "A company wants to use Amazon Bedrock to generate images from text descriptions for their marketing materials. Which foundation model family available through Bedrock is specifically designed for text-to-image generation?", "options": [{"letter": "A", "text": "Anthropic Claude"}, {"letter": "B", "text": "Stability AI (Stable Diffusion)"}, {"letter": "C", "text": "Amazon Titan Text"}, {"letter": "D", "text": "Cohere Command"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nStability AI's Stable Diffusion models, available through Amazon Bedrock, are specifically designed for text-to-image generation. Anthropic Claude is a text/multimodal model for conversation and analysis. Amazon Titan Text generates text. Cohere Command is for text generation and understanding.", "multi": false}, {"num": 71, "text": "A developer wants to implement a safeguard that prevents their Bedrock-powered application from responding to requests about topics unrelated to their business (e.g., political opinions, medical advice). Which Bedrock Guardrails feature addresses this?", "options": [{"letter": "A", "text": "Content filters for harmful content categories"}, {"letter": "B", "text": "Word-level filters for profanity"}, {"letter": "C", "text": "PII detection and redaction"}, {"letter": "D", "text": "Denied topic policies that block specified off-topic subjects"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nDenied topic policies in Bedrock Guardrails allow you to define specific topics the model should refuse to discuss, keeping conversations focused on relevant business subjects. Content filters handle harmful content categories (hate, violence). PII detection handles personal data. Word filters block specific terms, not topic areas.", "multi": false}, {"num": 72, "text": "A company is building a customer-facing AI application with Amazon Bedrock. They need to ensure responses don't contain any personally identifiable information (PII) like phone numbers or email addresses. Which Bedrock Guardrails capability should they configure?", "options": [{"letter": "A", "text": "Topic filtering policies"}, {"letter": "B", "text": "Custom word lists"}, {"letter": "C", "text": "Content filters for hate speech"}, {"letter": "D", "text": "Sensitive information filters with PII detection and redaction"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nBedrock Guardrails' sensitive information filters can detect and redact PII types such as phone numbers, email addresses, SSNs, and other personal data from both inputs and outputs. Topic filtering blocks subjects. Content filters handle harmful categories. Word lists block specific terms but aren't intelligent about PII patterns.", "multi": false}, {"num": 73, "text": "A team is using Amazon Bedrock Knowledge Bases for their RAG application. They want to improve retrieval accuracy by using semantic search. What underlying technology enables semantic search to find conceptually related documents even when exact keywords don't match?", "options": [{"letter": "A", "text": "SQL database queries w
