<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Domain 2: Fundamentals of Generative AI</title>
<style>
  :root {
    --accent:  #6A1B9A;
    --navy:    #232F3E;
    --correct-bg: #d4edda; --correct-border: #28a745;
    --wrong-bg:   #f8d7da; --wrong-border:   #dc3545;
    --neutral-bg: #f4f6f8; --card-bg: #ffffff;
    --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: var(--neutral-bg); color: #222; line-height: 1.6; }

  header {
    background: var(--navy); color: #fff; padding: 16px 24px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  header h1 { font-size: 1rem; font-weight: 700; }
  header h1 span { color: #6A1B9A; }
  .header-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; flex-wrap: wrap; gap: 8px; }
  #progress-bar-wrap { flex: 1; background: rgba(255,255,255,0.2); border-radius: 4px; height: 6px; min-width: 120px; }
  #progress-bar { height: 6px; border-radius: 4px; background: #6A1B9A; transition: width 0.3s; width: 0%; }
  #progress-text { font-size: 0.8rem; color: #ccc; white-space: nowrap; }
  .back-link { font-size: 0.8rem; color: #aaa; text-decoration: none; margin-right: 12px; }
  .back-link:hover { color: #fff; }

  main { max-width: 860px; margin: 28px auto; padding: 0 16px 60px; }

  .domain-badge {
    display: inline-block; background: #6A1B9A; color: #fff;
    border-radius: 6px; padding: 6px 16px; font-size: 0.85rem;
    font-weight: 700; margin-bottom: 24px;
  }

  .question-card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px; margin-bottom: 28px;
    border-left: 5px solid #ddd; transition: border-color 0.3s;
  }
  .question-card.answered-correct { border-left-color: var(--correct-border); }
  .question-card.answered-wrong   { border-left-color: var(--wrong-border); }
  .question-card.answered-partial { border-left-color: #6A1B9A; }

  .q-header { display: flex; gap: 12px; align-items: baseline; margin-bottom: 14px; flex-wrap: wrap; }
  .q-num {
    font-size: 0.72rem; font-weight: 700; background: var(--navy);
    color: #fff; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
  }
  .q-source {
    font-size: 0.68rem; color: #888; background: #eee;
    padding: 1px 7px; border-radius: 10px; white-space: nowrap; flex-shrink: 0;
  }
  .q-text { font-size: 0.97rem; font-weight: 600; line-height: 1.5; }
  .multi-badge {
    font-size: 0.7rem; background: #6A1B9A; color: #fff;
    border-radius: 4px; padding: 1px 6px; margin-left: 6px;
    font-weight: 600; white-space: nowrap;
  }

  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .option-label {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px;
    cursor: pointer; transition: border-color 0.15s, background 0.15s; font-size: 0.92rem;
  }
  .option-label:hover { border-color: #6A1B9A; background: #f5f5ff; }
  .option-label input { flex-shrink: 0; margin-top: 3px; accent-color: #6A1B9A; }
  .option-label .letter { font-weight: 700; color: var(--navy); flex-shrink: 0; min-width: 22px; }
  .option-label.correct { border-color: var(--correct-border); background: var(--correct-bg); }
  .option-label.wrong   { border-color: var(--wrong-border);   background: var(--wrong-bg); }
  .option-label.disabled { cursor: default; pointer-events: none; }
  .option-label.correct::after { content: " ✓"; color: var(--correct-border); font-weight: 700; }
  .option-label.wrong::after   { content: " ✗"; color: var(--wrong-border);   font-weight: 700; }

  .submit-btn {
    display: inline-block; padding: 9px 22px; background: var(--navy);
    color: #fff; border: none; border-radius: 6px; font-size: 0.9rem;
    font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .submit-btn:hover { background: #6A1B9A; }
  .submit-btn:disabled { background: #aaa; cursor: default; }

  .result-badge {
    display: inline-block; font-size: 0.8rem; font-weight: 700;
    padding: 2px 10px; border-radius: 12px; margin-bottom: 12px;
  }
  .result-badge.correct { background: var(--correct-bg); color: var(--correct-border); border: 1px solid var(--correct-border); }
  .result-badge.wrong   { background: var(--wrong-bg);   color: var(--wrong-border);   border: 1px solid var(--wrong-border); }
  .result-badge.partial { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }

  .explanation { margin-top: 16px; border-radius: 8px; border: 1px solid #d0d0d0; overflow: hidden; }
  .explanation summary {
    list-style: none; padding: 10px 16px; background: #f0f0f0;
    cursor: pointer; font-size: 0.88rem; font-weight: 600;
    display: flex; align-items: center; gap: 8px; user-select: none;
  }
  .explanation summary::-webkit-details-marker { display: none; }
  .explanation summary::before { content: "▶"; font-size: 0.7rem; transition: transform 0.2s; }
  .explanation[open] summary::before { transform: rotate(90deg); }
  .explanation-body {
    padding: 14px 16px; font-size: 0.9rem; line-height: 1.65;
    background: #fafafa; border-top: 1px solid #d0d0d0;
  }

  #score-panel {
    display: none; background: var(--navy); color: #fff;
    border-radius: var(--radius); padding: 32px; text-align: center;
    margin-bottom: 40px; box-shadow: var(--shadow);
  }
  #score-panel h2 { font-size: 1.4rem; margin-bottom: 8px; }
  .score-num { font-size: 3rem; font-weight: 900; color: #6A1B9A; }
  .score-pct { font-size: 1rem; color: #ccc; margin-bottom: 16px; }
  .score-grade { font-size: 1rem; }

  @media (max-width: 600px) {
    header { padding: 12px 14px; }
    .question-card { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1><span>Domain 2: Fundamentals of Generative AI</span></h1>
    <div class="header-meta">
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
      <span id="progress-text">0 / 21 answered</span>
    </div>
  </div>
</header>
<main>
  <div id="score-panel">
    <h2>Domain Complete!</h2>
    <div class="score-num" id="score-correct">0</div>
    <div class="score-pct" id="score-pct">out of 21 questions</div>
    <div class="score-grade" id="score-grade"></div>
  </div>
  <div id="questions"></div>
</main>
<script>
const QUESTIONS = [{"num": 25, "source": "Exam 1", "text": "A company wants to understand how large language models process input text. In the transformer architecture, which mechanism allows the model to weigh the relevance of different parts of the input when generating each output token?", "options": [{"letter": "A", "text": "Batch normalization"}, {"letter": "B", "text": "Dropout regularization"}, {"letter": "C", "text": "Self-attention mechanism"}, {"letter": "D", "text": "Pooling layers"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nThe self-attention mechanism in transformers computes relevance scores between all positions in the input sequence, allowing the model to focus on the most relevant parts when processing each token. Batch normalization normalizes activations for training stability. Dropout is a regularization technique. Pooling layers reduce spatial dimensions in CNNs.", "multi": false, "domain": 2}, {"num": 26, "source": "Exam 1", "text": "A team is evaluating different foundation models for their text generation application. They need a model that can handle multiple languages and produce high-quality creative content. Which characteristic of foundation models makes this possible without training from scratch?", "options": [{"letter": "A", "text": "Foundation models are pre-trained on massive diverse datasets and can be adapted to many tasks"}, {"letter": "B", "text": "Foundation models are small models designed for single tasks"}, {"letter": "C", "text": "Foundation models only work with English language data"}, {"letter": "D", "text": "Foundation models require task-specific architectures for each use case"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nFoundation models are trained on massive, diverse datasets spanning multiple languages and domains, giving them broad capabilities that can be adapted to specific tasks without training from scratch. They are typically very large (not small), multilingual (not English-only), and use general architectures like transformers that handle multiple tasks.", "multi": false, "domain": 2}, {"num": 28, "source": "Exam 1", "text": "A data scientist is configuring an LLM for a creative writing application. They want the model to generate diverse and unexpected text rather than always choosing the most probable next token. Which parameter should they increase?", "options": [{"letter": "A", "text": "Temperature"}, {"letter": "B", "text": "Stop sequences"}, {"letter": "C", "text": "Maximum token limit"}, {"letter": "D", "text": "Top-k with k=1"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nIncreasing temperature makes the probability distribution over tokens more uniform, allowing the model to select less probable tokens more frequently, resulting in more diverse and creative output. Maximum token limit only controls output length. Stop sequences define where to end generation. Top-k=1 (greedy decoding) always selects the most probable token, reducing diversity.", "multi": false, "domain": 2}, {"num": 30, "source": "Exam 1", "text": "A team wants to use Amazon Bedrock to access foundation models. Which statements accurately describe Amazon Bedrock's capabilities? (Select TWO)", "options": [{"letter": "A", "text": "It requires customers to manage the underlying infrastructure and GPU instances"}, {"letter": "B", "text": "It provides serverless access to foundation models from multiple providers through a unified API"}, {"letter": "C", "text": "It only supports models built by Amazon"}, {"letter": "D", "text": "It allows customization of foundation models with proprietary data without managing infrastructure"}, {"letter": "E", "text": "It requires deploying models to customer-owned EC2 instances"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nAmazon Bedrock is a fully managed, serverless service providing access to foundation models from Amazon (Titan), Anthropic (Claude), Meta (Llama), and others through a single API. It also supports model customization with proprietary data without infrastructure management. Customers don't manage GPU instances or deploy to EC2.", "multi": true, "domain": 2}, {"num": 32, "source": "Exam 1", "text": "A machine learning engineer needs to convert raw text into numerical representations that capture semantic meaning for use in a natural language processing model. Which technique transforms words into dense vector representations where similar words have similar vectors?", "options": [{"letter": "A", "text": "One-hot encoding"}, {"letter": "B", "text": "Word embeddings (Word2Vec/GloVe)"}, {"letter": "C", "text": "Bag of words with TF-IDF"}, {"letter": "D", "text": "ASCII character encoding"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nWord embeddings like Word2Vec and GloVe create dense vector representations where semantically similar words are mapped to nearby points in the vector space. One-hot encoding creates sparse, high-dimensional vectors without semantic relationships. TF-IDF captures term frequency but not semantic similarity. ASCII encoding has no linguistic meaning.", "multi": false, "domain": 2}, {"num": 34, "source": "Exam 1", "text": "A team is building an LLM application and needs to control the randomness of text generation. They want the model to consider only the top 90% cumulative probability of tokens at each step. Which parameter controls this behavior?", "options": [{"letter": "A", "text": "Temperature"}, {"letter": "B", "text": "Top-p (nucleus sampling)"}, {"letter": "C", "text": "Maximum sequence length"}, {"letter": "D", "text": "Frequency penalty"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nTop-p (nucleus sampling) filters the token vocabulary to the smallest set whose cumulative probability exceeds the threshold p (0.9 in this case), then samples from this reduced set. Temperature scales the entire probability distribution but doesn't set a cumulative threshold. Maximum sequence length controls output length. Frequency penalty reduces repetition.", "multi": false, "domain": 2}, {"num": 36, "source": "Exam 1", "text": "A developer is working with a tokenizer for a large language model. They notice that the word \"unhappiness\" is split into [\"un\", \"happi\", \"ness\"]. What is the purpose of this subword tokenization approach?", "options": [{"letter": "A", "text": "To increase the vocabulary size to include every possible word"}, {"letter": "B", "text": "To make the text longer for more training data"}, {"letter": "C", "text": "To handle out-of-vocabulary words by breaking them into known subword units"}, {"letter": "D", "text": "To remove stop words from the input"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSubword tokenization (like BPE or WordPiece) breaks unknown or rare words into smaller known units, allowing the model to handle any word including novel compounds and morphological variants. It actually reduces vocabulary size compared to word-level tokenization. It doesn't aim to increase text length or remove stop words.", "multi": false, "domain": 2}, {"num": 37, "source": "Exam 1", "text": "A team is selecting a foundation model on Amazon Bedrock for their customer service chatbot. The chatbot needs to provide accurate, factual responses and minimize creative embellishment. Which configuration approach is MOST appropriate?", "options": [{"letter": "A", "text": "Set temperature to maximum (1.0) for diverse responses"}, {"letter": "B", "text": "Use a large top-p value (0.99) to maximize vocabulary usage"}, {"letter": "C", "text": "Disable all safety guardrails for unrestricted output"}, {"letter": "D", "text": "Set a low temperature (close to 0) for deterministic, focused responses"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nA low temperature makes the model more deterministic by sharpening the probability distribution, causing it to select the most likely (and typically most factual) tokens. High temperature increases randomness and creativity. A high top-p allows too many unlikely tokens. Disabling guardrails is a safety concern unrelated to factual accuracy.", "multi": false, "domain": 2}, {"num": 39, "source": "Exam 1", "text": "A machine learning engineer is comparing different LLM architectures. Which statement BEST describes the difference between encoder-only, decoder-only, and encoder-decoder transformer models?", "options": [{"letter": "A", "text": "Encoder-only models generate text, decoder-only models classify text, encoder-decoder models do both"}, {"letter": "B", "text": "Encoder-only models are best for understanding tasks (classification), decoder-only for generation, and encoder-decoder for sequence-to-sequence tasks like translation"}, {"letter": "C", "text": "All three architectures perform identically on all tasks"}, {"letter": "D", "text": "Encoder-only models use attention while decoder-only models use recurrence"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nEncoder-only models (like BERT) excel at understanding and classification by processing bidirectional context. Decoder-only models (like GPT) are optimized for text generation with autoregressive (left-to-right) processing. Encoder-decoder models (like T5) handle tasks requiring both input understanding and output generation, like translation or summarization. All three use attention mechanisms.", "multi": false, "domain": 2}, {"num": 41, "source": "Exam 1", "text": "A startup is building a generative AI application and wants to use Amazon Bedrock. They are evaluating foundation models from different providers. Which model families are available through Amazon Bedrock? (Select TWO)", "options": [{"letter": "A", "text": "OpenAI GPT-4 and GPT-3.5"}, {"letter": "B", "text": "Anthropic Claude models"}, {"letter": "C", "text": "Google PaLM exclusively"}, {"letter": "D", "text": "Amazon Titan models"}, {"letter": "E", "text": "Apple Foundation models"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nAmazon Bedrock provides access to multiple foundation model families including Anthropic Claude, Amazon Titan, Meta Llama, Mistral, Cohere, and Stability AI. OpenAI models are not available through Bedrock (they use their own API). Google PaLM and Apple models are not offered through Bedrock.", "multi": true, "domain": 2}, {"num": 44, "source": "Exam 1", "text": "A team is working with a generative AI model and wants to understand how the model processes input text internally. In the transformer architecture, what role do positional encodings serve?", "options": [{"letter": "A", "text": "They determine the model's output language"}, {"letter": "B", "text": "They provide information about the order/position of tokens in the sequence since attention is position-agnostic"}, {"letter": "C", "text": "They encrypt the input for security purposes"}, {"letter": "D", "text": "They compress the input to reduce memory usage"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nSelf-attention mechanisms are inherently permutation-invariant (they don't inherently know token order), so positional encodings are added to provide sequence position information. Without them, the model would treat \"the cat sat on the mat\" and \"mat the on sat cat the\" identically. They don't determine output language, provide encryption, or compress input.", "multi": false, "domain": 2}, {"num": 47, "source": "Exam 1", "text": "A machine learning team is training a large language model from scratch. During the pre-training phase, which objective is MOST commonly used for decoder-only models like GPT?", "options": [{"letter": "A", "text": "Masked language modeling (predicting randomly masked tokens)"}, {"letter": "B", "text": "Named entity recognition"}, {"letter": "C", "text": "Image classification"}, {"letter": "D", "text": "Next-token prediction (causal language modeling)"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nDecoder-only models like GPT are pre-trained with causal language modeling, where the model predicts the next token given all previous tokens in a left-to-right fashion. Masked language modeling (predicting masked tokens using bidirectional context) is used for encoder-only models like BERT. Image classification and NER are downstream tasks, not pre-training objectives.", "multi": false, "domain": 2}, {"num": 49, "source": "Exam 1", "text": "A developer is working with Amazon Bedrock and wants to understand model pricing. How does Amazon Bedrock typically charge for foundation model usage?", "options": [{"letter": "A", "text": "A fixed monthly subscription regardless of usage"}, {"letter": "B", "text": "Per input/output token processed, with on-demand and provisioned throughput options"}, {"letter": "C", "text": "Only based on the number of API calls made, regardless of prompt length"}, {"letter": "D", "text": "Free tier only with no paid option"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Bedrock charges based on tokens processed (input and output tokens), with on-demand pricing for variable workloads and provisioned throughput for predictable, high-volume usage at committed rates. It's not a flat subscription, not purely per-call regardless of size, and while there may be free tier for experimentation, paid usage is token-based.", "multi": false, "domain": 2}, {"num": 50, "source": "Exam 1", "text": "A team is evaluating whether to use a generative AI model or a traditional ML model for their task. Which use case is BEST suited for a generative AI foundation model rather than a traditional supervised learning approach?", "options": [{"letter": "A", "text": "Generating natural language summaries of long documents with varied topics"}, {"letter": "B", "text": "Predicting a single numeric value from tabular data with clear features"}, {"letter": "C", "text": "Binary classification on structured data with millions of labeled examples"}, {"letter": "D", "text": "Time-series forecasting with well-defined numerical inputs"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nGenerative AI models excel at open-ended natural language tasks like summarization across varied topics where the output is creative text. Traditional ML models are often more efficient and appropriate for structured prediction tasks (numeric regression, binary classification on tabular data, time-series forecasting) where inputs and outputs are well-defined.", "multi": false, "domain": 2}, {"num": 57, "source": "Exam 1", "text": "A software development team wants to use AI to help developers write code faster, get code suggestions inline, and generate code from natural language comments. Which AWS service is designed for this purpose?", "options": [{"letter": "A", "text": "Amazon Q Developer (formerly CodeWhisperer)"}, {"letter": "B", "text": "Amazon CodeGuru"}, {"letter": "C", "text": "AWS CloudFormation"}, {"letter": "D", "text": "Amazon SageMaker Autopilot"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Q Developer (formerly CodeWhisperer) is an AI-powered coding companion that provides real-time code suggestions, generates code from natural language comments, and assists with code completion within IDEs. CodeGuru provides code reviews and performance recommendations. CloudFormation is for infrastructure as code. SageMaker Autopilot automates ML model building.", "multi": false, "domain": 2}, {"num": 64, "source": "Exam 1", "text": "A team is building a multi-modal AI application that needs to analyze both images and text to generate descriptions of products from photographs. Which capability of foundation models enables this?", "options": [{"letter": "A", "text": "Models that only process text input but generate image descriptions from metadata"}, {"letter": "B", "text": "Multi-modal foundation models that accept both image and text inputs and generate text outputs"}, {"letter": "C", "text": "Separate models that must be trained independently for each modality"}, {"letter": "D", "text": "Models that convert all images to text before processing"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nMulti-modal foundation models (like Claude 3, GPT-4V) can process multiple input types simultaneously, understanding visual content and generating text descriptions. They don't simply extract metadata from images. Modern multi-modal models process modalities jointly rather than requiring separate models. They analyze image pixels directly, not text conversions.", "multi": false, "domain": 2}, {"num": 70, "source": "Exam 1", "text": "A company wants to use Amazon Bedrock to generate images from text descriptions for their marketing materials. Which foundation model family available through Bedrock is specifically designed for text-to-image generation?", "options": [{"letter": "A", "text": "Anthropic Claude"}, {"letter": "B", "text": "Stability AI (Stable Diffusion)"}, {"letter": "C", "text": "Amazon Titan Text"}, {"letter": "D", "text": "Cohere Command"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nStability AI's Stable Diffusion models, available through Amazon Bedrock, are specifically designed for text-to-image generation. Anthropic Claude is a text/multimodal model for conversation and analysis. Amazon Titan Text generates text. Cohere Command is for text generation and understanding.", "multi": false, "domain": 2}, {"num": 77, "source": "Exam 1", "text": "A developer needs to configure inference parameters for a text generation model on Amazon Bedrock. They want to limit the response length to prevent excessive token usage. Which parameter controls the maximum number of tokens the model will generate?", "options": [{"letter": "A", "text": "Temperature"}, {"letter": "B", "text": "Max tokens (maximum generation length)"}, {"letter": "C", "text": "Top-p"}, {"letter": "D", "text": "Stop sequences"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nThe max tokens parameter directly limits how many tokens the model will generate in its response, controlling output length and token costs. Temperature controls randomness. Top-p filters token probabilities. Stop sequences terminate generation at specific strings but don't set a hard length limit.", "multi": false, "domain": 2}, {"num": 81, "source": "Exam 1", "text": "A company is using Amazon Q Business to help employees find information. They need to ensure that employees can only access answers derived from documents they have permission to view. Which feature enables this access control?", "options": [{"letter": "A", "text": "Document-level access control lists (ACLs) that respect existing enterprise permissions"}, {"letter": "B", "text": "Setting the model temperature to zero"}, {"letter": "C", "text": "Deploying a separate Q instance for each employee"}, {"letter": "D", "text": "Using content filters to block all responses"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Q Business integrates with enterprise identity providers and respects document-level ACLs, ensuring users only receive answers from documents they're authorized to access. Temperature settings don't affect access control. Separate instances per employee is impractical and expensive. Blocking all responses defeats the purpose.", "multi": false, "domain": 2}, {"num": 86, "source": "Exam 2", "text": "What is the primary benefit of using Amazon SageMaker JumpStart?", "options": [{"letter": "A", "text": "To offer a curated set of pre-built ML solutions, models, and notebooks to accelerate development."}, {"letter": "B", "text": "To automatically label large datasets for computer vision tasks."}, {"letter": "C", "text": "To monitor deployed ML models for data drift."}, {"letter": "D", "text": "To provide a no-code visual interface for ML development."}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker JumpStart provides a hub of pre-built machine learning solutions, foundation models, algorithms, and notebooks. It allows developers to quickly get started with common ML use cases by deploying ready-to-use models or solutions with just a few clicks, significantly accelerating the development process.", "multi": false, "domain": 2}, {"num": 90, "source": "Exam 2", "text": "A product team wants to quickly prototype an AI-powered application idea without writing any code or setting up AWS infrastructure. They want to experiment with foundation models using a simple web interface. Which AWS offering enables this rapid prototyping?", "options": [{"letter": "A", "text": "Amazon Bedrock Console"}, {"letter": "B", "text": "Amazon SageMaker JumpStart"}, {"letter": "C", "text": "Amazon Q Developer"}, {"letter": "D", "text": "Amazon PartyRock"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon PartyRock is a free, no-code playground built on Amazon Bedrock that lets anyone build generative AI-powered apps through a simple web interface without needing an AWS account or infrastructure setup. The Bedrock Console requires an AWS account and some technical knowledge. SageMaker JumpStart requires SageMaker setup. Q Developer is a coding assistant.", "multi": false, "domain": 2}];
const TOTAL = QUESTIONS.length;
let answeredCount = 0;
let correctCount  = 0;

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function buildQuiz() {
  const container = document.getElementById("questions");
  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = "question-card";
    card.id = "q" + idx;
    const multiBadge = q.multi ? "<span class=\"multi-badge\">Select 2</span>" : "";
    const srcBadge   = "<span class=\"q-source\">" + escHtml(q.source) + "</span>";
    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q${q.num}</span>
        ${srcBadge}
        <span class="q-text">${escHtml(q.text)}${multiBadge}</span>
      </div>
      <div class="options" id="opts_${idx}">
        ${q.options.map(o =>
          "<label class=\"option-label\" id=\"lbl_" + idx + "_" + o.letter + "\">" +
          "<input type=\"" + (q.multi ? "checkbox" : "radio") + "\" name=\"q" + idx + "\" value=\"" + o.letter + "\" />" +
          "<span class=\"letter\">" + o.letter + ")</span>" +
          "<span>" + escHtml(o.text) + "</span>" +
          "</label>"
        ).join("")}
      </div>
      <button class="submit-btn" onclick="submitAnswer(${idx})">Check Answer</button>
      <div id="badge_${idx}" style="margin-top:12px;"></div>
      <details class="explanation" id="exp_${idx}">
        <summary>&#x1F4A1; Explanation</summary>
        <div class="explanation-body">${q.explanation}</div>
      </details>
    `;
    container.appendChild(card);
  });
}

function getSelected(idx) {
  return Array.from(document.querySelectorAll("[name=\"q" + idx + "\"]:checked")).map(i => i.value);
}

function submitAnswer(idx) {
  const q = QUESTIONS[idx];
  const selected = getSelected(idx);
  if (!selected.length) return;

  document.querySelectorAll("[name=\"q" + idx + "\"]").forEach(i => i.disabled = true);
  document.querySelector("#q" + idx + " .submit-btn").disabled = true;

  q.options.forEach(o => {
    const lbl = document.getElementById("lbl_" + idx + "_" + o.letter);
    lbl.classList.add("disabled");
    if (q.correct.includes(o.letter)) lbl.classList.add("correct");
    else if (selected.includes(o.letter)) lbl.classList.add("wrong");
  });

  const correctSet  = new Set(q.correct);
  const selectedSet = new Set(selected);
  let result;
  if (q.multi) {
    const allCorrect = q.correct.every(l => selectedSet.has(l)) && selected.every(l => correctSet.has(l));
    result = allCorrect ? "correct" : (q.correct.some(l => selectedSet.has(l)) ? "partial" : "wrong");
  } else {
    result = (selected.length === 1 && selected[0] === q.correct[0]) ? "correct" : "wrong";
  }

  const badge = document.getElementById("badge_" + idx);
  const corrStr = q.correct.join(", ");
  if (result === "correct") {
    badge.innerHTML = "<span class=\"result-badge correct\">&#x2713; Correct!</span>";
    document.getElementById("q" + idx).classList.add("answered-correct");
    correctCount++;
  } else if (result === "partial") {
    badge.innerHTML = "<span class=\"result-badge partial\">Partially Correct — full answer: " + corrStr + "</span>";
    document.getElementById("q" + idx).classList.add("answered-partial");
  } else {
    badge.innerHTML = "<span class=\"result-badge wrong\">&#x2717; Incorrect — correct: " + corrStr + "</span>";
    document.getElementById("q" + idx).classList.add("answered-wrong");
  }

  document.getElementById("exp_" + idx).setAttribute("open", "");
  answeredCount++;
  updateProgress();
  if (answeredCount === TOTAL) showScore();
}

function updateProgress() {
  document.getElementById("progress-bar").style.width = (answeredCount / TOTAL * 100) + "%";
  document.getElementById("progress-text").textContent = answeredCount + " / " + TOTAL + " answered";
}

function showScore() {
  const panel = document.getElementById("score-panel");
  panel.style.display = "block";
  document.getElementById("score-correct").textContent = correctCount;
  const pct = Math.round(correctCount / TOTAL * 100);
  document.getElementById("score-pct").textContent = "out of " + TOTAL + " questions (" + pct + "%)";
  let grade;
  if (pct >= 90)      grade = "Excellent — strong domain mastery!";
  else if (pct >= 75) grade = "Good — review your misses and try again.";
  else if (pct >= 60) grade = "Needs work — spend more time on this domain.";
  else                grade = "Focus here — this domain needs significant study.";
  document.getElementById("score-grade").textContent = grade;
  panel.scrollIntoView({ behavior: "smooth" });
}

buildQuiz();
updateProgress();
</script>
