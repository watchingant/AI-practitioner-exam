<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Domain 3: Applications of Foundation Models</title>
<style>
  :root {
    --accent:  #00695C;
    --navy:    #232F3E;
    --correct-bg: #d4edda; --correct-border: #28a745;
    --wrong-bg:   #f8d7da; --wrong-border:   #dc3545;
    --neutral-bg: #f4f6f8; --card-bg: #ffffff;
    --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: var(--neutral-bg); color: #222; line-height: 1.6; }

  header {
    background: var(--navy); color: #fff; padding: 16px 24px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  header h1 { font-size: 1rem; font-weight: 700; }
  header h1 span { color: #00695C; }
  .header-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; flex-wrap: wrap; gap: 8px; }
  #progress-bar-wrap { flex: 1; background: rgba(255,255,255,0.2); border-radius: 4px; height: 6px; min-width: 120px; }
  #progress-bar { height: 6px; border-radius: 4px; background: #00695C; transition: width 0.3s; width: 0%; }
  #progress-text { font-size: 0.8rem; color: #ccc; white-space: nowrap; }
  .back-link { font-size: 0.8rem; color: #aaa; text-decoration: none; margin-right: 12px; }
  .back-link:hover { color: #fff; }

  main { max-width: 860px; margin: 28px auto; padding: 0 16px 60px; }

  .domain-badge {
    display: inline-block; background: #00695C; color: #fff;
    border-radius: 6px; padding: 6px 16px; font-size: 0.85rem;
    font-weight: 700; margin-bottom: 24px;
  }

  .question-card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px; margin-bottom: 28px;
    border-left: 5px solid #ddd; transition: border-color 0.3s;
  }
  .question-card.answered-correct { border-left-color: var(--correct-border); }
  .question-card.answered-wrong   { border-left-color: var(--wrong-border); }
  .question-card.answered-partial { border-left-color: #00695C; }

  .q-header { display: flex; gap: 12px; align-items: baseline; margin-bottom: 14px; flex-wrap: wrap; }
  .q-num {
    font-size: 0.72rem; font-weight: 700; background: var(--navy);
    color: #fff; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
  }
  .q-source {
    font-size: 0.68rem; color: #888; background: #eee;
    padding: 1px 7px; border-radius: 10px; white-space: nowrap; flex-shrink: 0;
  }
  .q-text { font-size: 0.97rem; font-weight: 600; line-height: 1.5; }
  .multi-badge {
    font-size: 0.7rem; background: #00695C; color: #fff;
    border-radius: 4px; padding: 1px 6px; margin-left: 6px;
    font-weight: 600; white-space: nowrap;
  }

  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .option-label {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px;
    cursor: pointer; transition: border-color 0.15s, background 0.15s; font-size: 0.92rem;
  }
  .option-label:hover { border-color: #00695C; background: #f5f5ff; }
  .option-label input { flex-shrink: 0; margin-top: 3px; accent-color: #00695C; }
  .option-label .letter { font-weight: 700; color: var(--navy); flex-shrink: 0; min-width: 22px; }
  .option-label.correct { border-color: var(--correct-border); background: var(--correct-bg); }
  .option-label.wrong   { border-color: var(--wrong-border);   background: var(--wrong-bg); }
  .option-label.disabled { cursor: default; pointer-events: none; }
  .option-label.correct::after { content: " ✓"; color: var(--correct-border); font-weight: 700; }
  .option-label.wrong::after   { content: " ✗"; color: var(--wrong-border);   font-weight: 700; }

  .submit-btn {
    display: inline-block; padding: 9px 22px; background: var(--navy);
    color: #fff; border: none; border-radius: 6px; font-size: 0.9rem;
    font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .submit-btn:hover { background: #00695C; }
  .submit-btn:disabled { background: #aaa; cursor: default; }

  .result-badge {
    display: inline-block; font-size: 0.8rem; font-weight: 700;
    padding: 2px 10px; border-radius: 12px; margin-bottom: 12px;
  }
  .result-badge.correct { background: var(--correct-bg); color: var(--correct-border); border: 1px solid var(--correct-border); }
  .result-badge.wrong   { background: var(--wrong-bg);   color: var(--wrong-border);   border: 1px solid var(--wrong-border); }
  .result-badge.partial { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }

  .explanation { margin-top: 16px; border-radius: 8px; border: 1px solid #d0d0d0; overflow: hidden; }
  .explanation summary {
    list-style: none; padding: 10px 16px; background: #f0f0f0;
    cursor: pointer; font-size: 0.88rem; font-weight: 600;
    display: flex; align-items: center; gap: 8px; user-select: none;
  }
  .explanation summary::-webkit-details-marker { display: none; }
  .explanation summary::before { content: "▶"; font-size: 0.7rem; transition: transform 0.2s; }
  .explanation[open] summary::before { transform: rotate(90deg); }
  .explanation-body {
    padding: 14px 16px; font-size: 0.9rem; line-height: 1.65;
    background: #fafafa; border-top: 1px solid #d0d0d0;
  }

  #score-panel {
    display: none; background: var(--navy); color: #fff;
    border-radius: var(--radius); padding: 32px; text-align: center;
    margin-bottom: 40px; box-shadow: var(--shadow);
  }
  #score-panel h2 { font-size: 1.4rem; margin-bottom: 8px; }
  .score-num { font-size: 3rem; font-weight: 900; color: #00695C; }
  .score-pct { font-size: 1rem; color: #ccc; margin-bottom: 16px; }
  .score-grade { font-size: 1rem; }

  @media (max-width: 600px) {
    header { padding: 12px 14px; }
    .question-card { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1><span>Domain 3: Applications of Foundation Models</span></h1>
    <div class="header-meta">
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
      <span id="progress-text">0 / 44 answered</span>
    </div>
  </div>
</header>
<main>
  <div id="score-panel">
    <h2>Domain Complete!</h2>
    <div class="score-num" id="score-correct">0</div>
    <div class="score-pct" id="score-pct">out of 44 questions</div>
    <div class="score-grade" id="score-grade"></div>
  </div>
  <div id="questions"></div>
</main>
<script>
const QUESTIONS = [{"num": 4, "source": "Exam 1", "text": "A team is evaluating a binary classification model for fraud detection where fraudulent transactions are rare (0.1% of total). The model achieves 99.9% accuracy. Which metric would provide the MOST useful evaluation of model performance?", "options": [{"letter": "A", "text": "Precision and recall (F1 score)"}, {"letter": "B", "text": "Training loss"}, {"letter": "C", "text": "Overall accuracy"}, {"letter": "D", "text": "Mean absolute error"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nWith highly imbalanced datasets, accuracy is misleading because a model that predicts all transactions as non-fraudulent would still achieve 99.9% accuracy. Precision and recall (combined in the F1 score) measure how well the model identifies actual fraud cases. Training loss measures optimization progress, not real-world performance. Mean absolute error is used for regression problems.", "multi": false, "domain": 3}, {"num": 7, "source": "Exam 1", "text": "A team is building a convolutional neural network (CNN) for image classification. Which layer type is primarily responsible for detecting spatial features like edges and textures in input images?", "options": [{"letter": "A", "text": "Convolutional layers with filters/kernels"}, {"letter": "B", "text": "Recurrent layers"}, {"letter": "C", "text": "Fully connected (dense) layers"}, {"letter": "D", "text": "Embedding layers"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nConvolutional layers apply learnable filters/kernels across the input image to detect spatial features such as edges, textures, and patterns. Fully connected layers combine features for final classification but don't detect spatial patterns. Recurrent layers process sequential data. Embedding layers convert categorical data into dense vectors.", "multi": false, "domain": 3}, {"num": 9, "source": "Exam 1", "text": "A machine learning engineer is splitting their dataset for model development. They want to ensure proper evaluation while maximizing training data usage for a small dataset of 2,000 samples. Which approach is MOST appropriate?", "options": [{"letter": "A", "text": "Using 100% of the data for training and evaluating on the same data"}, {"letter": "B", "text": "Using a 95/5 train/test split with no validation set"}, {"letter": "C", "text": "K-fold cross-validation"}, {"letter": "D", "text": "Training only on the most recent 50% of data"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nK-fold cross-validation maximizes both training data usage and evaluation reliability by rotating which portion serves as the test set across multiple folds. Training and evaluating on the same data leads to overfitting without detection. A 95/5 split provides too few test samples for reliable evaluation. Using only recent data wastes valuable training samples.", "multi": false, "domain": 3}, {"num": 27, "source": "Exam 1", "text": "A developer is using a large language model and wants to get accurate answers about recent company policies without any examples in the prompt. They simply ask the question directly. Which prompting technique does this describe?", "options": [{"letter": "A", "text": "Few-shot prompting"}, {"letter": "B", "text": "Chain-of-thought prompting"}, {"letter": "C", "text": "Zero-shot prompting"}, {"letter": "D", "text": "Retrieval-augmented generation"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nZero-shot prompting involves giving the model a task or question without providing any examples, relying on the model's pre-trained knowledge to generate a response. Few-shot provides examples in the prompt. Chain-of-thought asks the model to reason step by step. RAG retrieves external documents to augment the prompt.", "multi": false, "domain": 3}, {"num": 29, "source": "Exam 1", "text": "A company is experiencing issues with their LLM-powered chatbot generating factually incorrect but confident-sounding responses about their product specifications. What is this phenomenon called?", "options": [{"letter": "A", "text": "Hallucination"}, {"letter": "B", "text": "Catastrophic forgetting"}, {"letter": "C", "text": "Model drift"}, {"letter": "D", "text": "Mode collapse"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nHallucination refers to LLMs generating plausible-sounding but factually incorrect information with high confidence. Model drift occurs when real-world data distributions change over time. Catastrophic forgetting happens when fine-tuning causes a model to lose previously learned knowledge. Mode collapse is a GAN training issue where the generator produces limited output variety.", "multi": false, "domain": 3}, {"num": 30, "source": "Exam 1", "text": "A team wants to use Amazon Bedrock to access foundation models. Which statements accurately describe Amazon Bedrock's capabilities? (Select TWO)", "options": [{"letter": "A", "text": "It requires customers to manage the underlying infrastructure and GPU instances"}, {"letter": "B", "text": "It provides serverless access to foundation models from multiple providers through a unified API"}, {"letter": "C", "text": "It only supports models built by Amazon"}, {"letter": "D", "text": "It allows customization of foundation models with proprietary data without managing infrastructure"}, {"letter": "E", "text": "It requires deploying models to customer-owned EC2 instances"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nAmazon Bedrock is a fully managed, serverless service providing access to foundation models from Amazon (Titan), Anthropic (Claude), Meta (Llama), and others through a single API. It also supports model customization with proprietary data without infrastructure management. Customers don't manage GPU instances or deploy to EC2.", "multi": true, "domain": 3}, {"num": 31, "source": "Exam 1", "text": "A developer wants to improve their LLM's performance on complex reasoning tasks. They modify their prompt to include the instruction \"Let's think through this step by step\" before the question. Which prompting technique is this?", "options": [{"letter": "A", "text": "Few-shot prompting"}, {"letter": "B", "text": "Zero-shot prompting"}, {"letter": "C", "text": "Chain-of-thought prompting"}, {"letter": "D", "text": "Instruction tuning"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nChain-of-thought prompting encourages the model to break down complex problems into intermediate reasoning steps, often triggered by phrases like \"let's think step by step.\" This improves performance on math, logic, and multi-step reasoning tasks. Few-shot provides examples. Zero-shot gives no examples or reasoning guidance. Instruction tuning is a training technique, not a prompting method.", "multi": false, "domain": 3}, {"num": 33, "source": "Exam 1", "text": "A company has a pre-trained foundation model and wants to adapt it to their specific domain (medical literature) while keeping computational costs low. They have a small labeled dataset of 5,000 medical documents. Which approach is MOST cost-effective?", "options": [{"letter": "A", "text": "Pre-training a new model from scratch on medical data"}, {"letter": "B", "text": "Training a traditional rule-based system instead"}, {"letter": "C", "text": "Using only zero-shot prompting without any adaptation"}, {"letter": "D", "text": "Fine-tuning the foundation model on the medical dataset"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nFine-tuning adapts a pre-trained model to a specific domain using a relatively small labeled dataset, leveraging the model's existing knowledge while learning domain-specific patterns cost-effectively. Pre-training from scratch requires massive data and compute. Zero-shot prompting alone may not capture domain-specific nuances. Rule-based systems cannot handle the complexity of medical language.", "multi": false, "domain": 3}, {"num": 35, "source": "Exam 1", "text": "A company wants to improve an existing LLM's ability to follow specific instructions and align with human preferences. Which training technique uses human feedback to optimize the model's responses after initial pre-training?", "options": [{"letter": "A", "text": "Transfer learning from a computer vision model"}, {"letter": "B", "text": "Reinforcement Learning from Human Feedback (RLHF)"}, {"letter": "C", "text": "Unsupervised pre-training with next-token prediction"}, {"letter": "D", "text": "Data augmentation with synthetic examples"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nRLHF is a post-training technique that uses human preference data to train a reward model, which then guides the LLM to generate responses that align with human expectations. Transfer learning from vision models isn't relevant to instruction following. Pre-training with next-token prediction is the initial training phase. Data augmentation doesn't incorporate human preferences.", "multi": false, "domain": 3}, {"num": 38, "source": "Exam 1", "text": "A company is deciding between using a pre-trained foundation model directly versus fine-tuning it for their specific task. Which factors should they consider when deciding to fine-tune? (Select TWO)", "options": [{"letter": "A", "text": "They have a large domain-specific labeled dataset that differs significantly from the model's pre-training data"}, {"letter": "B", "text": "They need the model to work immediately without any additional training time or cost"}, {"letter": "C", "text": "The pre-trained model's zero-shot performance already meets their accuracy requirements"}, {"letter": "D", "text": "They need the model to learn specialized terminology and response patterns for their industry"}, {"letter": "E", "text": "They want to minimize all computational costs and deployment time"}], "correct": ["A", "D"], "explanation": "<strong>Explanation:</strong>\nFine-tuning is most beneficial when domain-specific data differs from pre-training data and when specialized terminology or response patterns are needed. If the model already meets requirements with zero-shot performance, fine-tuning is unnecessary. Fine-tuning requires additional time and cost, so it's not chosen when immediate deployment or cost minimization is the priority.", "multi": true, "domain": 3}, {"num": 40, "source": "Exam 1", "text": "A developer notices that their LLM application sometimes generates text that contradicts information provided earlier in the same conversation. Which limitation of transformer-based models contributes to this issue?", "options": [{"letter": "A", "text": "Transformers cannot handle natural language at all"}, {"letter": "B", "text": "The model's inability to process any text input"}, {"letter": "C", "text": "Finite context window limiting how much prior conversation the model can reference"}, {"letter": "D", "text": "The model requires images as input to function"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nTransformers have a fixed context window (e.g., 4K, 8K, or 128K tokens), and information beyond this window is lost. In long conversations, earlier context may fall outside the window, causing inconsistencies. The other options are incorrect as transformers are specifically designed to process natural language text effectively.", "multi": false, "domain": 3}, {"num": 42, "source": "Exam 1", "text": "A data scientist is preparing a prompt that includes three examples of the desired input-output format before asking the model to complete a new task. Which prompting technique is being used?", "options": [{"letter": "A", "text": "Zero-shot prompting"}, {"letter": "B", "text": "Few-shot prompting"}, {"letter": "C", "text": "Chain-of-thought prompting"}, {"letter": "D", "text": "Instruction tuning"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nFew-shot prompting provides a small number of input-output examples within the prompt to demonstrate the desired behavior or format before presenting the actual task. Zero-shot provides no examples. Chain-of-thought focuses on reasoning steps rather than input-output examples. Instruction tuning is a model training technique, not a prompting strategy.", "multi": false, "domain": 3}, {"num": 45, "source": "Exam 1", "text": "A company is building a customer support system using generative AI. They want to prevent the model from generating responses about competitor products or making financial promises. Which Amazon Bedrock feature is MOST appropriate for implementing these content restrictions?", "options": [{"letter": "A", "text": "Amazon Bedrock Knowledge Bases"}, {"letter": "B", "text": "Amazon Bedrock Agents"}, {"letter": "C", "text": "Amazon Bedrock Model Evaluation"}, {"letter": "D", "text": "Amazon Bedrock Guardrails"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nBedrock Guardrails allows configuration of content filters, denied topics, and word filters to prevent models from generating specific types of content or discussing restricted topics. Knowledge Bases connect models to external data sources. Agents enable multi-step task execution. Model Evaluation assesses model performance on benchmarks.", "multi": false, "domain": 3}, {"num": 48, "source": "Exam 1", "text": "A company wants to reduce hallucinations in their generative AI application that answers questions about their internal documentation. Which approach would MOST effectively reduce hallucinations while maintaining response quality?", "options": [{"letter": "A", "text": "Retrieval-Augmented Generation (RAG) that grounds responses in retrieved documents"}, {"letter": "B", "text": "Increasing the temperature parameter to explore more diverse responses"}, {"letter": "C", "text": "Removing all system prompts to give the model more freedom"}, {"letter": "D", "text": "Using a smaller model with fewer parameters"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nRAG reduces hallucinations by retrieving relevant documents and including them in the context, allowing the model to generate responses grounded in factual source material. Increasing temperature would increase randomness and potentially more hallucinations. Removing system prompts reduces control. Smaller models may hallucinate more due to less learned knowledge.", "multi": false, "domain": 3}, {"num": 51, "source": "Exam 1", "text": "A company has fine-tuned a foundation model and wants to prevent it from losing the general capabilities it learned during pre-training while adapting to their specific domain. What is this phenomenon of losing previously learned knowledge called?", "options": [{"letter": "A", "text": "Overfitting"}, {"letter": "B", "text": "Catastrophic forgetting"}, {"letter": "C", "text": "Underfitting"}, {"letter": "D", "text": "Gradient vanishing"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nCatastrophic forgetting occurs when fine-tuning on new data causes the model to lose knowledge acquired during pre-training or earlier training stages. Overfitting is memorizing training data rather than generalizing. Underfitting is failing to capture patterns. Gradient vanishing is a training difficulty in deep networks where gradients become too small.", "multi": false, "domain": 3}, {"num": 52, "source": "Exam 1", "text": "A developer is building a multi-turn conversational AI system. They need the model to maintain context from previous messages in the conversation. Which approach enables the model to reference earlier parts of the dialogue?", "options": [{"letter": "A", "text": "Training a new model for each conversation turn"}, {"letter": "B", "text": "Including the conversation history in the prompt context window"}, {"letter": "C", "text": "Using a separate model for each message"}, {"letter": "D", "text": "Resetting the model's weights after each response"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nSince LLMs are stateless (they don't retain information between API calls), conversation history must be passed in the prompt context window for each turn to maintain coherence. Training a new model per turn is impractical. Using separate models fragments context. Resetting weights would destroy all learned knowledge.", "multi": false, "domain": 3}, {"num": 53, "source": "Exam 1", "text": "A team is using prompt engineering to improve their LLM application. They want to assign the model a specific persona and set of behavioral guidelines that persist across all user interactions. Where should they place these instructions?", "options": [{"letter": "A", "text": "In the system prompt/message"}, {"letter": "B", "text": "In the user message of each turn"}, {"letter": "C", "text": "In the model's tokenizer configuration"}, {"letter": "D", "text": "In the API authentication headers"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nThe system prompt/message is designed for persistent instructions, persona definitions, and behavioral guidelines that apply across all interactions. User messages contain the actual queries. The tokenizer configuration handles text-to-token conversion, not behavioral instructions. Authentication headers handle security, not model behavior.", "multi": false, "domain": 3}, {"num": 54, "source": "Exam 1", "text": "A company wants to build a question-answering system that can respond accurately about their internal knowledge base of 50,000 documents. They want to minimize hallucinations and keep information current without retraining the model. Which Amazon Bedrock feature should they use?", "options": [{"letter": "A", "text": "Amazon Bedrock Model Evaluation"}, {"letter": "B", "text": "Amazon Bedrock Guardrails"}, {"letter": "C", "text": "Amazon Bedrock Knowledge Bases with RAG"}, {"letter": "D", "text": "Amazon Bedrock Custom Model Import"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nBedrock Knowledge Bases implements RAG by automatically chunking, embedding, and indexing documents into a vector store, then retrieving relevant context for each query. This grounds responses in actual documents, reducing hallucinations and keeping information current without retraining. Model Evaluation benchmarks models. Guardrails filter content. Custom Model Import brings external models to Bedrock.", "multi": false, "domain": 3}, {"num": 55, "source": "Exam 1", "text": "A development team is building an AI assistant that needs to autonomously perform multi-step tasks like booking travel, including searching for flights, comparing prices, and making reservations through external APIs. Which Amazon Bedrock capability enables this?", "options": [{"letter": "A", "text": "Amazon Bedrock Agents"}, {"letter": "B", "text": "Amazon Bedrock Knowledge Bases"}, {"letter": "C", "text": "Amazon Bedrock Guardrails"}, {"letter": "D", "text": "Amazon Bedrock Model Evaluation"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nBedrock Agents enable foundation models to autonomously plan and execute multi-step tasks by connecting to external APIs and data sources through action groups. They can break down complex requests, call APIs, and orchestrate workflows. Knowledge Bases provide document retrieval. Guardrails filter content. Model Evaluation assesses model quality.", "multi": false, "domain": 3}, {"num": 56, "source": "Exam 1", "text": "A company is implementing RAG and needs to store document embeddings for fast similarity search. Which type of database is specifically designed for storing and querying high-dimensional vector embeddings?", "options": [{"letter": "A", "text": "Vector database (Amazon OpenSearch Serverless with vector engine)"}, {"letter": "B", "text": "Key-value store (Amazon DynamoDB)"}, {"letter": "C", "text": "Relational database (Amazon RDS)"}, {"letter": "D", "text": "Graph database (Amazon Neptune)"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nVector databases are optimized for storing high-dimensional embeddings and performing efficient similarity searches using algorithms like approximate nearest neighbor (ANN). Relational databases handle structured data with SQL queries. Key-value stores are for simple lookups. Graph databases model relationships between entities, not vector similarity.", "multi": false, "domain": 3}, {"num": 58, "source": "Exam 1", "text": "A company wants to fine-tune a foundation model in Amazon Bedrock using their proprietary customer interaction data. Which requirement must they meet for the training data?", "options": [{"letter": "A", "text": "Training data must be publicly available on the internet"}, {"letter": "B", "text": "Training data must be stored in Amazon S3 in the supported format (JSONL with prompt-completion pairs)"}, {"letter": "C", "text": "Training data must be stored in Amazon DynamoDB"}, {"letter": "D", "text": "Training data must be at least 1 TB in size"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nBedrock fine-tuning requires training data stored in Amazon S3 in specific formats like JSONL with prompt-completion pairs. The data doesn't need to be public - private proprietary data is the typical use case. DynamoDB is not a supported source for fine-tuning data. There's no minimum 1 TB requirement; fine-tuning works with relatively small datasets.", "multi": false, "domain": 3}, {"num": 59, "source": "Exam 1", "text": "A company is building a generative AI application using Amazon Bedrock Knowledge Bases. They need their documents chunked appropriately for retrieval. Which chunking strategy would work BEST for technical documentation with clear section boundaries?", "options": [{"letter": "A", "text": "Fixed-size chunking with 50-character chunks regardless of content"}, {"letter": "B", "text": "Random chunking with overlapping segments of varying sizes"}, {"letter": "C", "text": "No chunking - using entire documents as single retrievable units"}, {"letter": "D", "text": "Hierarchical chunking that respects document structure (sections and paragraphs)"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nHierarchical chunking preserves semantic coherence by following document structure, keeping related content together within sections and paragraphs. Very small fixed-size chunks may split important context. Using entire documents as single units returns too much irrelevant content and may exceed context windows. Random chunking disregards content structure.", "multi": false, "domain": 3}, {"num": 60, "source": "Exam 1", "text": "A company is using Amazon Q to help employees find information across their enterprise systems. Which statement BEST describes Amazon Q's primary capability?", "options": [{"letter": "A", "text": "It is a vector database for storing embeddings"}, {"letter": "B", "text": "It is a generative AI-powered assistant that connects to enterprise data sources to provide contextual answers and complete tasks"}, {"letter": "C", "text": "It is a model training platform for building custom LLMs"}, {"letter": "D", "text": "It is a data labeling tool for supervised learning"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Q is an enterprise generative AI assistant that integrates with various data sources (wikis, documents, ticketing systems) to provide contextual answers, generate content, and automate tasks within enterprise workflows. It's not a vector database, model training platform, or data labeling tool.", "multi": false, "domain": 3}, {"num": 61, "source": "Exam 1", "text": "A team wants to build a no-code generative AI application for rapid prototyping and experimentation with foundation models. Which AWS tool allows business users to create AI-powered applications without writing code?", "options": [{"letter": "A", "text": "PartyRock (Amazon Bedrock Playground)"}, {"letter": "B", "text": "Amazon SageMaker Studio"}, {"letter": "C", "text": "AWS CloudFormation"}, {"letter": "D", "text": "Amazon EMR"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nPartyRock is a no-code playground built on Amazon Bedrock that allows anyone to create, share, and experiment with generative AI applications without writing code or needing an AWS account. SageMaker Studio requires coding expertise. CloudFormation is for infrastructure provisioning. EMR is for big data processing.", "multi": false, "domain": 3}, {"num": 62, "source": "Exam 1", "text": "A developer is implementing a RAG system and needs to decide how to generate embeddings for their documents. Which consideration is MOST important when selecting an embedding model?", "options": [{"letter": "A", "text": "The embedding model must be the same model used for text generation"}, {"letter": "B", "text": "The embedding dimensions should match the vector database configuration, and the model should be trained on similar domain data"}, {"letter": "C", "text": "Embeddings should always be exactly 2 dimensions for visualization"}, {"letter": "D", "text": "The embedding model should only support English language text"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nThe embedding model's output dimensions must be compatible with the vector database index configuration, and domain-relevant training improves semantic similarity accuracy. The embedding and generation models are typically different. 2D embeddings lose too much information for retrieval. Multilingual support may be needed depending on the use case.", "multi": false, "domain": 3}, {"num": 63, "source": "Exam 1", "text": "A company is using Amazon Bedrock Agents and needs their agent to access current inventory data from their database when answering customer questions. How should the agent be configured to access this external data?", "options": [{"letter": "A", "text": "Configure action groups with Lambda functions that query the inventory database"}, {"letter": "B", "text": "The agent should be trained on all possible inventory data combinations"}, {"letter": "C", "text": "Hard-code all inventory levels into the system prompt"}, {"letter": "D", "text": "Use a larger foundation model that has memorized the inventory data"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nBedrock Agents use action groups backed by Lambda functions to interact with external systems and databases in real-time. This allows dynamic data access without retraining. Pre-training on inventory data creates stale information. Hard-coding in prompts is impractical for changing data. No model memorizes specific business data.", "multi": false, "domain": 3}, {"num": 65, "source": "Exam 1", "text": "A company wants to customize a foundation model's behavior for their specific use case without the full cost of fine-tuning. They want to add specific knowledge and adjust the response style using only prompt engineering. Which techniques should they combine? (Select TWO)", "options": [{"letter": "A", "text": "System prompts with detailed persona and behavioral instructions"}, {"letter": "B", "text": "Modifying the model's neural network weights directly"}, {"letter": "C", "text": "Few-shot examples demonstrating the desired input-output format"}, {"letter": "D", "text": "Changing the model's tokenizer vocabulary"}, {"letter": "E", "text": "Reducing the model's context window size"}], "correct": ["A", "C"], "explanation": "<strong>Explanation:</strong>\nSystem prompts define persistent behavior guidelines and persona, while few-shot examples demonstrate the specific format and style expected. Together they customize model behavior without modifying weights, which is what makes them prompt engineering (not fine-tuning). Modifying weights or tokenizer requires training. Reducing context window limits capability.", "multi": true, "domain": 3}, {"num": 66, "source": "Exam 1", "text": "A developer is implementing conversation memory for their chatbot built on Amazon Bedrock. The application needs to maintain context across multiple user interactions within a session. Which approach is MOST appropriate?", "options": [{"letter": "A", "text": "Use a separate model for each conversation turn"}, {"letter": "B", "text": "Retrain the model after each user message"}, {"letter": "C", "text": "Store the entire conversation history and pass it with each new request within the context window"}, {"letter": "D", "text": "Store only the first message and discard all subsequent context"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSince LLMs are stateless, conversation memory is implemented by storing the chat history and including it in each subsequent API request within the model's context window. This allows the model to reference prior turns. Retraining per message is impractical. Separate models fragment context. Discarding history eliminates the ability to reference previous exchanges.", "multi": false, "domain": 3}, {"num": 67, "source": "Exam 1", "text": "A company has deployed a RAG application but finds that retrieved documents sometimes don't contain the answer to the user's question, leading to low-quality responses. Which improvement would MOST help address this retrieval quality issue?", "options": [{"letter": "A", "text": "Increasing the temperature of the generation model"}, {"letter": "B", "text": "Removing the retrieval step entirely and relying on the model's training knowledge"}, {"letter": "C", "text": "Using a smaller embedding model with fewer dimensions"}, {"letter": "D", "text": "Improving the chunking strategy and adding metadata filtering to refine retrieval results"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nBetter chunking preserves semantic context, and metadata filtering narrows retrieval to relevant document subsets, both improving retrieval quality. Higher temperature affects generation randomness, not retrieval. Smaller embeddings may lose important semantic information. Removing retrieval eliminates the RAG benefit and increases hallucination risk.", "multi": false, "domain": 3}, {"num": 73, "source": "Exam 1", "text": "A team is using Amazon Bedrock Knowledge Bases for their RAG application. They want to improve retrieval accuracy by using semantic search. What underlying technology enables semantic search to find conceptually related documents even when exact keywords don't match?", "options": [{"letter": "A", "text": "SQL database queries with LIKE operators"}, {"letter": "B", "text": "Simple string matching algorithms"}, {"letter": "C", "text": "Vector embeddings that represent semantic meaning in mathematical space"}, {"letter": "D", "text": "File system directory structure"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSemantic search uses vector embeddings to represent text meaning as mathematical vectors in high-dimensional space, where conceptually similar content has vectors close together regardless of exact wording. SQL LIKE operators and string matching only find literal text matches. File system structure has no semantic understanding.", "multi": false, "domain": 3}, {"num": 74, "source": "Exam 1", "text": "A developer is implementing a Bedrock Agent that needs to decide between multiple action groups based on user intent. The agent must determine whether to search a knowledge base, call an API, or ask for clarification. What enables this decision-making capability?", "options": [{"letter": "A", "text": "Hard-coded if-else rules in the application"}, {"letter": "B", "text": "User manually selecting which action to take each time"}, {"letter": "C", "text": "A separate classification model that must be trained first"}, {"letter": "D", "text": "The foundation model's reasoning capabilities combined with action group descriptions and instructions"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nBedrock Agents leverage the underlying foundation model's reasoning ability to interpret user intent and select appropriate action groups based on their descriptions and the agent's instructions. This is orchestrated by the model, not hard-coded rules. No separate classification model is needed. Users don't manually select actions.", "multi": false, "domain": 3}, {"num": 76, "source": "Exam 1", "text": "A team has built a RAG application that retrieves relevant documents but sometimes generates responses that don't properly synthesize the retrieved information. Which approach would MOST improve the generation quality given already-relevant retrieved documents?", "options": [{"letter": "A", "text": "Retrieving more documents regardless of relevance"}, {"letter": "B", "text": "Using a smaller context window"}, {"letter": "C", "text": "Optimizing the generation prompt with clear instructions on how to use retrieved context and cite sources"}, {"letter": "D", "text": "Removing the system prompt"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nWhen retrieval quality is good but generation quality is poor, the issue is in how the model uses the context. Clear prompt instructions on synthesizing retrieved information and citing sources improve generation quality. More irrelevant documents add noise. Smaller context windows limit available information. Removing system prompts reduces control over response formatting.", "multi": false, "domain": 3}, {"num": 78, "source": "Exam 1", "text": "A company is deploying a Bedrock-powered application that needs to handle high traffic with consistent low-latency responses. They want guaranteed throughput rather than shared on-demand capacity. Which Bedrock pricing option should they choose?", "options": [{"letter": "A", "text": "On-demand pricing with pay-per-token"}, {"letter": "B", "text": "Free tier with rate limiting"}, {"letter": "C", "text": "Spot instances for foundation models"}, {"letter": "D", "text": "Provisioned Throughput with reserved model capacity"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nProvisioned Throughput reserves dedicated model capacity ensuring consistent performance and guaranteed throughput for high-traffic applications. On-demand pricing is pay-per-use but shares capacity and may have variable latency under load. There are no spot instances for Bedrock models. Free tier has significant limitations.", "multi": false, "domain": 3}, {"num": 79, "source": "Exam 1", "text": "A team is building a RAG application and needs to decide on a vector database solution that integrates natively with Amazon Bedrock Knowledge Bases. Which options are supported as vector stores? (Select TWO)", "options": [{"letter": "A", "text": "Amazon DynamoDB"}, {"letter": "B", "text": "Amazon OpenSearch Serverless"}, {"letter": "C", "text": "Amazon Redshift Serverless"}, {"letter": "D", "text": "Pinecone"}, {"letter": "E", "text": "Amazon RDS for MySQL"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nAmazon Bedrock Knowledge Bases supports multiple vector store options including Amazon OpenSearch Serverless, Pinecone, Redis Enterprise Cloud, and Amazon Aurora PostgreSQL with pgvector. DynamoDB is a key-value store without vector search. Redshift is for analytics. Standard RDS MySQL doesn't support vector operations natively.", "multi": true, "domain": 3}, {"num": 80, "source": "Exam 1", "text": "A developer is building a text summarization application and needs to handle documents that exceed the foundation model's context window. Which technique allows processing documents longer than the model's maximum input length?", "options": [{"letter": "A", "text": "Chunking the document and using iterative/hierarchical summarization (map-reduce approach)"}, {"letter": "B", "text": "Simply truncating the document to fit the context window"}, {"letter": "C", "text": "Increasing the temperature to process more text"}, {"letter": "D", "text": "Switching to a model with infinite context length"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nThe map-reduce approach splits long documents into chunks that fit the context window, summarizes each chunk separately, then combines the summaries for a final summary. Truncation loses information. Temperature doesn't affect context capacity. No current model has truly infinite context length.", "multi": false, "domain": 3}, {"num": 82, "source": "Exam 1", "text": "A team is fine-tuning a foundation model on Amazon Bedrock and wants to evaluate whether the fine-tuned model outperforms the base model on their specific task. Which evaluation approach provides the MOST comprehensive comparison?", "options": [{"letter": "A", "text": "Comparing only the training loss between models"}, {"letter": "B", "text": "Comparing the models' pre-training dataset sizes"}, {"letter": "C", "text": "Checking which model has more parameters"}, {"letter": "D", "text": "Running both models on a held-out test set and comparing task-specific metrics plus human evaluation"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nComprehensive evaluation requires testing on unseen data with task-relevant metrics (accuracy, ROUGE, BLEU) combined with human evaluation for quality aspects that automated metrics may miss. Training loss alone doesn't measure real-world performance. Parameter count doesn't determine task-specific quality. Pre-training dataset size is irrelevant to fine-tuned performance comparison.", "multi": false, "domain": 3}, {"num": 83, "source": "Exam 1", "text": "A developer wants to create an application that can search through company meeting transcripts and answer questions about past discussions. Which combination of Amazon Bedrock features would create this application with minimal custom development? (Select TWO)", "options": [{"letter": "A", "text": "Amazon Bedrock Knowledge Bases to index and retrieve relevant transcript passages"}, {"letter": "B", "text": "Amazon Bedrock Custom Model Import to train a model on transcripts"}, {"letter": "C", "text": "A foundation model (like Claude) to generate answers based on retrieved context"}, {"letter": "D", "text": "Amazon Bedrock Provisioned Throughput to train the model"}, {"letter": "E", "text": "Amazon Bedrock Guardrails to generate the answers"}], "correct": ["A", "C"], "explanation": "<strong>Explanation:</strong>\nKnowledge Bases handles document ingestion, chunking, embedding, and retrieval of relevant transcript passages. A foundation model then generates natural language answers from the retrieved context. This is standard RAG architecture. Custom Model Import is for bringing external models. Provisioned Throughput is for capacity, not training. Guardrails filter content but don't generate answers.", "multi": true, "domain": 3}, {"num": 84, "source": "Exam 1", "text": "A company is considering using parameter-efficient fine-tuning (PEFT) techniques like LoRA instead of full fine-tuning for their foundation model. Which advantage does PEFT provide over full fine-tuning?", "options": [{"letter": "A", "text": "PEFT always produces better model accuracy than full fine-tuning"}, {"letter": "B", "text": "PEFT eliminates the need for any training data"}, {"letter": "C", "text": "PEFT requires more training data than full fine-tuning"}, {"letter": "D", "text": "PEFT reduces computational cost and storage by training only a small number of additional parameters while freezing most of the original model"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nPEFT techniques like LoRA add small trainable matrices while keeping the original model frozen, dramatically reducing compute, memory, and storage requirements. Full fine-tuning can still achieve better accuracy in some cases, so PEFT doesn't always outperform it. PEFT doesn't require more data, and it still requires some training data.", "multi": false, "domain": 3}, {"num": 87, "source": "Exam 1", "text": "A company wants to deploy a generative AI solution that answers questions about their product catalog. They need the solution to be production-ready with minimal development effort. Which approach provides the fastest path to production while maintaining accuracy?", "options": [{"letter": "A", "text": "Training a custom LLM from scratch on product data"}, {"letter": "B", "text": "Hiring a team to manually write answers for every possible question"}, {"letter": "C", "text": "Using Amazon Bedrock Knowledge Bases with their product documentation as the data source"}, {"letter": "D", "text": "Using a general-purpose search engine without AI"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nBedrock Knowledge Bases provides a managed RAG solution that ingests product documentation, creates embeddings, and enables accurate Q&A with minimal development effort. Training from scratch requires massive resources and time. Manual answer writing doesn't scale. A search engine without AI can't generate natural language answers.", "multi": false, "domain": 3}, {"num": 114, "source": "Exam 1", "text": "A security team wants to prevent prompt injection attacks where malicious users try to manipulate their Bedrock-powered application into ignoring system instructions. Which combination of defenses is MOST effective?", "options": [{"letter": "A", "text": "Only increasing the model's temperature setting"}, {"letter": "B", "text": "Input validation, Amazon Bedrock Guardrails with denied topics, and robust system prompts with clear boundaries"}, {"letter": "C", "text": "Removing all system prompts so there's nothing to override"}, {"letter": "D", "text": "Allowing all user inputs without any filtering"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nDefending against prompt injection requires multiple layers: validating and sanitizing inputs, using Bedrock Guardrails to filter dangerous patterns, and designing robust system prompts that are difficult to override. Temperature settings don't prevent injection. Removing system prompts removes desired behavior controls. No filtering allows all attacks through.", "multi": false, "domain": 3}, {"num": 34, "source": "Exam 2", "text": "When you deploy a machine learning model using Amazon SageMaker, what is the purpose of \"inference\"?", "options": [{"letter": "A", "text": "The process of training the model on new data."}, {"letter": "B", "text": "The process of evaluating the model's performance on a test set."}, {"letter": "C", "text": "The process of labeling data for supervised learning."}, {"letter": "D", "text": "The process of making predictions or generating outputs using a trained model."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nInference, in machine learning, refers to the act of using a trained model to make predictions or generate outputs on new, unseen data. After a model is trained and deployed (e.g., to a SageMaker endpoint), applications send new inputs to the endpoint, and the model performs inference to return predictions.", "multi": false, "domain": 3}, {"num": 86, "source": "Exam 2", "text": "What is the primary benefit of using Amazon SageMaker JumpStart?", "options": [{"letter": "A", "text": "To offer a curated set of pre-built ML solutions, models, and notebooks to accelerate development."}, {"letter": "B", "text": "To automatically label large datasets for computer vision tasks."}, {"letter": "C", "text": "To monitor deployed ML models for data drift."}, {"letter": "D", "text": "To provide a no-code visual interface for ML development."}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker JumpStart provides a hub of pre-built machine learning solutions, foundation models, algorithms, and notebooks. It allows developers to quickly get started with common ML use cases by deploying ready-to-use models or solutions with just a few clicks, significantly accelerating the development process.", "multi": false, "domain": 3}, {"num": 90, "source": "Exam 2", "text": "A product team wants to quickly prototype an AI-powered application idea without writing any code or setting up AWS infrastructure. They want to experiment with foundation models using a simple web interface. Which AWS offering enables this rapid prototyping?", "options": [{"letter": "A", "text": "Amazon Bedrock Console"}, {"letter": "B", "text": "Amazon SageMaker JumpStart"}, {"letter": "C", "text": "Amazon Q Developer"}, {"letter": "D", "text": "Amazon PartyRock"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon PartyRock is a free, no-code playground built on Amazon Bedrock that lets anyone build generative AI-powered apps through a simple web interface without needing an AWS account or infrastructure setup. The Bedrock Console requires an AWS account and some technical knowledge. SageMaker JumpStart requires SageMaker setup. Q Developer is a coding assistant.", "multi": false, "domain": 3}, {"num": 92, "source": "Exam 2", "text": "When deploying an Amazon SageMaker model for real-time predictions, what is the primary purpose of a \"Production Variant\"?", "options": [{"letter": "A", "text": "To specify the data preprocessing steps for inference."}, {"letter": "B", "text": "To store the model artifacts in S3."}, {"letter": "C", "text": "To trigger model retraining jobs."}, {"letter": "D", "text": "To define the hardware configuration and traffic distribution for a deployed model."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nIn Amazon SageMaker, when you deploy a model to an endpoint, you define one or more \"Production Variants.\" Each variant specifies the compute instance type, the number of instances, and how traffic should be routed to that particular model version. This allows for A/B testing, blue/green deployments, and scaling of different model versions.", "multi": false, "domain": 3}];
const TOTAL = QUESTIONS.length;
let answeredCount = 0;
let correctCount  = 0;

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function buildQuiz() {
  const container = document.getElementById("questions");
  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = "question-card";
    card.id = "q" + idx;
    const multiBadge = q.multi ? "<span class=\"multi-badge\">Select 2</span>" : "";
    const srcBadge   = "<span class=\"q-source\">" + escHtml(q.source) + "</span>";
    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q${q.num}</span>
        ${srcBadge}
        <span class="q-text">${escHtml(q.text)}${multiBadge}</span>
      </div>
      <div class="options" id="opts_${idx}">
        ${q.options.map(o =>
          "<label class=\"option-label\" id=\"lbl_" + idx + "_" + o.letter + "\">" +
          "<input type=\"" + (q.multi ? "checkbox" : "radio") + "\" name=\"q" + idx + "\" value=\"" + o.letter + "\" />" +
          "<span class=\"letter\">" + o.letter + ")</span>" +
          "<span>" + escHtml(o.text) + "</span>" +
          "</label>"
        ).join("")}
      </div>
      <button class="submit-btn" onclick="submitAnswer(${idx})">Check Answer</button>
      <div id="badge_${idx}" style="margin-top:12px;"></div>
      <details class="explanation" id="exp_${idx}">
        <summary>&#x1F4A1; Explanation</summary>
        <div class="explanation-body">${q.explanation}</div>
      </details>
    `;
    container.appendChild(card);
  });
}

function getSelected(idx) {
  return Array.from(document.querySelectorAll("[name=\"q" + idx + "\"]:checked")).map(i => i.value);
}

function submitAnswer(idx) {
  const q = QUESTIONS[idx];
  const selected = getSelected(idx);
  if (!selected.length) return;

  document.querySelectorAll("[name=\"q" + idx + "\"]").forEach(i => i.disabled = true);
  document.querySelector("#q" + idx + " .submit-btn").disabled = true;

  q.options.forEach(o => {
    const lbl = document.getElementById("lbl_" + idx + "_" + o.letter);
    lbl.classList.add("disabled");
    if (q.correct.includes(o.letter)) lbl.classList.add("correct");
    else if (selected.includes(o.letter)) lbl.classList.add("wrong");
  });

  const correctSet  = new Set(q.correct);
  const selectedSet = new Set(selected);
  let result;
  if (q.multi) {
    const allCorrect = q.correct.every(l => selectedSet.has(l)) && selected.every(l => correctSet.has(l));
    result = allCorrect ? "correct" : (q.correct.some(l => selectedSet.has(l)) ? "partial" : "wrong");
  } else {
    result = (selected.length === 1 && selected[0] === q.correct[0]) ? "correct" : "wrong";
  }

  const badge = document.getElementById("badge_" + idx);
  const corrStr = q.correct.join(", ");
  if (result === "correct") {
    badge.innerHTML = "<span class=\"result-badge correct\">&#x2713; Correct!</span>";
    document.getElementById("q" + idx).classList.add("answered-correct");
    correctCount++;
  } else if (result === "partial") {
    badge.innerHTML = "<span class=\"result-badge partial\">Partially Correct — full answer: " + corrStr + "</span>";
    document.getElementById("q" + idx).classList.add("answered-partial");
  } else {
    badge.innerHTML = "<span class=\"result-badge wrong\">&#x2717; Incorrect — correct: " + corrStr + "</span>";
    document.getElementById("q" + idx).classList.add("answered-wrong");
  }

  document.getElementById("exp_" + idx).setAttribute("open", "");
  answeredCount++;
  updateProgress();
  if (answeredCount === TOTAL) showScore();
}

function updateProgress() {
  document.getElementById("progress-bar").style.width = (answeredCount / TOTAL * 100) + "%";
  document.getElementById("progress-text").textContent = answeredCount + " / " + TOTAL + " answered";
}

function showScore() {
  const panel = document.getElementById("score-panel");
  panel.style.display = "block";
  document.getElementById("score-correct").textContent = correctCount;
  const pct = Math.round(correctCount / TOTAL * 100);
  document.getElementById("score-pct").textContent = "out of " + TOTAL + " questions (" + pct + "%)";
  let grade;
  if (pct >= 90)      grade = "Excellent — strong domain mastery!";
  else if (pct >= 75) grade = "Good — review your misses and try again.";
  else if (pct >= 60) grade = "Needs work — spend more time on this domain.";
  else                grade = "Focus here — this domain needs significant study.";
  document.getElementById("score-grade").textContent = grade;
  panel.scrollIntoView({ behavior: "smooth" });
}

buildQuiz();
updateProgress();
</script>
