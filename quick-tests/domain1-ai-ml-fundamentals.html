<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Domain 1: Fundamentals of AI and ML</title>
<style>
  :root {
    --accent:  #1565C0;
    --navy:    #232F3E;
    --correct-bg: #d4edda; --correct-border: #28a745;
    --wrong-bg:   #f8d7da; --wrong-border:   #dc3545;
    --neutral-bg: #f4f6f8; --card-bg: #ffffff;
    --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: var(--neutral-bg); color: #222; line-height: 1.6; }

  header {
    background: var(--navy); color: #fff; padding: 16px 24px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  header h1 { font-size: 1rem; font-weight: 700; }
  header h1 span { color: #1565C0; }
  .header-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; flex-wrap: wrap; gap: 8px; }
  #progress-bar-wrap { flex: 1; background: rgba(255,255,255,0.2); border-radius: 4px; height: 6px; min-width: 120px; }
  #progress-bar { height: 6px; border-radius: 4px; background: #1565C0; transition: width 0.3s; width: 0%; }
  #progress-text { font-size: 0.8rem; color: #ccc; white-space: nowrap; }
  .back-link { font-size: 0.8rem; color: #aaa; text-decoration: none; margin-right: 12px; }
  .back-link:hover { color: #fff; }

  main { max-width: 860px; margin: 28px auto; padding: 0 16px 60px; }

  .domain-badge {
    display: inline-block; background: #1565C0; color: #fff;
    border-radius: 6px; padding: 6px 16px; font-size: 0.85rem;
    font-weight: 700; margin-bottom: 24px;
  }

  .question-card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px; margin-bottom: 28px;
    border-left: 5px solid #ddd; transition: border-color 0.3s;
  }
  .question-card.answered-correct { border-left-color: var(--correct-border); }
  .question-card.answered-wrong   { border-left-color: var(--wrong-border); }
  .question-card.answered-partial { border-left-color: #1565C0; }

  .q-header { display: flex; gap: 12px; align-items: baseline; margin-bottom: 14px; flex-wrap: wrap; }
  .q-num {
    font-size: 0.72rem; font-weight: 700; background: var(--navy);
    color: #fff; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
  }
  .q-source {
    font-size: 0.68rem; color: #888; background: #eee;
    padding: 1px 7px; border-radius: 10px; white-space: nowrap; flex-shrink: 0;
  }
  .q-text { font-size: 0.97rem; font-weight: 600; line-height: 1.5; }
  .multi-badge {
    font-size: 0.7rem; background: #1565C0; color: #fff;
    border-radius: 4px; padding: 1px 6px; margin-left: 6px;
    font-weight: 600; white-space: nowrap;
  }

  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .option-label {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px;
    cursor: pointer; transition: border-color 0.15s, background 0.15s; font-size: 0.92rem;
  }
  .option-label:hover { border-color: #1565C0; background: #f5f5ff; }
  .option-label input { flex-shrink: 0; margin-top: 3px; accent-color: #1565C0; }
  .option-label .letter { font-weight: 700; color: var(--navy); flex-shrink: 0; min-width: 22px; }
  .option-label.correct { border-color: var(--correct-border); background: var(--correct-bg); }
  .option-label.wrong   { border-color: var(--wrong-border);   background: var(--wrong-bg); }
  .option-label.disabled { cursor: default; pointer-events: none; }
  .option-label.correct::after { content: " ✓"; color: var(--correct-border); font-weight: 700; }
  .option-label.wrong::after   { content: " ✗"; color: var(--wrong-border);   font-weight: 700; }

  .submit-btn {
    display: inline-block; padding: 9px 22px; background: var(--navy);
    color: #fff; border: none; border-radius: 6px; font-size: 0.9rem;
    font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .submit-btn:hover { background: #1565C0; }
  .submit-btn:disabled { background: #aaa; cursor: default; }

  .result-badge {
    display: inline-block; font-size: 0.8rem; font-weight: 700;
    padding: 2px 10px; border-radius: 12px; margin-bottom: 12px;
  }
  .result-badge.correct { background: var(--correct-bg); color: var(--correct-border); border: 1px solid var(--correct-border); }
  .result-badge.wrong   { background: var(--wrong-bg);   color: var(--wrong-border);   border: 1px solid var(--wrong-border); }
  .result-badge.partial { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }

  .explanation { margin-top: 16px; border-radius: 8px; border: 1px solid #d0d0d0; overflow: hidden; }
  .explanation summary {
    list-style: none; padding: 10px 16px; background: #f0f0f0;
    cursor: pointer; font-size: 0.88rem; font-weight: 600;
    display: flex; align-items: center; gap: 8px; user-select: none;
  }
  .explanation summary::-webkit-details-marker { display: none; }
  .explanation summary::before { content: "▶"; font-size: 0.7rem; transition: transform 0.2s; }
  .explanation[open] summary::before { transform: rotate(90deg); }
  .explanation-body {
    padding: 14px 16px; font-size: 0.9rem; line-height: 1.65;
    background: #fafafa; border-top: 1px solid #d0d0d0;
  }

  #score-panel {
    display: none; background: var(--navy); color: #fff;
    border-radius: var(--radius); padding: 32px; text-align: center;
    margin-bottom: 40px; box-shadow: var(--shadow);
  }
  #score-panel h2 { font-size: 1.4rem; margin-bottom: 8px; }
  .score-num { font-size: 3rem; font-weight: 900; color: #1565C0; }
  .score-pct { font-size: 1rem; color: #ccc; margin-bottom: 16px; }
  .score-grade { font-size: 1rem; }

  @media (max-width: 600px) {
    header { padding: 12px 14px; }
    .question-card { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1><span>Domain 1: Fundamentals of AI and ML</span></h1>
    <div class="header-meta">
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
      <span id="progress-text">0 / 117 answered</span>
    </div>
  </div>
</header>
<main>
  <div id="score-panel">
    <h2>Domain Complete!</h2>
    <div class="score-num" id="score-correct">0</div>
    <div class="score-pct" id="score-pct">out of 117 questions</div>
    <div class="score-grade" id="score-grade"></div>
  </div>
  <div id="questions"></div>
</main>
<script>
const QUESTIONS = [{"num": 1, "source": "Exam 1", "text": "A machine learning team is building a model to predict customer churn for a subscription service. They have historical data with labeled outcomes showing which customers canceled. Which type of machine learning approach is most appropriate for this use case?", "options": [{"letter": "A", "text": "Unsupervised learning with k-means clustering"}, {"letter": "B", "text": "Reinforcement learning with a reward function"}, {"letter": "C", "text": "Supervised learning with a classification algorithm"}, {"letter": "D", "text": "Semi-supervised learning with autoencoders"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSince the team has labeled historical data (customers who did or did not churn), this is a supervised learning classification problem. Unsupervised learning would be used when labels are not available. Reinforcement learning is for sequential decision-making with rewards, not for predicting outcomes from historical data. Semi-supervised learning is used when only a small portion of data is labeled.", "multi": false, "domain": 1}, {"num": 2, "source": "Exam 1", "text": "A data scientist is analyzing customer purchase behavior to identify distinct groups for targeted marketing campaigns. The dataset contains transaction history but no predefined categories. Which machine learning approach should they use?", "options": [{"letter": "A", "text": "Supervised learning with logistic regression"}, {"letter": "B", "text": "Unsupervised learning with clustering algorithms"}, {"letter": "C", "text": "Supervised learning with random forests"}, {"letter": "D", "text": "Reinforcement learning with Q-learning"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nWhen there are no predefined categories or labels and the goal is to discover natural groupings in data, unsupervised learning with clustering is the appropriate approach. Supervised learning requires labeled data. Reinforcement learning is designed for sequential decision-making problems, not pattern discovery in static datasets.", "multi": false, "domain": 1}, {"num": 3, "source": "Exam 1", "text": "A company is training a deep learning model to classify medical images. The model performs well on training data but poorly on unseen test data. Which technique would MOST likely help address this issue?", "options": [{"letter": "A", "text": "Applying regularization techniques such as dropout"}, {"letter": "B", "text": "Increasing the number of layers in the neural network"}, {"letter": "C", "text": "Removing the validation dataset from the pipeline"}, {"letter": "D", "text": "Increasing the learning rate significantly"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nThe described scenario is classic overfitting, where the model memorizes training data but fails to generalize. Regularization techniques like dropout help prevent overfitting by randomly disabling neurons during training. Increasing network depth or learning rate could worsen overfitting. Removing the validation dataset would eliminate the ability to detect overfitting early.", "multi": false, "domain": 1}, {"num": 5, "source": "Exam 1", "text": "A data scientist wants to reduce the dimensionality of a dataset with 500 features before training a model. They need to retain as much variance in the data as possible. Which technique is MOST appropriate?", "options": [{"letter": "A", "text": "L1 regularization (Lasso)"}, {"letter": "B", "text": "K-nearest neighbors"}, {"letter": "C", "text": "Gradient boosting"}, {"letter": "D", "text": "Principal Component Analysis (PCA)"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nPCA is a dimensionality reduction technique that transforms features into principal components while retaining maximum variance. L1 regularization performs feature selection but doesn't transform features. Gradient boosting is an ensemble learning method, not a dimensionality reduction technique. K-nearest neighbors is a classification/regression algorithm.", "multi": false, "domain": 1}, {"num": 6, "source": "Exam 1", "text": "A company is using Amazon SageMaker to train a model. They need to automatically find the best combination of hyperparameters to optimize model performance. Which SageMaker feature should they use?", "options": [{"letter": "A", "text": "SageMaker Data Wrangler"}, {"letter": "B", "text": "SageMaker Feature Store"}, {"letter": "C", "text": "SageMaker Automatic Model Tuning (Hyperparameter Optimization)"}, {"letter": "D", "text": "SageMaker Model Monitor"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSageMaker Automatic Model Tuning (also called Hyperparameter Optimization) automatically searches for the best hyperparameter combinations using Bayesian optimization or other strategies. Data Wrangler is for data preparation and transformation. Feature Store manages ML features. Model Monitor detects data drift in deployed models.", "multi": false, "domain": 1}, {"num": 8, "source": "Exam 1", "text": "A company is developing a time-series forecasting model to predict stock prices based on historical sequential data. Which neural network architecture is BEST suited for capturing temporal dependencies in this data?", "options": [{"letter": "A", "text": "Convolutional Neural Network (CNN)"}, {"letter": "B", "text": "Generative Adversarial Network (GAN)"}, {"letter": "C", "text": "Recurrent Neural Network (RNN) or LSTM"}, {"letter": "D", "text": "Feedforward Neural Network"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nRNNs and LSTMs are specifically designed to process sequential data and capture temporal dependencies through their recurrent connections and memory mechanisms. CNNs are optimized for spatial data like images. GANs are used for data generation. Feedforward networks don't have memory of previous inputs needed for sequence modeling.", "multi": false, "domain": 1}, {"num": 10, "source": "Exam 1", "text": "A data scientist notices that their gradient boosting model has high variance and is overfitting the training data. Which combination of techniques would MOST effectively address this? (Select TWO)", "options": [{"letter": "A", "text": "Increasing the maximum tree depth"}, {"letter": "B", "text": "Reducing the learning rate and increasing the number of estimators"}, {"letter": "C", "text": "Removing all regularization parameters"}, {"letter": "D", "text": "Adding L2 regularization and limiting tree depth"}, {"letter": "E", "text": "Converting the problem to unsupervised learning"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nReducing the learning rate with more estimators creates a more gradual learning process that generalizes better. L2 regularization penalizes complex models and limiting tree depth prevents individual trees from memorizing training data. Increasing tree depth or removing regularization would worsen overfitting. Converting to unsupervised learning changes the problem entirely.", "multi": true, "domain": 1}, {"num": 11, "source": "Exam 1", "text": "A company wants to deploy a machine learning model that predicts whether loan applications should be approved or denied. The model needs to minimize the number of approved loans that actually default. Which metric should they prioritize?", "options": [{"letter": "A", "text": "Recall (sensitivity)"}, {"letter": "B", "text": "Area Under the ROC Curve (AUC-ROC)"}, {"letter": "C", "text": "Overall accuracy"}, {"letter": "D", "text": "Precision for the \"approve\" class"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nPrecision for the approve class measures what proportion of approved loans are actually good loans (true positives among predicted positives). This directly minimizes defaults among approved loans. Recall focuses on finding all good loans, which could approve risky ones. Overall accuracy doesn't distinguish between error types. AUC-ROC measures general discriminative ability but doesn't specifically optimize for minimizing defaults.", "multi": false, "domain": 1}, {"num": 12, "source": "Exam 1", "text": "A machine learning team is building a recommendation system for an e-commerce platform. They have user interaction data including clicks, purchases, and ratings. Which approach would MOST effectively leverage all these signal types?", "options": [{"letter": "A", "text": "Content-based filtering using only product descriptions"}, {"letter": "B", "text": "A simple popularity-based ranking system"}, {"letter": "C", "text": "Rule-based recommendations using only purchase history"}, {"letter": "D", "text": "Collaborative filtering combined with implicit and explicit feedback signals"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nCollaborative filtering with both implicit signals (clicks) and explicit signals (ratings, purchases) leverages all available user interaction data for comprehensive recommendations. Content-based filtering ignores user behavior patterns. Popularity-based ranking doesn't personalize. Rule-based approaches using only purchases miss valuable click and rating signals.", "multi": false, "domain": 1}, {"num": 13, "source": "Exam 1", "text": "A data engineer is preparing features for a machine learning model. The dataset contains a categorical variable \"country\" with 195 unique values. Which feature engineering technique is MOST appropriate to encode this variable without creating excessive dimensionality?", "options": [{"letter": "A", "text": "One-hot encoding all 195 categories"}, {"letter": "B", "text": "Converting country names to their ASCII character sum"}, {"letter": "C", "text": "Dropping the country feature entirely"}, {"letter": "D", "text": "Target encoding (mean encoding) with proper cross-validation"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nTarget encoding replaces each category with the mean of the target variable for that category, creating a single numeric feature regardless of cardinality. One-hot encoding 195 categories creates excessive dimensionality and sparse features. Dropping the feature loses potentially valuable information. ASCII character sums have no meaningful relationship to the target variable.", "multi": false, "domain": 1}, {"num": 14, "source": "Exam 1", "text": "A team is training a neural network and observes that the loss function oscillates wildly and fails to converge during training. Which adjustment is MOST likely to resolve this issue?", "options": [{"letter": "A", "text": "Reducing the learning rate"}, {"letter": "B", "text": "Increasing the batch size to the full dataset"}, {"letter": "C", "text": "Adding more hidden layers"}, {"letter": "D", "text": "Removing all activation functions"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nOscillating loss that fails to converge is a classic sign of a learning rate that is too high, causing gradient descent to overshoot the minimum. Reducing the learning rate allows smaller, more stable steps toward convergence. Using the full dataset as batch size would slow training significantly. Adding layers increases complexity. Removing activation functions eliminates the network's ability to learn non-linear patterns.", "multi": false, "domain": 1}, {"num": 15, "source": "Exam 1", "text": "A company wants to build a complete ML pipeline on AWS that includes data preparation, model training, and deployment. They need an integrated development environment with built-in algorithms and notebook support. Which AWS service provides this end-to-end capability?", "options": [{"letter": "A", "text": "AWS Lambda"}, {"letter": "B", "text": "Amazon SageMaker"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "AWS Glue"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker provides a complete ML platform with Jupyter notebooks, built-in algorithms, training infrastructure, and deployment capabilities for end-to-end ML workflows. AWS Lambda is for serverless computing, not ML development. Amazon Comprehend is a pre-built NLP service, not a development platform. AWS Glue is for ETL data processing, not model development.", "multi": false, "domain": 1}, {"num": 17, "source": "Exam 1", "text": "A machine learning engineer is implementing an ensemble method that trains multiple decision trees on random subsets of features and data, then aggregates their predictions by majority vote. Which algorithm does this describe?", "options": [{"letter": "A", "text": "Gradient Boosting"}, {"letter": "B", "text": "AdaBoost"}, {"letter": "C", "text": "Random Forest"}, {"letter": "D", "text": "Support Vector Machine"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nRandom Forest trains multiple decision trees on random subsets of both data (bagging) and features, then aggregates predictions through majority voting (classification) or averaging (regression). Gradient Boosting trains trees sequentially to correct previous errors. AdaBoost adjusts sample weights based on misclassifications. SVMs find optimal hyperplanes for classification.", "multi": false, "domain": 1}, {"num": 18, "source": "Exam 1", "text": "A team is working with a dataset where 5% of samples belong to the positive class and 95% to the negative class. They need to train a classifier that performs well on the minority class. Which strategies would help address this class imbalance? (Select TWO)", "options": [{"letter": "A", "text": "Using SMOTE (Synthetic Minority Over-sampling Technique) to generate synthetic samples"}, {"letter": "B", "text": "Removing all minority class samples to simplify the problem"}, {"letter": "C", "text": "Adjusting class weights in the loss function to penalize minority class errors more heavily"}, {"letter": "D", "text": "Increasing the decision threshold to 0.99"}, {"letter": "E", "text": "Using only accuracy as the evaluation metric"}], "correct": ["A", "C"], "explanation": "<strong>Explanation:</strong>\nSMOTE creates synthetic examples of the minority class to balance the dataset distribution. Adjusting class weights makes the model pay more attention to minority class errors during training. Removing minority samples eliminates the signal entirely. A very high threshold would classify almost nothing as positive. Accuracy is misleading with imbalanced data.", "multi": true, "domain": 1}, {"num": 19, "source": "Exam 1", "text": "A company uses Amazon SageMaker to manage their ML workflow. They need to store, discover, and share curated features across multiple ML projects and teams. Which SageMaker component serves this purpose?", "options": [{"letter": "A", "text": "SageMaker Model Registry"}, {"letter": "B", "text": "SageMaker Feature Store"}, {"letter": "C", "text": "SageMaker Experiments"}, {"letter": "D", "text": "SageMaker Pipelines"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nSageMaker Feature Store is a centralized repository for storing, sharing, and managing ML features across teams and projects, supporting both online (low-latency) and offline (batch) access patterns. Model Registry manages model versions. Experiments tracks training runs. Pipelines orchestrates ML workflows.", "multi": false, "domain": 1}, {"num": 20, "source": "Exam 1", "text": "A data scientist is training a logistic regression model and wants to prevent overfitting while also performing automatic feature selection by driving some feature coefficients to exactly zero. Which regularization technique should they apply?", "options": [{"letter": "A", "text": "Elastic Net with alpha = 0"}, {"letter": "B", "text": "L2 regularization (Ridge)"}, {"letter": "C", "text": "L1 regularization (Lasso)"}, {"letter": "D", "text": "No regularization with early stopping"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nL1 regularization (Lasso) adds the absolute value of coefficients as a penalty, which can drive coefficients to exactly zero, effectively performing feature selection. L2 regularization (Ridge) shrinks coefficients toward zero but rarely makes them exactly zero. Elastic Net with alpha=0 is equivalent to pure L2. Early stopping without regularization doesn't provide feature selection.", "multi": false, "domain": 1}, {"num": 21, "source": "Exam 1", "text": "A machine learning team wants to track and compare multiple training experiments, including hyperparameters, metrics, and artifacts. Which Amazon SageMaker capability enables this systematic experiment tracking?", "options": [{"letter": "A", "text": "SageMaker Ground Truth"}, {"letter": "B", "text": "SageMaker Experiments"}, {"letter": "C", "text": "SageMaker Debugger"}, {"letter": "D", "text": "SageMaker Neo"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nSageMaker Experiments enables tracking, organizing, and comparing ML experiments including hyperparameters, metrics, and model artifacts across multiple training runs. Ground Truth is for data labeling. Debugger monitors training issues in real-time. Neo optimizes models for deployment on edge devices.", "multi": false, "domain": 1}, {"num": 23, "source": "Exam 1", "text": "A machine learning engineer observes that their model's training loss continues decreasing while validation loss starts increasing after epoch 50. Which strategy directly addresses this behavior?", "options": [{"letter": "A", "text": "Training for more epochs to allow further optimization"}, {"letter": "B", "text": "Increasing model complexity with additional layers"}, {"letter": "C", "text": "Implementing early stopping based on validation loss"}, {"letter": "D", "text": "Using a larger learning rate for faster convergence"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nWhen training loss decreases but validation loss increases, the model is overfitting. Early stopping halts training when validation loss stops improving, preventing further overfitting. Training for more epochs or increasing complexity would worsen overfitting. A larger learning rate might cause instability but doesn't address the fundamental overfitting issue.", "multi": false, "domain": 1}, {"num": 24, "source": "Exam 1", "text": "A team is using gradient descent to optimize a neural network. They notice training is very slow with their dataset of 10 million samples. Which variant of gradient descent balances computational efficiency with stable convergence?", "options": [{"letter": "A", "text": "Batch gradient descent using all samples per update"}, {"letter": "B", "text": "Stochastic gradient descent using one sample per update"}, {"letter": "C", "text": "Mini-batch gradient descent using subsets of 32-256 samples"}, {"letter": "D", "text": "Second-order optimization using the full Hessian matrix"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nMini-batch gradient descent strikes a balance between the stability of batch gradient descent and the speed of stochastic gradient descent by computing gradients on small subsets. Full batch gradient descent is computationally expensive with 10 million samples. Pure stochastic (one sample) updates are noisy and unstable. Second-order methods with full Hessian are computationally prohibitive at this scale.", "multi": false, "domain": 1}, {"num": 26, "source": "Exam 1", "text": "A team is evaluating different foundation models for their text generation application. They need a model that can handle multiple languages and produce high-quality creative content. Which characteristic of foundation models makes this possible without training from scratch?", "options": [{"letter": "A", "text": "Foundation models are pre-trained on massive diverse datasets and can be adapted to many tasks"}, {"letter": "B", "text": "Foundation models are small models designed for single tasks"}, {"letter": "C", "text": "Foundation models only work with English language data"}, {"letter": "D", "text": "Foundation models require task-specific architectures for each use case"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nFoundation models are trained on massive, diverse datasets spanning multiple languages and domains, giving them broad capabilities that can be adapted to specific tasks without training from scratch. They are typically very large (not small), multilingual (not English-only), and use general architectures like transformers that handle multiple tasks.", "multi": false, "domain": 1}, {"num": 98, "source": "Exam 1", "text": "A data scientist is using SHAP values to explain their model's predictions. A customer's loan application was denied, and the SHAP analysis shows that \"employment_length\" had the highest negative contribution. What does this tell the team?", "options": [{"letter": "A", "text": "The employment_length feature should be removed from the model entirely"}, {"letter": "B", "text": "SHAP values indicate the feature is not important to the model"}, {"letter": "C", "text": "The model is completely broken and should be retrained"}, {"letter": "D", "text": "The customer's short employment length was the primary factor pushing the prediction toward denial"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nSHAP values show how each feature contributes to a specific prediction relative to the baseline. A high negative SHAP value for employment_length means this feature strongly pushed the prediction toward denial for this customer. It doesn't mean the feature should be removed (it may be legitimately predictive) or that the model is broken.", "multi": false, "domain": 1}, {"num": 2, "source": "Exam 2", "text": "You want to build a virtual contact center agent that can understand customer inquiries and respond with natural language. Which AWS service would provide the text-to-speech capability for the agent's responses?", "options": [{"letter": "A", "text": "Amazon Lex"}, {"letter": "B", "text": "Amazon Transcribe"}, {"letter": "C", "text": "Amazon Translate"}, {"letter": "D", "text": "Amazon Polly"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly is the text-to-speech (TTS) service that converts written text into lifelike speech. In a virtual contact center agent scenario, after Amazon Lex processes the customer's input and determines a response, Amazon Polly would be used to synthesize that response into spoken words. Amazon Transcribe is speech-to-text, Lex is for NLU/ASR, and Translate is for language translation.", "multi": false, "domain": 1}, {"num": 3, "source": "Exam 2", "text": "Which AWS service provides intelligent search capabilities across your enterprise data, allowing natural language queries and finding answers within documents, often leveraging connectors to various data sources?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon Elasticsearch Service (OpenSearch Service)"}, {"letter": "C", "text": "Amazon Kendra"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Kendra is an intelligent enterprise search service powered by machine learning. It excels at understanding natural language queries and delivering precise answers from a wide range of content repositories, including S3, SharePoint, Confluence, and more, using built-in connectors. Comprehend is for text NLP, Textract for document data extraction, and Elasticsearch Service is for raw search and analytics, but not specifically \"intelligent\" answer retrieval out-of-the-box in the same way Kendra is.", "multi": false, "domain": 1}, {"num": 4, "source": "Exam 2", "text": "True or False: Amazon SageMaker Feature Store is used to store and retrieve machine learning features for both training and inference consistently.", "options": [{"letter": "A", "text": "True"}, {"letter": "B", "text": "False"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Feature Store is a purpose-built repository that makes it easy to store, update, retrieve, and share machine learning (ML) features. It provides a unified store for features, ensuring consistency between features used for training and those used for real-time inference, which helps prevent training-serving skew.", "multi": false, "domain": 1}, {"num": 5, "source": "Exam 2", "text": "A machine learning model has very high accuracy on its training data but performs poorly on new, unseen data. What common problem does this indicate?", "options": [{"letter": "A", "text": "Overfitting"}, {"letter": "B", "text": "Data leakage"}, {"letter": "C", "text": "Underfitting"}, {"letter": "D", "text": "Good generalization"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nOverfitting occurs when a model learns the training data too well, memorizing noise and specific patterns rather than generalizing to underlying relationships. This leads to high performance on training data but poor performance on new, unseen data. Underfitting is the opposite (poor performance on both), and good generalization is the desired outcome.", "multi": false, "domain": 1}, {"num": 7, "source": "Exam 2", "text": "You need to analyze video footage to identify specific individuals or track their movements over time. Which capability of Amazon Rekognition would you leverage?", "options": [{"letter": "A", "text": "Face Recognition and Tracking"}, {"letter": "B", "text": "Custom Labels"}, {"letter": "C", "text": "Object and Scene Detection"}, {"letter": "D", "text": "Content Moderation"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition offers advanced capabilities for face recognition (identifying known faces) and face tracking in video. This allows you to identify specific individuals and follow their movements within a video stream, which goes beyond general object detection or content moderation.", "multi": false, "domain": 1}, {"num": 9, "source": "Exam 2", "text": "A financial institution wants to categorize incoming customer emails into categories like \"Loan Application,\" \"Account Inquiry,\" or \"Fraud Report\" automatically. Which AWS service is best suited for building a custom text classification model?", "options": [{"letter": "A", "text": "Amazon Lex"}, {"letter": "B", "text": "Amazon Transcribe"}, {"letter": "C", "text": "Amazon Comprehend Custom Classification"}, {"letter": "D", "text": "Amazon Personalize"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend Custom Classification allows you to train a machine learning model to categorize your documents using custom labels that are relevant to your business needs. This is ideal for automatically sorting and routing customer emails based on their content. Personalize is for recommendations, Transcribe for speech-to-text, and Lex for conversational AI.", "multi": false, "domain": 1}, {"num": 10, "source": "Exam 2", "text": "Which AWS service provides the primary storage solution for large datasets often used as input for AWS AI services and Amazon SageMaker training jobs?", "options": [{"letter": "A", "text": "Amazon RDS"}, {"letter": "B", "text": "Amazon EBS"}, {"letter": "C", "text": "Amazon S3"}, {"letter": "D", "text": "Amazon DynamoDB"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Simple Storage Service (S3) is highly scalable object storage perfect for storing vast amounts of unstructured data, making it the de facto data lake for machine learning workloads on AWS. It serves as the primary data source for training models in SageMaker and for input/output to most AWS AI services. RDS and DynamoDB are databases, and EBS provides block storage for EC2 instances.", "multi": false, "domain": 1}, {"num": 11, "source": "Exam 2", "text": "A company wants to quickly build a machine learning model to predict customer churn without writing any code. They have historical customer data in a CSV file. Which AWS service would enable them to do this using a visual interface?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon SageMaker Canvas"}, {"letter": "C", "text": "Amazon SageMaker Studio"}, {"letter": "D", "text": "Amazon SageMaker Notebook Instances"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Canvas is a no-code/low-code tool specifically designed for business users and citizen data scientists to build, train, and make predictions from ML models using a visual, drag-and-drop interface, without writing any code. SageMaker Studio and Notebook Instances are for ML practitioners who write code. Comprehend is an NLP service.", "multi": false, "domain": 1}, {"num": 12, "source": "Exam 2", "text": "Which concept describes the outcome when a machine learning model is too simple to capture the underlying patterns in the data, performing poorly on both training and new data?", "options": [{"letter": "A", "text": "High variance"}, {"letter": "B", "text": "Good generalization"}, {"letter": "C", "text": "Underfitting"}, {"letter": "D", "text": "Overfitting"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nUnderfitting occurs when a model is too simplistic or has not been trained enough to learn the complex relationships within the data. This results in poor performance on both the training data and unseen data, indicating the model hasn't effectively learned anything useful.", "multi": false, "domain": 1}, {"num": 13, "source": "Exam 2", "text": "Which AWS AI service can convert text from documents (e.g., PDF, image scans) into different languages while preserving the original layout and formatting?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon Translate Document Translation"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nWhile Amazon Translate handles text translation, Amazon Translate Document Translation is a specialized feature that translates entire documents while attempting to preserve their original layout and formatting. This goes beyond simple text-to-text translation offered by the core Translate service. Textract extracts text, and Comprehend is for NLP.", "multi": false, "domain": 1}, {"num": 15, "source": "Exam 2", "text": "A retail company wants to predict future product demand based on historical sales data, seasonal patterns, and promotional events. Which AWS service is purpose-built for this use case?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Comprehend"}, {"letter": "C", "text": "Amazon SageMaker Autopilot"}, {"letter": "D", "text": "Amazon Forecast"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Forecast is a fully managed service that uses machine learning to deliver highly accurate time-series forecasts. It is specifically designed for use cases like demand planning, resource planning, and financial forecasting. Amazon Personalize is for recommendations, Comprehend is for NLP, and while SageMaker Autopilot can build models, Forecast is purpose-built for time-series prediction.", "multi": false, "domain": 1}, {"num": 16, "source": "Exam 2", "text": "Which AWS service allows you to train a machine learning model to categorize entities unique to your industry (e.g., specific product names, custom medical conditions) from unstructured text?", "options": [{"letter": "A", "text": "Amazon Lex Custom Slots"}, {"letter": "B", "text": "Amazon Personalize Custom Solutions"}, {"letter": "C", "text": "Amazon Comprehend Custom Entities"}, {"letter": "D", "text": "Amazon Rekognition Custom Labels"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend Custom Entities allows you to create custom entity recognition models. This means you can train Comprehend to identify specific, domain-specific entities in your text data that are not part of its pre-built entities. Rekognition Custom Labels is for images, Personalize for recommendations, and Lex Custom Slots are for conversational interfaces.", "multi": false, "domain": 1}, {"num": 18, "source": "Exam 2", "text": "Which AWS AI service would you use to add text-to-speech capabilities to an application, offering both standard and Neural Text-to-Speech (NTTS) voices for a highly natural sound?", "options": [{"letter": "A", "text": "Amazon Transcribe"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Lex"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly is the service for converting text into lifelike speech. It offers a wide range of voices, including standard and advanced Neural Text-to-Speech (NTTS) voices that use deep learning to deliver highly natural and expressive speech, suitable for various applications.", "multi": false, "domain": 1}, {"num": 20, "source": "Exam 2", "text": "Which AWS service provides an automatic speech recognition (ASR) service that converts speech to text and can identify different speakers in an audio file (speaker diarization)?", "options": [{"letter": "A", "text": "Amazon Lex"}, {"letter": "B", "text": "Amazon Transcribe"}, {"letter": "C", "text": "Amazon Polly"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Transcribe is a fully managed ASR service. Beyond simply converting speech to text, it also offers advanced features like speaker diarization, which allows it to recognize and separate the speech of different speakers in an audio recording, indicating who said what.", "multi": false, "domain": 1}, {"num": 21, "source": "Exam 2", "text": "A company has a vast archive of legal documents and needs to automatically extract key phrases and entities such as \"Plaintiff,\" \"Defendant,\" \"Case Number,\" and \"Court Date\" from these documents. Which AWS AI service is specifically tailored for this purpose in the legal domain?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon Comprehend for Legal"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Comprehend Medical"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nWhile Amazon Comprehend can extract general entities and key phrases, Amazon Comprehend for Legal is a specialized version of Comprehend trained on legal text. It is designed to accurately identify and extract specific legal entities (e.g., terms, parties, regulations) and concepts, making it ideal for the legal domain. Comprehend Medical is for healthcare text.", "multi": false, "domain": 1}, {"num": 22, "source": "Exam 2", "text": "Which AWS service provides the underlying machine learning models for natural language understanding (NLU) and automatic speech recognition (ASR) that powers Amazon Alexa?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Translate"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Lex"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Lex is the same deep learning engine that powers Amazon Alexa. It provides the NLU and ASR capabilities to build conversational interfaces for applications using voice and text. Transcribe is primarily for speech-to-text, Polly for text-to-speech, and Translate for language translation.", "multi": false, "domain": 1}, {"num": 23, "source": "Exam 2", "text": "True or False: Amazon SageMaker Studio Labs offers a free, cloud-based environment to learn and experiment with machine learning without requiring an AWS account.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Studio Lab (note: not \"Labs\") provides a free, cloud-based ML development environment that allows anyone to learn and experiment with ML *without needing an AWS account, credit card, or instance configuration*. The question implies a general service, but Studio Lab is the specific offering.", "multi": false, "domain": 1}, {"num": 24, "source": "Exam 2", "text": "Which machine learning task involves predicting a continuous numerical output, such as forecasting stock prices or predicting temperature?", "options": [{"letter": "A", "text": "Regression"}, {"letter": "B", "text": "Clustering"}, {"letter": "C", "text": "Reinforcement Learning"}, {"letter": "D", "text": "Classification"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nRegression is a supervised learning task where the goal is to predict a continuous numerical value. Examples include predicting house prices, stock prices, or temperature. Classification predicts discrete categories, clustering groups similar items, and reinforcement learning involves an agent learning through interaction.", "multi": false, "domain": 1}, {"num": 26, "source": "Exam 2", "text": "A company needs to audit thousands of employee expense receipts to extract merchant names, transaction amounts, and dates. Which AWS AI service is specifically designed for processing such documents?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon Rekognition Custom Labels"}, {"letter": "C", "text": "Amazon Textract AnalyzeExpense"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract AnalyzeExpense is a specialized API within Textract designed to automatically extract data from invoices and receipts. It understands the common fields in these documents (e.g., merchant name, total, date, line items) and extracts them as structured data, going beyond general text or form extraction.", "multi": false, "domain": 1}, {"num": 27, "source": "Exam 2", "text": "Which AWS AI service enables you to programmatically convert documents (e.g., Word, PowerPoint, Excel) into plain text or HTML, which can then be used for indexing or further natural language processing?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon WorkDocs"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend can directly process various document formats (like Word, PDF) to extract text content, which can then be used for NLP tasks. While Textract extracts from images/scanned documents, Comprehend is better suited for processing native digital documents for text content and preparing them for further NLP or indexing.", "multi": false, "domain": 1}, {"num": 28, "source": "Exam 2", "text": "A machine learning team needs to create high-quality labeled training data for a custom object detection model. They want to use a combination of automated labeling and human reviewers from their own organization. Which AWS service supports this workflow?", "options": [{"letter": "A", "text": "Amazon Rekognition Custom Labels"}, {"letter": "B", "text": "Amazon Mechanical Turk"}, {"letter": "C", "text": "AWS Glue DataBrew"}, {"letter": "D", "text": "Amazon SageMaker Ground Truth"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Ground Truth provides data labeling workflows that combine machine learning-based automatic labeling with human review. It supports private workforces (your own employees), public workforces (Mechanical Turk), and vendor workforces. Rekognition Custom Labels trains models but does not manage labeling workflows. Mechanical Turk is just a crowdsourcing platform without the automated labeling pipeline.", "multi": false, "domain": 1}, {"num": 29, "source": "Exam 2", "text": "Which AWS AI service can analyze video streams for inappropriate content and provides a timestamped list of detected segments, allowing for precise moderation?", "options": [{"letter": "A", "text": "Amazon Transcribe"}, {"letter": "B", "text": "Amazon Comprehend"}, {"letter": "C", "text": "Amazon Rekognition Video"}, {"letter": "D", "text": "Amazon Rekognition Image"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition Video provides advanced content moderation for video streams. It not only detects inappropriate content but also provides specific timestamps for when such content appears, enabling precise editing or flagging for human review. Rekognition Image is for static images, Comprehend for text, and Transcribe for audio.", "multi": false, "domain": 1}, {"num": 30, "source": "Exam 2", "text": "In the context of machine learning operations (MLOps), what is the primary benefit of using Amazon SageMaker Model Monitor?", "options": [{"letter": "A", "text": "To manage versions of machine learning models."}, {"letter": "B", "text": "To automatically retrain models when new data becomes available."}, {"letter": "C", "text": "To provide a graphical interface for building ML models without code."}, {"letter": "D", "text": "To continuously monitor deployed ML models for data drift, concept drift, and model quality."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Model Monitor is a crucial MLOps tool. It continuously monitors the quality of machine learning models in production. It automatically detects issues such as data drift (changes in input data characteristics) and concept drift (changes in the relationship between input and target variables), and reports on model quality metrics, alerting you to potential performance degradation.", "multi": false, "domain": 1}, {"num": 31, "source": "Exam 2", "text": "Which AWS service provides the capability to detect the language of a given text, allowing applications to dynamically adapt to different linguistic inputs?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Transcribe"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend offers a `DetectDominantLanguage` API that can accurately identify the primary language of a block of text. This is a fundamental step for many multilingual applications, enabling them to route text to the correct translation service or process it with language-specific NLP models. Translate is for translation, Transcribe for speech-to-text, and Polly for text-to-speech.", "multi": false, "domain": 1}, {"num": 32, "source": "Exam 2", "text": "A developer is building a system that needs to extract specific named entities, such as \"person,\" \"location,\" or \"organization,\" from unstructured text. Which AWS service is best suited for this task?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Textract"}, {"letter": "C", "text": "Amazon Translate"}, {"letter": "D", "text": "Amazon Rekognition"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend's entity recognition capability uses machine learning to identify and categorize specific named entities (like people, places, organizations, dates, quantities) within text. Rekognition is for image/video analysis, Translate is for language translation, and Textract is for optical character recognition and structured data extraction from documents.", "multi": false, "domain": 1}, {"num": 33, "source": "Exam 2", "text": "True or False: Amazon Personalize can only generate recommendations based on explicit user ratings.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Personalize is very flexible and can generate recommendations based on various types of data, including implicit feedback (e.g., clicks, views, purchases without explicit ratings), explicit feedback (ratings, likes), and even item and user metadata. It does not solely rely on explicit ratings.", "multi": false, "domain": 1}, {"num": 35, "source": "Exam 2", "text": "Which AWS service allows you to create custom conversational interfaces (chatbots/voicebots) using a visual editor to define intents, utterances, and slots, simplifying the development process?", "options": [{"letter": "A", "text": "Amazon Transcribe"}, {"letter": "B", "text": "Amazon Lex"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Polly"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Lex provides a visual console that allows developers to design, build, test, and deploy conversational bots. Users can define intents (user goals), sample utterances (phrases users might say), and slots (data to extract) using a drag-and-drop interface, abstracting the complexities of NLU and ASR.", "multi": false, "domain": 1}, {"num": 37, "source": "Exam 2", "text": "A company wants to extract specific fields like \"Patient Name,\" \"Diagnosis,\" and \"Medication\" from unstructured medical notes. Which AWS service is purpose-built for this?", "options": [{"letter": "A", "text": "Amazon Comprehend Medical"}, {"letter": "B", "text": "Amazon Textract"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon HealthLake"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend Medical is specifically designed to understand and extract clinically relevant information from unstructured medical text. It can identify medical conditions, medications, treatments, test results, and protected health information (PHI) with high accuracy, making it ideal for processing medical notes. General Comprehend is not optimized for medical terminology.", "multi": false, "domain": 1}, {"num": 38, "source": "Exam 2", "text": "Which of the following is a common technique used to mitigate \"overfitting\" in machine learning models?", "options": [{"letter": "A", "text": "Reducing the amount of training data."}, {"letter": "B", "text": "Using more features that are highly correlated with each other."}, {"letter": "C", "text": "Increasing the complexity of the model."}, {"letter": "D", "text": "Regularization (e.g., L1/L2 regularization, dropout)."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nRegularization techniques (like L1/L2 regularization or dropout in neural networks) are commonly used to prevent overfitting. They introduce penalties or constraints during the training process, discouraging the model from becoming too complex and fitting the noise in the training data, thereby improving its ability to generalize to unseen data.", "multi": false, "domain": 1}, {"num": 39, "source": "Exam 2", "text": "Which AWS service provides a fully managed, scalable solution for processing large volumes of streaming data, such as website clickstreams, IoT device data, or social media feeds, often used as input for real-time AI analytics?", "options": [{"letter": "A", "text": "Amazon DynamoDB"}, {"letter": "B", "text": "Amazon Kinesis"}, {"letter": "C", "text": "Amazon S3"}, {"letter": "D", "text": "Amazon Redshift"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Kinesis is a family of services designed for processing large streams of data in real-time. Kinesis Data Streams, in particular, can ingest and process terabytes of data per hour from various sources, making it ideal for feeding real-time data to AI services for immediate analysis (e.g., real-time sentiment analysis on social media posts).", "multi": false, "domain": 1}, {"num": 40, "source": "Exam 2", "text": "True or False: Amazon SageMaker provides an integrated development environment (IDE) called SageMaker Studio, which supports common ML frameworks like TensorFlow and PyTorch.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Studio is the primary IDE for ML practitioners within SageMaker. It provides a web-based environment where data scientists and developers can build, train, debug, and deploy ML models. It offers extensive support and optimized containers for popular ML frameworks like TensorFlow, PyTorch, MXNet, and more.", "multi": false, "domain": 1}, {"num": 41, "source": "Exam 2", "text": "Which AWS service would you use to automatically extract text and structured data (forms, tables) from scanned documents and then translate that extracted text into another language?", "options": [{"letter": "A", "text": "Amazon Textract and Amazon Translate"}, {"letter": "B", "text": "Amazon Textract and Amazon Comprehend"}, {"letter": "C", "text": "Amazon Comprehend and Amazon Translate"}, {"letter": "D", "text": "Amazon Rekognition and Amazon Translate"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract is specifically designed for extracting text and structured data from scanned documents. Once Textract extracts the text, Amazon Translate can then be used to translate that extracted text into different languages. This combination handles the two distinct steps of extraction and translation.", "multi": false, "domain": 1}, {"num": 42, "source": "Exam 2", "text": "A company wants to detect brand logos in images uploaded by users. Which AWS service and feature would be most suitable for this task?", "options": [{"letter": "A", "text": "Amazon Rekognition Custom Labels"}, {"letter": "B", "text": "Amazon Textract for logo analysis"}, {"letter": "C", "text": "Amazon Personalize for image recommendations"}, {"letter": "D", "text": "Amazon Comprehend for custom entity recognition"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition Custom Labels allows you to train custom object detection models using your own labeled images. This is ideal for specific use cases like detecting brand logos, products, or defects that are unique to your business. Comprehend is for text, Personalize for recommendations, and Textract for document data extraction.", "multi": false, "domain": 1}, {"num": 44, "source": "Exam 2", "text": "True or False: Amazon Transcribe can only process audio files stored in Amazon S3, and cannot handle real-time audio streams.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Transcribe supports both batch processing of audio files stored in Amazon S3 and real-time transcription of live audio streams. This flexibility allows for transcribing pre-recorded content as well as live conversations, such as those in call centers or live events.", "multi": false, "domain": 1}, {"num": 45, "source": "Exam 2", "text": "Which AWS AI service uses machine learning to deliver highly accurate demand forecasts for business planning, optimizing inventory, and resource allocation?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Forecast"}, {"letter": "C", "text": "Amazon Rekognition"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Forecast is a fully managed service that uses machine learning to deliver highly accurate forecasts. It is specifically designed for time-series forecasting, making it ideal for predicting future demand, optimizing inventory levels, and planning resource allocation.", "multi": false, "domain": 1}, {"num": 46, "source": "Exam 2", "text": "A data scientist wants to experiment with different machine learning models and algorithms in a fully managed Jupyter environment. Which Amazon SageMaker component would they use?", "options": [{"letter": "A", "text": "Amazon SageMaker Batch Transform"}, {"letter": "B", "text": "Amazon SageMaker Ground Truth"}, {"letter": "C", "text": "Amazon SageMaker Canvas"}, {"letter": "D", "text": "Amazon SageMaker Notebook Instances"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Notebook Instances provide a fully managed, web-based Jupyter notebook environment. This allows data scientists to interactively explore data, write code, build, train, and test machine learning models using their preferred frameworks and algorithms without managing servers.", "multi": false, "domain": 1}, {"num": 47, "source": "Exam 2", "text": "Which type of machine learning involves an agent interacting with an environment, performing actions, and receiving rewards or penalties to learn an optimal policy?", "options": [{"letter": "A", "text": "Reinforcement Learning"}, {"letter": "B", "text": "Semi-supervised Learning"}, {"letter": "C", "text": "Unsupervised Learning"}, {"letter": "D", "text": "Supervised Learning"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nReinforcement Learning (RL) is a machine learning paradigm where an agent learns to make decisions by trial and error. It observes the environment, takes an action, and receives a reward or penalty. The goal is to learn a policy that maximizes the cumulative reward over time.", "multi": false, "domain": 1}, {"num": 48, "source": "Exam 2", "text": "A company wants to automatically extract key insights and sentiment from news articles written in multiple languages. Which two AWS services would be most useful? (Choose two)", "options": [{"letter": "A", "text": "Amazon Translate"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Lex"}, {"letter": "D", "text": "Amazon Comprehend"}, {"letter": "E", "text": "Amazon Textract"}], "correct": ["A", "D"], "explanation": "<strong>Explanation:</strong>\nTo analyze multilingual news articles, you would first use Amazon Translate to convert them into a common language (e.g., English) if they are in various languages. Then, Amazon Comprehend would perform natural language processing tasks like sentiment analysis and key phrase extraction on the translated text to extract insights.", "multi": true, "domain": 1}, {"num": 49, "source": "Exam 2", "text": "What is the primary role of \"AWS Lambda\" when used in conjunction with AWS AI services?", "options": [{"letter": "A", "text": "To visualize the performance metrics of AI models."}, {"letter": "B", "text": "To deploy and host trained machine learning models."}, {"letter": "C", "text": "To trigger and orchestrate AI service calls, often in response to events (e.g., S3 object uploads)."}, {"letter": "D", "text": "To store large volumes of data for AI model training."}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAWS Lambda is a serverless compute service commonly used to glue together different AWS services. For AI workloads, Lambda functions are frequently used to trigger AI service operations (e.g., call Amazon Rekognition when an image is uploaded to S3, invoke Amazon Transcribe when an audio file arrives), preprocess data for AI services, or post-process their outputs.", "multi": false, "domain": 1}, {"num": 50, "source": "Exam 2", "text": "Which AWS service provides a comprehensive suite of tools for data scientists and developers to build, train, and deploy machine learning models at scale, including capabilities like data labeling, feature engineering, and model monitoring?", "options": [{"letter": "A", "text": "Amazon Redshift"}, {"letter": "B", "text": "Amazon DynamoDB"}, {"letter": "C", "text": "Amazon SageMaker"}, {"letter": "D", "text": "AWS Glue"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker is an end-to-end machine learning service designed to simplify every step of the ML workflow. It offers a broad range of capabilities, from data labeling (Ground Truth) and feature engineering to model training, deployment, and monitoring (Model Monitor), making it a complete platform for ML practitioners.", "multi": false, "domain": 1}, {"num": 51, "source": "Exam 2", "text": "Which AWS service provides a real-time language translation capability, allowing you to translate text, documents, or even live speech into dozens of languages?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Translate is a neural machine translation service that enables high-quality and fast translation between languages. It supports real-time text translation, batch document translation, and can be integrated with other services for speech translation. Comprehend is for NLP, Transcribe for speech-to-text, and Polly for text-to-speech.", "multi": false, "domain": 1}, {"num": 52, "source": "Exam 2", "text": "A company wants to identify patterns in unlabeled customer reviews to discover natural groupings of feedback without predefined categories. Which machine learning technique is most appropriate?", "options": [{"letter": "A", "text": "Classification"}, {"letter": "B", "text": "Reinforcement Learning"}, {"letter": "C", "text": "Clustering"}, {"letter": "D", "text": "Regression"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nClustering is an unsupervised learning technique used to group data points that are similar to each other. When you have unlabeled data like customer reviews and want to discover inherent patterns or segments without prior categories, clustering algorithms are the suitable choice.", "multi": false, "domain": 1}, {"num": 53, "source": "Exam 2", "text": "Which AWS AI service can convert text into lifelike speech, offering a broad selection of standard voices and more natural-sounding Neural Text-to-Speech (NTTS) voices?", "options": [{"letter": "A", "text": "Amazon Transcribe"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Translate"}, {"letter": "D", "text": "Amazon Lex"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly is the Text-to-Speech (TTS) service that excels at synthesizing human-like speech from text. It provides both standard and NTTS voices, which are generated using deep learning to achieve a very natural and expressive sound.", "multi": false, "domain": 1}, {"num": 54, "source": "Exam 2", "text": "A legal firm needs to digitize thousands of contracts that contain both typed clauses and handwritten signatures and annotations. They need to extract text from all of these elements. Which AWS service handles both printed and handwritten text extraction?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Kendra"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract uses machine learning to extract printed text, handwriting, tables, and other data from scanned documents. It handles both typed and handwritten content accurately. Amazon Comprehend analyzes text meaning but does not perform OCR. Rekognition handles image analysis but is not optimized for document text extraction. Kendra is a search service, not a text extraction service.", "multi": false, "domain": 1}, {"num": 55, "source": "Exam 2", "text": "A retail business wants to build a recommendation system for its website. They have user interaction data (clicks, views, purchases) and item metadata. Which AWS service can help them build a custom recommendation engine without requiring deep ML expertise?", "options": [{"letter": "A", "text": "Amazon Forecast"}, {"letter": "B", "text": "Amazon Personalize"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon SageMaker"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Personalize is a fully managed machine learning service specifically designed for creating personalized recommendation systems. It leverages Amazon.com's recommendation technology and allows developers to build custom recommenders using their own data, often with minimal ML expertise required.", "multi": false, "domain": 1}, {"num": 56, "source": "Exam 2", "text": "Which AWS service offers a fully integrated development environment (IDE) for data scientists and developers to perform every step of the machine learning workflow, from data preparation to model deployment?", "options": [{"letter": "A", "text": "Amazon S3"}, {"letter": "B", "text": "Amazon EC2"}, {"letter": "C", "text": "AWS Lambda"}, {"letter": "D", "text": "Amazon SageMaker Studio"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Studio is the first fully integrated development environment (IDE) for machine learning. It provides a single, web-based visual interface where you can perform all ML development steps, making the ML workflow more efficient and accessible.", "multi": false, "domain": 1}, {"num": 58, "source": "Exam 2", "text": "What is the primary purpose of Amazon SageMaker Ground Truth?", "options": [{"letter": "A", "text": "To monitor machine learning models in production."}, {"letter": "B", "text": "To deploy machine learning models."}, {"letter": "C", "text": "To create high-quality, labeled datasets for machine learning."}, {"letter": "D", "text": "To train machine learning models."}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Ground Truth is a data labeling service. Its main purpose is to help users efficiently build accurate training datasets for their machine learning models by simplifying the process of labeling data (images, video, text, etc.), using either human workforces or machine learning.", "multi": false, "domain": 1}, {"num": 59, "source": "Exam 2", "text": "A security team wants to monitor large volumes of social media posts for mentions of specific threats or critical events in real-time. Which two AWS services would be crucial for this task? (Choose two)", "options": [{"letter": "A", "text": "Amazon Lex (for conversational AI)"}, {"letter": "B", "text": "Amazon Kinesis (for real-time data streaming)"}, {"letter": "C", "text": "Amazon S3 (for storage)"}, {"letter": "D", "text": "Amazon Comprehend (for threat detection/NLP)"}, {"letter": "E", "text": "Amazon Rekognition (for image/video analysis)"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nAmazon Kinesis would be used to ingest and process the streaming social media data in real-time. Once the data is in a stream, Amazon Comprehend's natural language processing capabilities, including custom entity recognition or topic modeling, could be used to identify specific threats or events mentioned in the posts.", "multi": true, "domain": 1}, {"num": 60, "source": "Exam 2", "text": "Which of the following is considered an \"AWS AI Service\" (pre-trained, fully managed, API-driven) rather than an \"AWS ML Service\" (platform for custom ML)?", "options": [{"letter": "A", "text": "Amazon Rekognition"}, {"letter": "B", "text": "AWS DeepRacer"}, {"letter": "C", "text": "Amazon SageMaker"}, {"letter": "D", "text": "Amazon SageMaker Canvas"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition is an AWS AI Service, offering pre-trained, ready-to-use computer vision capabilities via API calls. Amazon SageMaker is a broader ML platform for building custom models. AWS DeepRacer is a service for learning reinforcement learning, and SageMaker Canvas is a no-code tool within the SageMaker family.", "multi": false, "domain": 1}, {"num": 61, "source": "Exam 2", "text": "Which AWS AI service can analyze patient-doctor conversations (audio) to automatically generate summaries and extract key medical information?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Comprehend Medical"}, {"letter": "C", "text": "A combination of Amazon Transcribe Medical and Amazon Comprehend Medical"}, {"letter": "D", "text": "Amazon Transcribe Medical"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nTo analyze audio conversations, you first need to convert the speech to text. Amazon Transcribe Medical is designed for accurate transcription of medical speech. Once the audio is transcribed, Amazon Comprehend Medical can then be used to perform NLP on that text, extracting medical entities, relationships, and potentially summarizing the conversation.", "multi": false, "domain": 1}, {"num": 63, "source": "Exam 2", "text": "Which AWS service provides the capability to detect the sentiment (positive, negative, neutral, mixed) of unstructured text, such as customer reviews, social media posts, or news articles?", "options": [{"letter": "A", "text": "Amazon Rekognition"}, {"letter": "B", "text": "Amazon Translate"}, {"letter": "C", "text": "Amazon Polly"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend is a natural language processing (NLP) service that includes robust sentiment analysis capabilities. It can analyze text and return an overall sentiment score, as well as scores for positive, negative, and neutral sentiments, helping businesses understand opinions expressed in text.", "multi": false, "domain": 1}, {"num": 64, "source": "Exam 2", "text": "A data engineer needs to enable business users to search through millions of internal documents, FAQs, and knowledge articles using natural language questions rather than keyword queries. Which AWS service provides this intelligent enterprise search capability?", "options": [{"letter": "A", "text": "Amazon OpenSearch Service"}, {"letter": "B", "text": "Amazon CloudSearch"}, {"letter": "C", "text": "Amazon Kendra"}, {"letter": "D", "text": "Amazon Athena"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Kendra is an intelligent enterprise search service powered by machine learning that understands natural language queries and returns specific answers from unstructured content. OpenSearch and CloudSearch are traditional search engines that primarily rely on keyword matching. Athena is for querying structured data in S3 using SQL.", "multi": false, "domain": 1}, {"num": 65, "source": "Exam 2", "text": "A manufacturing company wants to detect anomalies in sensor data from their machinery to predict potential equipment failures. Which type of machine learning problem is this?", "options": [{"letter": "A", "text": "Reinforcement Learning"}, {"letter": "B", "text": "Classification"}, {"letter": "C", "text": "Anomaly Detection (Unsupervised Learning)"}, {"letter": "D", "text": "Regression"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAnomaly detection is typically an unsupervised learning task where the goal is to identify rare events or observations that deviate significantly from the majority of the data. In this scenario, the model would learn the normal operating patterns of the machinery and flag any significant deviations as potential anomalies or failures.", "multi": false, "domain": 1}, {"num": 66, "source": "Exam 2", "text": "Which AWS service would you use to build a virtual assistant that interacts with users via text or voice, and can understand user intent to fulfill requests, often integrating with backend systems?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Lex"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Lex is the service for building conversational interfaces (chatbots and voicebots). It uses automatic speech recognition (ASR) to convert speech to text and natural language understanding (NLU) to comprehend user intent, allowing it to fulfill requests by integrating with various backend services.", "multi": false, "domain": 1}, {"num": 67, "source": "Exam 2", "text": "Which AWS AI service can identify prominent faces, objects, and activities in both images and stored video files, and provide labels for them?", "options": [{"letter": "A", "text": "Amazon Rekognition"}, {"letter": "B", "text": "Amazon Comprehend"}, {"letter": "C", "text": "Amazon Forecast"}, {"letter": "D", "text": "Amazon Textract"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition is a machine learning service that provides various computer vision capabilities, including object and scene detection, facial analysis, and activity recognition in both images and videos. It automatically generates labels describing what it sees.", "multi": false, "domain": 1}, {"num": 68, "source": "Exam 2", "text": "A marketing manager with no programming experience wants to build a machine learning model to predict customer churn using historical CRM data. Which AWS tool provides a visual, no-code interface specifically designed for this user persona?", "options": [{"letter": "A", "text": "Amazon SageMaker Studio"}, {"letter": "B", "text": "Amazon SageMaker Autopilot"}, {"letter": "C", "text": "Amazon SageMaker Canvas"}, {"letter": "D", "text": "Amazon QuickSight ML Insights"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Canvas provides a no-code visual interface specifically designed for business users and analysts without ML expertise. SageMaker Studio is an IDE for developers/data scientists. Autopilot automates model building but still requires some technical knowledge to use via the API or Studio. QuickSight ML Insights provides anomaly detection in dashboards but is not a model-building tool.", "multi": false, "domain": 1}, {"num": 69, "source": "Exam 2", "text": "What is the main advantage of using pre-trained AWS AI services (like Rekognition or Comprehend) over building custom models for common tasks like sentiment analysis or object detection?", "options": [{"letter": "A", "text": "Greater flexibility in choosing specific algorithms and architectures."}, {"letter": "B", "text": "Guaranteed higher accuracy for all possible use cases."}, {"letter": "C", "text": "Significantly reduced development time and operational overhead."}, {"letter": "D", "text": "More control over the underlying compute infrastructure."}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nPre-trained AWS AI services are fully managed and ready to use via simple API calls. This drastically cuts down on the time and effort required to develop, train, and deploy ML models from scratch, as AWS handles all the underlying infrastructure, scaling, and model maintenance.", "multi": false, "domain": 1}, {"num": 70, "source": "Exam 2", "text": "Which AWS AI service helps identify and classify entities, key phrases, and sentiments in text data, making it useful for understanding customer feedback or social media trends?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Transcribe"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Personalize"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend is a natural language processing (NLP) service that uses machine learning to uncover insights and relationships in text. Its capabilities include extracting key phrases, identifying entities, and analyzing sentiment, which are all highly valuable for understanding large volumes of text data like customer feedback.", "multi": false, "domain": 1}, {"num": 71, "source": "Exam 2", "text": "Which AWS service provides a fully managed solution for building and deploying machine learning models, offering a broad range of capabilities including data labeling, data prep
