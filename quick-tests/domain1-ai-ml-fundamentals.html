aration, algorithm selection, and model training/deployment?", "options": [{"letter": "A", "text": "AWS Lambda"}, {"letter": "B", "text": "Amazon EC2"}, {"letter": "C", "text": "Amazon SageMaker"}, {"letter": "D", "text": "Amazon DynamoDB"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker is an end-to-end machine learning service that encompasses the entire ML workflow. It offers tools for every stage, from preparing data (e.g., Ground Truth, Data Wrangler) to building, training, and deploying models, making it a comprehensive platform for ML practitioners.", "multi": false, "domain": 1}, {"num": 73, "source": "Exam 2", "text": "A multinational company receives customer support emails in dozens of languages. They need to automatically detect the source language and translate messages to English before routing them to support agents. Which AWS service combination best addresses this need?", "options": [{"letter": "A", "text": "Amazon Comprehend for detection and Amazon Polly for translation"}, {"letter": "B", "text": "Amazon Lex for detection and Amazon Translate for translation"}, {"letter": "C", "text": "Amazon Rekognition for detection and Amazon Comprehend for translation"}, {"letter": "D", "text": "Amazon Translate for both automatic language detection and translation"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Translate provides both automatic source language detection and neural machine translation in a single service. You do not need a separate service for language detection. Amazon Comprehend can detect language but cannot translate. Polly converts text to speech. Lex is for conversational interfaces. Rekognition handles images, not text.", "multi": false, "domain": 1}, {"num": 74, "source": "Exam 2", "text": "A company wants to identify and extract specific items from a large inventory of historical purchase orders in PDF format. The data includes item names, quantities, and prices, and the layout varies between orders. Which AWS AI service is designed to intelligently extract structured data from such documents?", "options": [{"letter": "A", "text": "Amazon Kendra"}, {"letter": "B", "text": "Amazon Textract"}, {"letter": "C", "text": "Amazon Rekognition"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract is a machine learning service that goes beyond simple OCR to automatically extract text, handwriting, and data from scanned documents. It excels at identifying structured data in forms and tables, even when layouts vary, making it ideal for processing purchase orders.", "multi": false, "domain": 1}, {"num": 75, "source": "Exam 2", "text": "Which AWS service allows you to create custom-trained computer vision models for specific object detection or image classification tasks, using a small set of labeled images, without requiring deep ML expertise?", "options": [{"letter": "A", "text": "Amazon SageMaker Canvas"}, {"letter": "B", "text": "Amazon Comprehend Custom Classification"}, {"letter": "C", "text": "AWS DeepLens"}, {"letter": "D", "text": "Amazon Rekognition Custom Labels"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition Custom Labels enables you to train custom models to detect objects and scenes in images unique to your business. It significantly simplifies the process by requiring only a small number of labeled images and abstracting away the underlying machine learning complexities.", "multi": false, "domain": 1}, {"num": 76, "source": "Exam 2", "text": "What is the primary role of an \"Intent\" in Amazon Lex?", "options": [{"letter": "A", "text": "To collect specific data from the user."}, {"letter": "B", "text": "To generate the bot's response to the user."}, {"letter": "C", "text": "To represent the goal or desired action the user wants to achieve."}, {"letter": "D", "text": "To define the specific phrases users might say."}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nIn Amazon Lex, an \"Intent\" is the core concept that represents the user's goal or purpose when interacting with the bot (e.g., \"BookFlight,\" \"OrderPizza\"). Intents are associated with \"utterances\" (sample phrases) that trigger them and \"slots\" (data points) that need to be collected to fulfill the intent.", "multi": false, "domain": 1}, {"num": 77, "source": "Exam 2", "text": "Which type of machine learning problem involves categorizing data into one of several predefined classes, such as identifying spam emails or diagnosing diseases?", "options": [{"letter": "A", "text": "Clustering"}, {"letter": "B", "text": "Classification"}, {"letter": "C", "text": "Anomaly Detection"}, {"letter": "D", "text": "Regression"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nClassification is a supervised learning task where the model learns to assign an input data point to one of a finite set of discrete categories or classes. Examples include classifying emails as spam or not spam, or categorizing images (e.g., cat, dog, bird).", "multi": false, "domain": 1}, {"num": 78, "source": "Exam 2", "text": "Which AWS service would you use to convert unstructured text, like customer reviews or social media posts, into a structured format by extracting entities, key phrases, and detecting sentiment?", "options": [{"letter": "A", "text": "Amazon Translate"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Textract"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend is a natural language processing (NLP) service that specializes in analyzing unstructured text. It can automatically identify and extract key information (entities, key phrases) and analyze the emotional tone (sentiment), transforming raw text into valuable structured insights.", "multi": false, "domain": 1}, {"num": 79, "source": "Exam 2", "text": "A data science team wants to organize their machine learning experiments, track hyperparameters across training runs, compare model metrics, and reproduce previous results. Which SageMaker capability provides this integrated experiment management?", "options": [{"letter": "A", "text": "SageMaker Model Registry"}, {"letter": "B", "text": "SageMaker Pipelines"}, {"letter": "C", "text": "SageMaker Experiments"}, {"letter": "D", "text": "SageMaker Debugger"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSageMaker Experiments allows you to organize, track, compare, and evaluate machine learning experiments and model versions. It captures inputs, parameters, configurations, and results of training iterations. Model Registry stores and manages model versions for deployment. Pipelines orchestrates ML workflows. Debugger identifies training issues in real time.", "multi": false, "domain": 1}, {"num": 80, "source": "Exam 2", "text": "Which AWS service provides the capability to detect objects, scenes, and activities in real-time video streams, making it suitable for security, monitoring, or public safety applications?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Rekognition Image"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Rekognition Video"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition Video is specifically designed for analyzing video streams (live or stored). It can detect objects, scenes, activities, and faces in real-time, providing powerful computer vision capabilities for various video analytics applications. Rekognition Image is for static images, Transcribe for speech, and Comprehend for text.", "multi": false, "domain": 1}, {"num": 81, "source": "Exam 2", "text": "Which AWS service provides a fully managed machine learning service that enables developers to easily build, train, and deploy custom fraud detection models?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Fraud Detector"}, {"letter": "C", "text": "Amazon Rekognition"}, {"letter": "D", "text": "Amazon Kendra"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Fraud Detector is a specialized, fully managed service that leverages machine learning and over 20 years of fraud detection expertise from Amazon.com to help you identify potentially fraudulent online activities. It provides a straightforward way to build, train, and deploy custom fraud detection models.", "multi": false, "domain": 1}, {"num": 83, "source": "Exam 2", "text": "True or False: Amazon Polly can generate speech in many different languages and voices, but it does not support generating speech with emotions or expressive tones.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly, particularly with its Neural Text-to-Speech (NTTS) voices, supports expressive speech synthesis, allowing you to generate speech with various emotional and conversational styles (e.g., joyful, sad, serious, excited, conversational) to make the output sound more natural and engaging.", "multi": false, "domain": 1}, {"num": 84, "source": "Exam 2", "text": "Which AWS AI service allows users to automatically extract detailed information from financial documents like invoices and receipts, including line items and totals, without defining templates?", "options": [{"letter": "A", "text": "Amazon Rekognition Custom Labels"}, {"letter": "B", "text": "Amazon Comprehend"}, {"letter": "C", "text": "Amazon Textract AnalyzeDocument"}, {"letter": "D", "text": "Amazon Textract AnalyzeExpense"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract AnalyzeExpense is a specialized API within Textract specifically designed to understand the structure and content of invoices and receipts. It automatically extracts key data fields, line items, and totals without the need for pre-defined templates or manual configuration, making it highly efficient for financial document processing.", "multi": false, "domain": 1}, {"num": 85, "source": "Exam 2", "text": "Which AWS service is designed to help customers integrate AI into their contact centers, providing capabilities like real-time call transcription, sentiment analysis, and agent assistance?", "options": [{"letter": "A", "text": "Amazon Connect Contact Lens"}, {"letter": "B", "text": "Amazon Lex"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Polly"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Connect Contact Lens is a feature of Amazon Connect (AWS's cloud contact center service) that uses machine learning to provide advanced analytics for customer conversations. It offers capabilities like real-time transcription, sentiment analysis, identification of call drivers, and agent performance insights specifically within a contact center context.", "multi": false, "domain": 1}, {"num": 88, "source": "Exam 2", "text": "A company wants to build a new recommendation engine for an existing e-commerce platform. They have historical user interaction data (clicks, views, purchases). Which AWS service can help them achieve this quickly without building complex ML models from scratch?", "options": [{"letter": "A", "text": "Amazon Kendra"}, {"letter": "B", "text": "Amazon Personalize"}, {"letter": "C", "text": "Amazon Forecast"}, {"letter": "D", "text": "Amazon SageMaker"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Personalize is a fully managed machine learning service designed specifically for creating personalized recommendation systems. It allows businesses to leverage their existing user interaction data to build custom recommenders quickly and effectively, without requiring deep ML expertise.", "multi": false, "domain": 1}, {"num": 89, "source": "Exam 2", "text": "Which AWS service would you use to translate live audio streams (e.g., a speech, a meeting) into text in a different language in real-time?", "options": [{"letter": "A", "text": "Amazon Lex and Amazon Translate"}, {"letter": "B", "text": "Amazon Transcribe and Amazon Translate"}, {"letter": "C", "text": "Amazon Transcribe and Amazon Polly"}, {"letter": "D", "text": "Amazon Polly and Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nTo translate live audio streams, you would first use Amazon Transcribe to convert the spoken words into text in the source language. Then, Amazon Translate would take that transcribed text and translate it into the desired target language, providing a real-time translation experience.", "multi": false, "domain": 1}, {"num": 93, "source": "Exam 2", "text": "An enterprise search solution needs to index content from SharePoint, Confluence, Amazon S3, and several relational databases to provide a unified search experience for employees. Which AWS service natively supports connectors to these diverse data sources?", "options": [{"letter": "A", "text": "Amazon OpenSearch Service"}, {"letter": "B", "text": "Amazon CloudSearch"}, {"letter": "C", "text": "Amazon Kendra"}, {"letter": "D", "text": "AWS Glue"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Kendra provides native data source connectors for a wide variety of enterprise repositories including S3, SharePoint, Confluence, Salesforce, ServiceNow, databases, and more. OpenSearch and CloudSearch require custom ingestion pipelines. AWS Glue is an ETL service for data transformation, not enterprise search.", "multi": false, "domain": 1}, {"num": 94, "source": "Exam 2", "text": "Which machine learning paradigm involves training a model to find hidden patterns or structures in unlabeled data, such as segmenting customers or detecting anomalies?", "options": [{"letter": "A", "text": "Supervised Learning"}, {"letter": "B", "text": "Transfer Learning"}, {"letter": "C", "text": "Reinforcement Learning"}, {"letter": "D", "text": "Unsupervised Learning"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nUnsupervised learning deals with unlabeled datasets. Its goal is to discover underlying patterns, groupings (clustering), or anomalies without any explicit output variables provided during training. Customer segmentation and anomaly detection are classic examples.", "multi": false, "domain": 1}, {"num": 95, "source": "Exam 2", "text": "A company wants to identify the dominant emotion (e.g., happy, sad, angry) in faces detected in user-uploaded images. Which AWS service provides this capability?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition offers advanced facial analysis capabilities that include detecting emotions in faces. It can identify emotions like happy, sad, angry, surprised, calm, confused, or disgusted, along with confidence scores, within images and videos.", "multi": false, "domain": 1}, {"num": 96, "source": "Exam 2", "text": "Which AWS service is specifically designed to provide personalized content recommendations (e.g., movies, music, news articles) based on user behavior and item metadata?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Forecast"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Personalize is a fully managed machine learning service purpose-built for creating real-time personalized recommendation systems. It allows developers to build custom recommendation engines leveraging Amazon.com's technology, using user interaction data and item/user metadata.", "multi": false, "domain": 1}, {"num": 98, "source": "Exam 2", "text": "True or False: Amazon SageMaker Model Monitor can only detect data drift, but not concept drift or model quality issues.", "options": [{"letter": "A", "text": "True"}, {"letter": "B", "text": "False"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Model Monitor is a comprehensive tool that continuously monitors deployed ML models for various types of performance degradation. This includes data drift (changes in input data characteristics), concept drift (changes in the relationship between input and target variables), and overall model quality metrics.", "multi": false, "domain": 1}, {"num": 99, "source": "Exam 2", "text": "A journalist needs to transcribe a long audio interview to text quickly and accurately. Which AWS service should they use?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Translate"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Lex"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Transcribe is an automatic speech recognition (ASR) service that converts audio into accurate and readable text. It is ideal for transcribing interviews, meetings, and other audio content, and can handle both short and long audio files.", "multi": false, "domain": 1}, {"num": 100, "source": "Exam 2", "text": "What is the primary benefit of using a \"managed service\" for AI (e.g., Amazon Comprehend, Rekognition) compared to deploying an open-source ML model on an EC2 instance?", "options": [{"letter": "A", "text": "It is always a cheaper option for very high-volume, continuous processing."}, {"letter": "B", "text": "It offers more control over the operating system and underlying hardware."}, {"letter": "C", "text": "It allows for custom modification of the core ML algorithm."}, {"letter": "D", "text": "It reduces operational overhead, maintenance, and scaling complexity."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nManaged AWS AI services abstract away the infrastructure management. AWS handles the provisioning, scaling, patching, and maintenance of the underlying ML models and infrastructure. This significantly reduces the operational burden on developers, allowing them to focus on application development rather than managing servers, which is not the case when deploying open-source models on EC2.", "multi": false, "domain": 1}, {"num": 101, "source": "Exam 2", "text": "Which AWS AI service provides a fully managed solution for adding speech-to-text capabilities to applications, including features like custom vocabulary and speaker diarization?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Translate"}, {"letter": "C", "text": "Amazon Lex"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Transcribe is the dedicated automatic speech recognition (ASR) service. It not only converts speech to text but also offers advanced features such as custom vocabularies (to improve accuracy for domain-specific terms) and speaker diarization (to identify different speakers in an audio file).", "multi": false, "domain": 1}, {"num": 102, "source": "Exam 2", "text": "A data scientist is preparing a dataset for a supervised machine learning model. What is the process of cleaning, transforming, and structuring raw data into a format suitable for model training called?", "options": [{"letter": "A", "text": "Data Preprocessing"}, {"letter": "B", "text": "Data Visualization"}, {"letter": "C", "text": "Hyperparameter Tuning"}, {"letter": "D", "text": "Model Deployment"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nData preprocessing is a crucial step in the machine learning workflow. It involves a series of operations like cleaning missing values, handling outliers, normalizing numerical features, encoding categorical variables, and transforming data to make it suitable and effective for training machine learning models.", "multi": false, "domain": 1}, {"num": 104, "source": "Exam 2", "text": "Which AWS service provides the capability to detect key phrases, entities, and sentiment in text, and can be used for custom classification of documents based on your own labels?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Personalize"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend is a natural language processing (NLP) service that offers capabilities like key phrase extraction, entity recognition, and sentiment analysis. Crucially, it also supports Custom Classification, allowing you to train models to categorize text into your own defined categories.", "multi": false, "domain": 1}, {"num": 106, "source": "Exam 2", "text": "A company wants to provide voice control for their mobile application. They need a service that can convert spoken commands into text and then understand the user's intent to trigger specific actions. Which AWS service would handle the Automatic Speech Recognition (ASR) and Natural Language Understanding (NLU) parts?", "options": [{"letter": "A", "text": "Amazon Transcribe and Amazon Comprehend"}, {"letter": "B", "text": "Amazon Lex"}, {"letter": "C", "text": "Amazon Polly and Amazon Translate"}, {"letter": "D", "text": "Amazon Transcribe and Amazon Lex"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Lex is a service for building conversational interfaces, and it provides both ASR (Automatic Speech Recognition) to convert speech to text and NLU (Natural Language Understanding) to comprehend the intent of the text. It's designed as an all-in-one service for building voice and text bots. While Transcribe and Comprehend could be chained, Lex provides a more integrated solution for this specific use case.", "multi": false, "domain": 1}, {"num": 107, "source": "Exam 2", "text": "Which AWS AI service can convert text into lifelike speech in various languages, offering a wide range of voices including male, female, and child voices?", "options": [{"letter": "A", "text": "Amazon Lex"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Translate"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly is a text-to-speech (TTS) service that offers a diverse selection of voices across multiple languages, including different genders and even child voices, to suit various application needs.", "multi": false, "domain": 1}, {"num": 108, "source": "Exam 2", "text": "A financial services company needs their internal search system to understand complex analyst queries like \"What were the key factors behind Q3 revenue decline?\" and return specific passages from earnings reports rather than just document links. Which AWS service provides this natural language understanding for search?", "options": [{"letter": "A", "text": "Amazon Athena"}, {"letter": "B", "text": "Amazon OpenSearch Service"}, {"letter": "C", "text": "Amazon Kendra"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Kendra uses machine learning to understand the intent and context of natural language queries and returns specific, relevant passages (not just documents) as answers. This semantic search capability goes beyond keyword matching. Athena queries structured data with SQL. OpenSearch is primarily keyword-based. Comprehend analyzes text but does not provide search functionality.", "multi": false, "domain": 1}, {"num": 109, "source": "Exam 2", "text": "Which AWS service is commonly used as a highly durable and scalable storage solution for machine learning model artifacts (e.g., trained models, checkpoints) generated by Amazon SageMaker?", "options": [{"letter": "A", "text": "Amazon RDS"}, {"letter": "B", "text": "Amazon EC2"}, {"letter": "C", "text": "Amazon S3"}, {"letter": "D", "text": "Amazon EBS"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon S3 (Simple Storage Service) is the go-to service for storing machine learning model artifacts. Its high durability, scalability, and integration with SageMaker make it ideal for storing trained models, datasets, and other assets securely and reliably.", "multi": false, "domain": 1}, {"num": 110, "source": "Exam 2", "text": "What is the concept of \"Data Drift\" in the context of machine learning operations (MLOps)?", "options": [{"letter": "A", "text": "Changes in the underlying relationship between input features and the target variable."}, {"letter": "B", "text": "Changes in the distribution of the input data used by a deployed model over time."}, {"letter": "C", "text": "The process of migrating data from one storage system to another."}, {"letter": "D", "text": "Changes in the model's architecture or algorithms during retraining."}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nData drift occurs when the statistical properties of the input data (features) to a deployed machine learning model change over time. This can cause the model's performance to degrade, as it was trained on a different data distribution. Monitoring for data drift is a key aspect of MLOps. Concept drift (A) is a related but distinct issue.", "multi": false, "domain": 1}, {"num": 111, "source": "Exam 2", "text": "Which AWS AI service provides a fully managed solution to generate personalized recommendations for users, leveraging machine learning, and integrates with existing applications via APIs?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Forecast"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Personalize is a specialized, fully managed ML service for creating personalized recommendation systems. It allows you to generate recommendations based on user interactions and item metadata, which can then be integrated into your applications through APIs.", "multi": false, "domain": 1}, {"num": 113, "source": "Exam 2", "text": "An insurance company processes thousands of claims documents daily that contain tables with complex layouts including merged cells, nested headers, and multi-page tables. They need to extract structured data without creating templates for each document type. Which AWS service handles this automatically?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "AWS Glue DataBrew"}, {"letter": "D", "text": "Amazon Textract"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract uses deep learning to automatically extract text, tables, and forms from documents without requiring predefined templates. It handles complex table layouts including merged cells and nested structures. Comprehend performs NLP on extracted text. Rekognition handles images but is not optimized for document processing. Glue DataBrew is for data transformation, not document extraction.", "multi": false, "domain": 1}, {"num": 114, "source": "Exam 2", "text": "Which AWS service provides an automatic speech recognition (ASR) capability for converting spoken language into text, specifically optimized for healthcare and medical domains?", "options": [{"letter": "A", "text": "Amazon Transcribe Medical"}, {"letter": "B", "text": "Amazon Comprehend Medical"}, {"letter": "C", "text": "Amazon Polly"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Transcribe Medical is a specialized service for transcribing medical terminology, drug names, and procedures with high accuracy. It's built for healthcare-specific use cases, unlike the general Amazon Transcribe service.", "multi": false, "domain": 1}, {"num": 115, "source": "Exam 2", "text": "A company wants to quickly train an image classification model without deep ML expertise to detect specific product defects in their manufacturing line. They have a dataset of defect images. Which AWS service would be most suitable?", "options": [{"letter": "A", "text": "AWS DeepLens"}, {"letter": "B", "text": "Amazon SageMaker Studio"}, {"letter": "C", "text": "Amazon SageMaker Canvas"}, {"letter": "D", "text": "Amazon Rekognition Custom Labels"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition Custom Labels is ideal for this scenario. It allows you to train a custom computer vision model for object detection or image classification (like product defects) using your own labeled images, without requiring code or deep machine learning knowledge. Canvas is for general no-code ML, but Custom Labels is specifically for vision.", "multi": false, "domain": 1}, {"num": 116, "source": "Exam 2", "text": "Which AWS AI service uses deep learning to generate human-like speech from text, providing high-quality audio output for applications like virtual assistants, e-learning content, and audiobooks?", "options": [{"letter": "A", "text": "Amazon Translate"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Lex"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly is the Text-to-Speech (TTS) service that synthesizes lifelike speech from text. It's designed to provide natural-sounding voices, including Neural TTS options, for a wide range of applications requiring high-quality audio output.", "multi": false, "domain": 1}, {"num": 118, "source": "Exam 2", "text": "Which AWS AI service allows you to perform real-time optical character recognition (OCR) on image files and PDFs, extracting text, forms, and tables as structured data?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon Kendra"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Rekognition"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract is specifically designed for OCR tasks, going beyond simple text extraction to identify and extract data from forms and tables in a structured format. It works with both image files and PDF documents, making it versatile for various document processing needs.", "multi": false, "domain": 1}, {"num": 119, "source": "Exam 2", "text": "What is the primary purpose of a \"Lambda function\" when integrated with Amazon Lex in a conversational AI application?", "options": [{"letter": "A", "text": "To convert the user's speech into text for Lex processing."}, {"letter": "B", "text": "To handle the fulfillment of user intents by executing business logic or integrating with backend systems."}, {"letter": "C", "text": "To store the conversational history between the user and the bot."}, {"letter": "D", "text": "To define the natural language understanding (NLU) model for the bot."}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAWS Lambda functions are commonly used as fulfillment handlers for Amazon Lex bots. Once Lex identifies a user's intent and gathers necessary slots, it can invoke a Lambda function. This function then executes custom business logic, makes API calls to other services, or interacts with databases to fulfill the user's request.", "multi": false, "domain": 1}, {"num": 120, "source": "Exam 2", "text": "Which AWS service provides a fully managed, intelligent search solution that uses natural language processing (NLP) to allow users to ask questions and find relevant information across various enterprise data sources?", "options": [{"letter": "A", "text": "Amazon Kendra"}, {"letter": "B", "text": "Amazon Elasticsearch Service (OpenSearch Service)"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Kendra is purpose-built for intelligent enterprise search. It differentiates itself by using NLP to understand natural language queries and provide precise answers and relevant documents from an organization's internal data sources, rather than just keyword matching. Comprehend is for general NLP, Textract for OCR, and OpenSearch Service is for raw search and analytics.", "multi": false, "domain": 1}];
const TOTAL = QUESTIONS.length;
let answeredCount = 0;
let correctCount  = 0;

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function buildQuiz() {
  const container = document.getElementById("questions");
  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = "question-card";
    card.id = "q" + idx;
    const multiBadge = q.multi ? "<span class=\"multi-badge\">Select 2</span>" : "";
    const srcBadge   = "<span class=\"q-source\">" + escHtml(q.source) + "</span>";
    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q${q.num}</span>
        ${srcBadge}
        <span class="q-text">${escHtml(q.text)}${multiBadge}</span>
      </div>
      <div class="options" id="opts_${idx}">
        ${q.options.map(o =>
          "<label class=\"option-label\" id=\"lbl_" + idx + "_" + o.letter + "\">" +
          "<input type=\"" + (q.multi ? "checkbox" : "radio") + "\" name=\"q" + idx + "\" value=\"" + o.letter + "\" />" +
          "<span class=\"letter\">" + o.letter + ")</span>" +
          "<span>" + escHtml(o.text) + "</span>" +
          "</label>"
        ).join("")}
      </div>
      <button class="submit-btn" onclick="submitAnswer(${idx})">Check Answer</button>
      <div id="badge_${idx}" style="margin-top:12px;"></div>
      <details class="explanation" id="exp_${idx}">
        <summary>&#x1F4A1; Explanation</summary>
        <div class="explanation-body">${q.explanation}</div>
      </details>
    `;
    container.appendChild(card);
  });
}

function getSelected(idx) {
  return Array.from(document.querySelectorAll("[name=\"q" + idx + "\"]:checked")).map(i => i.value);
}

function submitAnswer(idx) {
  const q = QUESTIONS[idx];
  const selected = getSelected(idx);
  if (!selected.length) return;

  document.querySelectorAll("[name=\"q" + idx + "\"]").forEach(i => i.disabled = true);
  document.querySelector("#q" + idx + " .submit-btn").disabled = true;

  q.options.forEach(o => {
    const lbl = document.getElementById("lbl_" + idx + "_" + o.letter);
    lbl.classList.add("disabled");
    if (q.correct.includes(o.letter)) lbl.classList.add("correct");
    else if (selected.includes(o.letter)) lbl.classList.add("wrong");
  });

  const correctSet  = new Set(q.correct);
  const selectedSet = new Set(selected);
  let result;
  if (q.multi) {
    const allCorrect = q.correct.every(l => selectedSet.has(l)) && selected.every(l => correctSet.has(l));
    result = allCorrect ? "correct" : (q.correct.some(l => selectedSet.has(l)) ? "partial" : "wrong");
  } else {
    result = (selected.length === 1 && selected[0] === q.correct[0]) ? "correct" : "wrong";
  }

  const badge = document.getElementById("badge_" + idx);
  const corrStr = q.correct.join(", ");
  if (result === "correct") {
    badge.innerHTML = "<span class=\"result-badge correct\">&#x2713; Correct!</span>";
    document.getElementById("q" + idx).classList.add("answered-correct");
    correctCount++;
  } else if (result === "partial") {
    badge.innerHTML = "<span class=\"result-badge partial\">Partially Correct — full answer: " + corrStr + "</span>";
    document.getElementById("q" + idx).classList.add("answered-partial");
  } else {
    badge.innerHTML = "<span class=\"result-badge wrong\">&#x2717; Incorrect — correct: " + corrStr + "</span>";
    document.getElementById("q" + idx).classList.add("answered-wrong");
  }

  document.getElementById("exp_" + idx).setAttribute("open", "");
  answeredCount++;
  updateProgress();
  if (answeredCount === TOTAL) showScore();
}

function updateProgress() {
  document.getElementById("progress-bar").style.width = (answeredCount / TOTAL * 100) + "%";
  document.getElementById("progress-text").textContent = answeredCount + " / " + TOTAL + " answered";
}

function showScore() {
  const panel = document.getElementById("score-panel");
  panel.style.display = "block";
  document.getElementById("score-correct").textContent = correctCount;
  const pct = Math.round(correctCount / TOTAL * 100);
  document.getElementById("score-pct").textContent = "out of " + TOTAL + " questions (" + pct + "%)";
  let grade;
  if (pct >= 90)      grade = "Excellent — strong domain mastery!";
  else if (pct >= 75) grade = "Good — review your misses and try again.";
  else if (pct >= 60) grade = "Needs work — spend more time on this domain.";
  else                grade = "Focus here — this domain needs significant study.";
  document.getElementById("score-grade").textContent = grade;
  panel.scrollIntoView({ behavior: "smooth" });
}

buildQuiz();
updateProgress();
</script>
</body>
</html>
