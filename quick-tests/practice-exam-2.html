<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AWS AI Practitioner — Practice Test 2</title>
<style>
  :root {
    --aws-orange: #FF9900;
    --aws-navy:   #232F3E;
    --aws-blue:   #1A73E8;
    --correct-bg: #d4edda;
    --correct-border: #28a745;
    --wrong-bg:   #f8d7da;
    --wrong-border: #dc3545;
    --neutral-bg: #f4f6f8;
    --card-bg:    #ffffff;
    --radius:     10px;
    --shadow:     0 2px 8px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--neutral-bg);
    color: #222;
    line-height: 1.6;
  }
  header {
    background: var(--aws-navy);
    color: #fff;
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    flex: 1;
  }
  header h1 span {
    color: var(--aws-orange);
  }
  #progress-bar-wrap {
    width: 100%;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    height: 6px;
    margin-top: 8px;
  }
  #progress-bar {
    height: 6px;
    border-radius: 4px;
    background: var(--aws-orange);
    transition: width 0.3s;
    width: 0%;
  }
  #progress-text {
    font-size: 0.82rem;
    color: #ccc;
    white-space: nowrap;
  }
  main {
    max-width: 860px;
    margin: 28px auto;
    padding: 0 16px 60px;
  }
  .question-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 28px;
    border-left: 5px solid #ddd;
    transition: border-color 0.3s;
  }
  .question-card.answered-correct  { border-left-color: var(--correct-border); }
  .question-card.answered-wrong    { border-left-color: var(--wrong-border); }
  .question-card.answered-partial  { border-left-color: var(--aws-orange); }
  .q-header {
    display: flex;
    gap: 12px;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .q-num {
    font-size: 0.75rem;
    font-weight: 700;
    background: var(--aws-navy);
    color: #fff;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .q-text {
    font-size: 0.97rem;
    font-weight: 600;
    line-height: 1.5;
  }
  .multi-badge {
    font-size: 0.72rem;
    background: var(--aws-orange);
    color: #fff;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
    white-space: nowrap;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .option-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    font-size: 0.92rem;
  }
  .option-label:hover { border-color: var(--aws-orange); background: #fff8ec; }
  .option-label input { flex-shrink: 0; margin-top: 3px; accent-color: var(--aws-orange); }
  .option-label .letter {
    font-weight: 700;
    color: var(--aws-navy);
    flex-shrink: 0;
    min-width: 22px;
  }
  /* Feedback states applied after submit */
  .option-label.correct {
    border-color: var(--correct-border);
    background: var(--correct-bg);
  }
  .option-label.wrong {
    border-color: var(--wrong-border);
    background: var(--wrong-bg);
  }
  .option-label.disabled { cursor: default; pointer-events: none; }
  .option-label.correct::after { content: " ✓"; color: var(--correct-border); font-weight: 700; }
  .option-label.wrong::after   { content: " ✗"; color: var(--wrong-border); font-weight: 700; }
  .submit-btn {
    display: inline-block;
    padding: 9px 22px;
    background: var(--aws-navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .submit-btn:hover { background: var(--aws-orange); }
  .submit-btn:disabled { background: #aaa; cursor: default; }
  /* Explanation details */
  .explanation {
    margin-top: 16px;
    border-radius: 8px;
    border: 1px solid #d0d0d0;
    overflow: hidden;
  }
  .explanation summary {
    list-style: none;
    padding: 10px 16px;
    background: #f0f0f0;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  .explanation summary::-webkit-details-marker { display: none; }
  .explanation summary::before {
    content: "▶";
    font-size: 0.7rem;
    transition: transform 0.2s;
  }
  .explanation[open] summary::before { transform: rotate(90deg); }
  .explanation-body {
    padding: 14px 16px;
    font-size: 0.9rem;
    line-height: 1.65;
    background: #fafafa;
    border-top: 1px solid #d0d0d0;
  }
  .result-badge {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .result-badge.correct { background: var(--correct-bg); color: var(--correct-border); border: 1px solid var(--correct-border); }
  .result-badge.wrong   { background: var(--wrong-bg); color: var(--wrong-border); border: 1px solid var(--wrong-border); }
  .result-badge.partial { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
  /* Score panel */
  #score-panel {
    display: none;
    background: var(--aws-navy);
    color: #fff;
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    margin-bottom: 40px;
    box-shadow: var(--shadow);
  }
  #score-panel h2 { font-size: 1.5rem; margin-bottom: 8px; }
  #score-panel .score-num { font-size: 3rem; font-weight: 900; color: var(--aws-orange); }
  #score-panel .score-pct { font-size: 1.1rem; color: #ccc; margin-bottom: 16px; }
  #score-panel .score-grade { font-size: 1rem; }
  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .question-card { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div style="flex:1">
    <h1>☁️ <span>Practice Test 2</span></h1>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  </div>
  <div id="progress-text">0 / 120 answered</div>
</header>
<main>
  <div id="score-panel">
    <h2>Quiz Complete!</h2>
    <div class="score-num" id="score-correct">0</div>
    <div class="score-pct" id="score-pct">out of 120 questions</div>
    <div class="score-grade" id="score-grade"></div>
  </div>
  <div id="questions"></div>
</main>
<script>
const QUESTIONS = [{"num": 1, "text": "Which AWS AI service can you use to analyze medical images (e.g., X-rays, CT scans) to detect anomalies or specific medical conditions?", "options": [{"letter": "A", "text": "Amazon Comprehend Medical"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Rekognition Medical"}, {"letter": "D", "text": "Amazon HealthLake"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nWhile Amazon Rekognition handles general image analysis, Amazon Rekognition Medical is a specialized service designed to detect anomalies in medical images, such as X-rays, CT scans, and ultrasounds, using machine learning. Amazon Comprehend Medical is for text analysis, and HealthLake is a HIPAA-eligible service for storing and analyzing health data, not image analysis directly.", "multi": false}, {"num": 2, "text": "You want to build a virtual contact center agent that can understand customer inquiries and respond with natural language. Which AWS service would provide the text-to-speech capability for the agent's responses?", "options": [{"letter": "A", "text": "Amazon Lex"}, {"letter": "B", "text": "Amazon Transcribe"}, {"letter": "C", "text": "Amazon Translate"}, {"letter": "D", "text": "Amazon Polly"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly is the text-to-speech (TTS) service that converts written text into lifelike speech. In a virtual contact center agent scenario, after Amazon Lex processes the customer's input and determines a response, Amazon Polly would be used to synthesize that response into spoken words. Amazon Transcribe is speech-to-text, Lex is for NLU/ASR, and Translate is for language translation.", "multi": false}, {"num": 3, "text": "Which AWS service provides intelligent search capabilities across your enterprise data, allowing natural language queries and finding answers within documents, often leveraging connectors to various data sources?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon Elasticsearch Service (OpenSearch Service)"}, {"letter": "C", "text": "Amazon Kendra"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Kendra is an intelligent enterprise search service powered by machine learning. It excels at understanding natural language queries and delivering precise answers from a wide range of content repositories, including S3, SharePoint, Confluence, and more, using built-in connectors. Comprehend is for text NLP, Textract for document data extraction, and Elasticsearch Service is for raw search and analytics, but not specifically \"intelligent\" answer retrieval out-of-the-box in the same way Kendra is.", "multi": false}, {"num": 4, "text": "True or False: Amazon SageMaker Feature Store is used to store and retrieve machine learning features for both training and inference consistently.", "options": [{"letter": "A", "text": "True"}, {"letter": "B", "text": "False"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Feature Store is a purpose-built repository that makes it easy to store, update, retrieve, and share machine learning (ML) features. It provides a unified store for features, ensuring consistency between features used for training and those used for real-time inference, which helps prevent training-serving skew.", "multi": false}, {"num": 5, "text": "A machine learning model has very high accuracy on its training data but performs poorly on new, unseen data. What common problem does this indicate?", "options": [{"letter": "A", "text": "Overfitting"}, {"letter": "B", "text": "Data leakage"}, {"letter": "C", "text": "Underfitting"}, {"letter": "D", "text": "Good generalization"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nOverfitting occurs when a model learns the training data too well, memorizing noise and specific patterns rather than generalizing to underlying relationships. This leads to high performance on training data but poor performance on new, unseen data. Underfitting is the opposite (poor performance on both), and good generalization is the desired outcome.", "multi": false}, {"num": 6, "text": "Which AWS service is specifically designed to detect and identify \"personally identifiable information\" (PII) like names, addresses, and account numbers within blocks of text, often used for data anonymization or compliance?", "options": [{"letter": "A", "text": "Amazon Macie"}, {"letter": "B", "text": "Amazon Comprehend"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend includes a specialized PII detection API that can identify and categorize various types of sensitive information (PII) within unstructured text. This feature is crucial for compliance with privacy regulations and for redacting or anonymizing data. Amazon Macie is for discovering and protecting sensitive data in S3 buckets, but Comprehend handles PII detection within text content itself.", "multi": false}, {"num": 7, "text": "You need to analyze video footage to identify specific individuals or track their movements over time. Which capability of Amazon Rekognition would you leverage?", "options": [{"letter": "A", "text": "Face Recognition and Tracking"}, {"letter": "B", "text": "Custom Labels"}, {"letter": "C", "text": "Object and Scene Detection"}, {"letter": "D", "text": "Content Moderation"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition offers advanced capabilities for face recognition (identifying known faces) and face tracking in video. This allows you to identify specific individuals and follow their movements within a video stream, which goes beyond general object detection or content moderation.", "multi": false}, {"num": 8, "text": "Which machine learning concept focuses on ensuring that an AI system makes decisions without exhibiting unfair or discriminatory outcomes against certain groups?", "options": [{"letter": "A", "text": "Fairness"}, {"letter": "B", "text": "Explainability"}, {"letter": "C", "text": "Transparency"}, {"letter": "D", "text": "Robustness"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nFairness in AI is a critical ethical principle that addresses the potential for AI systems to perpetuate or amplify societal biases, leading to discriminatory outcomes. It aims to ensure that AI models treat all individuals and groups equitably, avoiding disparate impact based on protected attributes.", "multi": false}, {"num": 9, "text": "A financial institution wants to categorize incoming customer emails into categories like \"Loan Application,\" \"Account Inquiry,\" or \"Fraud Report\" automatically. Which AWS service is best suited for building a custom text classification model?", "options": [{"letter": "A", "text": "Amazon Lex"}, {"letter": "B", "text": "Amazon Transcribe"}, {"letter": "C", "text": "Amazon Comprehend Custom Classification"}, {"letter": "D", "text": "Amazon Personalize"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend Custom Classification allows you to train a machine learning model to categorize your documents using custom labels that are relevant to your business needs. This is ideal for automatically sorting and routing customer emails based on their content. Personalize is for recommendations, Transcribe for speech-to-text, and Lex for conversational AI.", "multi": false}, {"num": 10, "text": "Which AWS service provides the primary storage solution for large datasets often used as input for AWS AI services and Amazon SageMaker training jobs?", "options": [{"letter": "A", "text": "Amazon RDS"}, {"letter": "B", "text": "Amazon EBS"}, {"letter": "C", "text": "Amazon S3"}, {"letter": "D", "text": "Amazon DynamoDB"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Simple Storage Service (S3) is highly scalable object storage perfect for storing vast amounts of unstructured data, making it the de facto data lake for machine learning workloads on AWS. It serves as the primary data source for training models in SageMaker and for input/output to most AWS AI services. RDS and DynamoDB are databases, and EBS provides block storage for EC2 instances.", "multi": false}, {"num": 11, "text": "A company wants to quickly build a machine learning model to predict customer churn without writing any code. They have historical customer data in a CSV file. Which AWS service would enable them to do this using a visual interface?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon SageMaker Canvas"}, {"letter": "C", "text": "Amazon SageMaker Studio"}, {"letter": "D", "text": "Amazon SageMaker Notebook Instances"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Canvas is a no-code/low-code tool specifically designed for business users and citizen data scientists to build, train, and make predictions from ML models using a visual, drag-and-drop interface, without writing any code. SageMaker Studio and Notebook Instances are for ML practitioners who write code. Comprehend is an NLP service.", "multi": false}, {"num": 12, "text": "Which concept describes the outcome when a machine learning model is too simple to capture the underlying patterns in the data, performing poorly on both training and new data?", "options": [{"letter": "A", "text": "High variance"}, {"letter": "B", "text": "Good generalization"}, {"letter": "C", "text": "Underfitting"}, {"letter": "D", "text": "Overfitting"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nUnderfitting occurs when a model is too simplistic or has not been trained enough to learn the complex relationships within the data. This results in poor performance on both the training data and unseen data, indicating the model hasn't effectively learned anything useful.", "multi": false}, {"num": 13, "text": "Which AWS AI service can convert text from documents (e.g., PDF, image scans) into different languages while preserving the original layout and formatting?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon Translate Document Translation"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nWhile Amazon Translate handles text translation, Amazon Translate Document Translation is a specialized feature that translates entire documents while attempting to preserve their original layout and formatting. This goes beyond simple text-to-text translation offered by the core Translate service. Textract extracts text, and Comprehend is for NLP.", "multi": false}, {"num": 14, "text": "A media company needs to automatically detect and flag inappropriate content in user-generated images and videos before they are published. Which AWS service is best suited for this task?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Polly"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition offers robust content moderation capabilities for images and videos. It can detect explicit, suggestive, violent, or generally unsafe content, helping businesses to automatically review and filter user-generated media for compliance and safety.", "multi": false}, {"num": 15, "text": "A retail company wants to predict future product demand based on historical sales data, seasonal patterns, and promotional events. Which AWS service is purpose-built for this use case?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Comprehend"}, {"letter": "C", "text": "Amazon SageMaker Autopilot"}, {"letter": "D", "text": "Amazon Forecast"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Forecast is a fully managed service that uses machine learning to deliver highly accurate time-series forecasts. It is specifically designed for use cases like demand planning, resource planning, and financial forecasting. Amazon Personalize is for recommendations, Comprehend is for NLP, and while SageMaker Autopilot can build models, Forecast is purpose-built for time-series prediction.", "multi": false}, {"num": 16, "text": "Which AWS service allows you to train a machine learning model to categorize entities unique to your industry (e.g., specific product names, custom medical conditions) from unstructured text?", "options": [{"letter": "A", "text": "Amazon Lex Custom Slots"}, {"letter": "B", "text": "Amazon Personalize Custom Solutions"}, {"letter": "C", "text": "Amazon Comprehend Custom Entities"}, {"letter": "D", "text": "Amazon Rekognition Custom Labels"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend Custom Entities allows you to create custom entity recognition models. This means you can train Comprehend to identify specific, domain-specific entities in your text data that are not part of its pre-built entities. Rekognition Custom Labels is for images, Personalize for recommendations, and Lex Custom Slots are for conversational interfaces.", "multi": false}, {"num": 17, "text": "What is the primary purpose of \"data labeling\" in the context of supervised machine learning?", "options": [{"letter": "A", "text": "To split data into training, validation, and test sets."}, {"letter": "B", "text": "To assign meaningful tags or annotations to raw data (e.g., bounding boxes for objects, sentiment for text)."}, {"letter": "C", "text": "To reduce the dimensionality of the dataset."}, {"letter": "D", "text": "To encrypt data for security purposes."}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nData labeling (or data annotation) is the process of adding descriptive tags or labels to raw data. In supervised learning, this is crucial because models learn by identifying patterns between input data and its corresponding correct output label. Examples include drawing bounding boxes around objects in images, transcribing audio, or marking sentiment in text.", "multi": false}, {"num": 18, "text": "Which AWS AI service would you use to add text-to-speech capabilities to an application, offering both standard and Neural Text-to-Speech (NTTS) voices for a highly natural sound?", "options": [{"letter": "A", "text": "Amazon Transcribe"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Lex"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly is the service for converting text into lifelike speech. It offers a wide range of voices, including standard and advanced Neural Text-to-Speech (NTTS) voices that use deep learning to deliver highly natural and expressive speech, suitable for various applications.", "multi": false}, {"num": 19, "text": "True or False: Ethical AI guidelines primarily focus on the technical implementation of algorithms and do not consider the societal impact of AI systems.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nEthical AI guidelines explicitly and primarily consider the societal impact of AI systems. They address issues such as fairness, accountability, transparency, privacy, and safety, aiming to ensure that AI is developed and deployed responsibly, benefiting humanity while mitigating potential harms.", "multi": false}, {"num": 20, "text": "Which AWS service provides an automatic speech recognition (ASR) service that converts speech to text and can identify different speakers in an audio file (speaker diarization)?", "options": [{"letter": "A", "text": "Amazon Lex"}, {"letter": "B", "text": "Amazon Transcribe"}, {"letter": "C", "text": "Amazon Polly"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Transcribe is a fully managed ASR service. Beyond simply converting speech to text, it also offers advanced features like speaker diarization, which allows it to recognize and separate the speech of different speakers in an audio recording, indicating who said what.", "multi": false}, {"num": 21, "text": "A company has a vast archive of legal documents and needs to automatically extract key phrases and entities such as \"Plaintiff,\" \"Defendant,\" \"Case Number,\" and \"Court Date\" from these documents. Which AWS AI service is specifically tailored for this purpose in the legal domain?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon Comprehend for Legal"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Comprehend Medical"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nWhile Amazon Comprehend can extract general entities and key phrases, Amazon Comprehend for Legal is a specialized version of Comprehend trained on legal text. It is designed to accurately identify and extract specific legal entities (e.g., terms, parties, regulations) and concepts, making it ideal for the legal domain. Comprehend Medical is for healthcare text.", "multi": false}, {"num": 22, "text": "Which AWS service provides the underlying machine learning models for natural language understanding (NLU) and automatic speech recognition (ASR) that powers Amazon Alexa?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Translate"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Lex"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Lex is the same deep learning engine that powers Amazon Alexa. It provides the NLU and ASR capabilities to build conversational interfaces for applications using voice and text. Transcribe is primarily for speech-to-text, Polly for text-to-speech, and Translate for language translation.", "multi": false}, {"num": 23, "text": "True or False: Amazon SageMaker Studio Labs offers a free, cloud-based environment to learn and experiment with machine learning without requiring an AWS account.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Studio Lab (note: not \"Labs\") provides a free, cloud-based ML development environment that allows anyone to learn and experiment with ML *without needing an AWS account, credit card, or instance configuration*. The question implies a general service, but Studio Lab is the specific offering.", "multi": false}, {"num": 24, "text": "Which machine learning task involves predicting a continuous numerical output, such as forecasting stock prices or predicting temperature?", "options": [{"letter": "A", "text": "Regression"}, {"letter": "B", "text": "Clustering"}, {"letter": "C", "text": "Reinforcement Learning"}, {"letter": "D", "text": "Classification"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nRegression is a supervised learning task where the goal is to predict a continuous numerical value. Examples include predicting house prices, stock prices, or temperature. Classification predicts discrete categories, clustering groups similar items, and reinforcement learning involves an agent learning through interaction.", "multi": false}, {"num": 25, "text": "When evaluating a machine learning model, what does the F1-Score represent?", "options": [{"letter": "A", "text": "The total number of correct predictions."}, {"letter": "B", "text": "The percentage of actual positive cases correctly identified."}, {"letter": "C", "text": "The percentage of predicted positive cases that are correct."}, {"letter": "D", "text": "The harmonic mean of precision and recall."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nThe F1-Score is a metric that combines both precision and recall. It is particularly useful when you have an uneven class distribution (imbalanced classes) because it penalizes models that favor one class over another. A high F1-Score indicates good performance on both precision and recall.", "multi": false}, {"num": 26, "text": "A company needs to audit thousands of employee expense receipts to extract merchant names, transaction amounts, and dates. Which AWS AI service is specifically designed for processing such documents?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon Rekognition Custom Labels"}, {"letter": "C", "text": "Amazon Textract AnalyzeExpense"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract AnalyzeExpense is a specialized API within Textract designed to automatically extract data from invoices and receipts. It understands the common fields in these documents (e.g., merchant name, total, date, line items) and extracts them as structured data, going beyond general text or form extraction.", "multi": false}, {"num": 27, "text": "Which AWS AI service enables you to programmatically convert documents (e.g., Word, PowerPoint, Excel) into plain text or HTML, which can then be used for indexing or further natural language processing?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon WorkDocs"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend can directly process various document formats (like Word, PDF) to extract text content, which can then be used for NLP tasks. While Textract extracts from images/scanned documents, Comprehend is better suited for processing native digital documents for text content and preparing them for further NLP or indexing.", "multi": false}, {"num": 28, "text": "A machine learning team needs to create high-quality labeled training data for a custom object detection model. They want to use a combination of automated labeling and human reviewers from their own organization. Which AWS service supports this workflow?", "options": [{"letter": "A", "text": "Amazon Rekognition Custom Labels"}, {"letter": "B", "text": "Amazon Mechanical Turk"}, {"letter": "C", "text": "AWS Glue DataBrew"}, {"letter": "D", "text": "Amazon SageMaker Ground Truth"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Ground Truth provides data labeling workflows that combine machine learning-based automatic labeling with human review. It supports private workforces (your own employees), public workforces (Mechanical Turk), and vendor workforces. Rekognition Custom Labels trains models but does not manage labeling workflows. Mechanical Turk is just a crowdsourcing platform without the automated labeling pipeline.", "multi": false}, {"num": 29, "text": "Which AWS AI service can analyze video streams for inappropriate content and provides a timestamped list of detected segments, allowing for precise moderation?", "options": [{"letter": "A", "text": "Amazon Transcribe"}, {"letter": "B", "text": "Amazon Comprehend"}, {"letter": "C", "text": "Amazon Rekognition Video"}, {"letter": "D", "text": "Amazon Rekognition Image"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition Video provides advanced content moderation for video streams. It not only detects inappropriate content but also provides specific timestamps for when such content appears, enabling precise editing or flagging for human review. Rekognition Image is for static images, Comprehend for text, and Transcribe for audio.", "multi": false}, {"num": 30, "text": "In the context of machine learning operations (MLOps), what is the primary benefit of using Amazon SageMaker Model Monitor?", "options": [{"letter": "A", "text": "To manage versions of machine learning models."}, {"letter": "B", "text": "To automatically retrain models when new data becomes available."}, {"letter": "C", "text": "To provide a graphical interface for building ML models without code."}, {"letter": "D", "text": "To continuously monitor deployed ML models for data drift, concept drift, and model quality."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Model Monitor is a crucial MLOps tool. It continuously monitors the quality of machine learning models in production. It automatically detects issues such as data drift (changes in input data characteristics) and concept drift (changes in the relationship between input and target variables), and reports on model quality metrics, alerting you to potential performance degradation.", "multi": false}, {"num": 31, "text": "Which AWS service provides the capability to detect the language of a given text, allowing applications to dynamically adapt to different linguistic inputs?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Transcribe"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend offers a `DetectDominantLanguage` API that can accurately identify the primary language of a block of text. This is a fundamental step for many multilingual applications, enabling them to route text to the correct translation service or process it with language-specific NLP models. Translate is for translation, Transcribe for speech-to-text, and Polly for text-to-speech.", "multi": false}, {"num": 32, "text": "A developer is building a system that needs to extract specific named entities, such as \"person,\" \"location,\" or \"organization,\" from unstructured text. Which AWS service is best suited for this task?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Textract"}, {"letter": "C", "text": "Amazon Translate"}, {"letter": "D", "text": "Amazon Rekognition"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend's entity recognition capability uses machine learning to identify and categorize specific named entities (like people, places, organizations, dates, quantities) within text. Rekognition is for image/video analysis, Translate is for language translation, and Textract is for optical character recognition and structured data extraction from documents.", "multi": false}, {"num": 33, "text": "True or False: Amazon Personalize can only generate recommendations based on explicit user ratings.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Personalize is very flexible and can generate recommendations based on various types of data, including implicit feedback (e.g., clicks, views, purchases without explicit ratings), explicit feedback (ratings, likes), and even item and user metadata. It does not solely rely on explicit ratings.", "multi": false}, {"num": 34, "text": "When you deploy a machine learning model using Amazon SageMaker, what is the purpose of \"inference\"?", "options": [{"letter": "A", "text": "The process of training the model on new data."}, {"letter": "B", "text": "The process of evaluating the model's performance on a test set."}, {"letter": "C", "text": "The process of labeling data for supervised learning."}, {"letter": "D", "text": "The process of making predictions or generating outputs using a trained model."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nInference, in machine learning, refers to the act of using a trained model to make predictions or generate outputs on new, unseen data. After a model is trained and deployed (e.g., to a SageMaker endpoint), applications send new inputs to the endpoint, and the model performs inference to return predictions.", "multi": false}, {"num": 35, "text": "Which AWS service allows you to create custom conversational interfaces (chatbots/voicebots) using a visual editor to define intents, utterances, and slots, simplifying the development process?", "options": [{"letter": "A", "text": "Amazon Transcribe"}, {"letter": "B", "text": "Amazon Lex"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Polly"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Lex provides a visual console that allows developers to design, build, test, and deploy conversational bots. Users can define intents (user goals), sample utterances (phrases users might say), and slots (data to extract) using a drag-and-drop interface, abstracting the complexities of NLU and ASR.", "multi": false}, {"num": 36, "text": "Which principle of Responsible AI ensures that AI systems operate in a way that is consistent, reliable, and resistant to malicious attacks or unexpected input variations?", "options": [{"letter": "A", "text": "Explainability"}, {"letter": "B", "text": "Robustness"}, {"letter": "C", "text": "Accountability"}, {"letter": "D", "text": "Fairness"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nRobustness in AI focuses on the resilience and reliability of AI systems. A robust system can handle variations, noise, or adversarial inputs without significant degradation in performance or security. This is crucial for systems deployed in real-world, unpredictable environments.", "multi": false}, {"num": 37, "text": "A company wants to extract specific fields like \"Patient Name,\" \"Diagnosis,\" and \"Medication\" from unstructured medical notes. Which AWS service is purpose-built for this?", "options": [{"letter": "A", "text": "Amazon Comprehend Medical"}, {"letter": "B", "text": "Amazon Textract"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon HealthLake"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend Medical is specifically designed to understand and extract clinically relevant information from unstructured medical text. It can identify medical conditions, medications, treatments, test results, and protected health information (PHI) with high accuracy, making it ideal for processing medical notes. General Comprehend is not optimized for medical terminology.", "multi": false}, {"num": 38, "text": "Which of the following is a common technique used to mitigate \"overfitting\" in machine learning models?", "options": [{"letter": "A", "text": "Reducing the amount of training data."}, {"letter": "B", "text": "Using more features that are highly correlated with each other."}, {"letter": "C", "text": "Increasing the complexity of the model."}, {"letter": "D", "text": "Regularization (e.g., L1/L2 regularization, dropout)."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nRegularization techniques (like L1/L2 regularization or dropout in neural networks) are commonly used to prevent overfitting. They introduce penalties or constraints during the training process, discouraging the model from becoming too complex and fitting the noise in the training data, thereby improving its ability to generalize to unseen data.", "multi": false}, {"num": 39, "text": "Which AWS service provides a fully managed, scalable solution for processing large volumes of streaming data, such as website clickstreams, IoT device data, or social media feeds, often used as input for real-time AI analytics?", "options": [{"letter": "A", "text": "Amazon DynamoDB"}, {"letter": "B", "text": "Amazon Kinesis"}, {"letter": "C", "text": "Amazon S3"}, {"letter": "D", "text": "Amazon Redshift"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Kinesis is a family of services designed for processing large streams of data in real-time. Kinesis Data Streams, in particular, can ingest and process terabytes of data per hour from various sources, making it ideal for feeding real-time data to AI services for immediate analysis (e.g., real-time sentiment analysis on social media posts).", "multi": false}, {"num": 40, "text": "True or False: Amazon SageMaker provides an integrated development environment (IDE) called SageMaker Studio, which supports common ML frameworks like TensorFlow and PyTorch.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Studio is the primary IDE for ML practitioners within SageMaker. It provides a web-based environment where data scientists and developers can build, train, debug, and deploy ML models. It offers extensive support and optimized containers for popular ML frameworks like TensorFlow, PyTorch, MXNet, and more.", "multi": false}, {"num": 41, "text": "Which AWS service would you use to automatically extract text and structured data (forms, tables) from scanned documents and then translate that extracted text into another language?", "options": [{"letter": "A", "text": "Amazon Textract and Amazon Translate"}, {"letter": "B", "text": "Amazon Textract and Amazon Comprehend"}, {"letter": "C", "text": "Amazon Comprehend and Amazon Translate"}, {"letter": "D", "text": "Amazon Rekognition and Amazon Translate"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract is specifically designed for extracting text and structured data from scanned documents. Once Textract extracts the text, Amazon Translate can then be used to translate that extracted text into different languages. This combination handles the two distinct steps of extraction and translation.", "multi": false}, {"num": 42, "text": "A company wants to detect brand logos in images uploaded by users. Which AWS service and feature would be most suitable for this task?", "options": [{"letter": "A", "text": "Amazon Rekognition Custom Labels"}, {"letter": "B", "text": "Amazon Textract for logo analysis"}, {"letter": "C", "text": "Amazon Personalize for image recommendations"}, {"letter": "D", "text": "Amazon Comprehend for custom entity recognition"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition Custom Labels allows you to train custom object detection models using your own labeled images. This is ideal for specific use cases like detecting brand logos, products, or defects that are unique to your business. Comprehend is for text, Personalize for recommendations, and Textract for document data extraction.", "multi": false}, {"num": 43, "text": "Which ethical principle in AI focuses on ensuring that there is a clear chain of responsibility for the actions and impacts of AI systems, particularly when errors or harms occur?", "options": [{"letter": "A", "text": "Transparency"}, {"letter": "B", "text": "Fairness"}, {"letter": "C", "text": "Accountability"}, {"letter": "D", "text": "Explainability"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAccountability in AI means establishing clear lines of responsibility for the design, development, deployment, and operation of AI systems. It ensures that when an AI system makes an error or causes harm, there are mechanisms in place to determine who is responsible and how to address the issue.", "multi": false}, {"num": 44, "text": "True or False: Amazon Transcribe can only process audio files stored in Amazon S3, and cannot handle real-time audio streams.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Transcribe supports both batch processing of audio files stored in Amazon S3 and real-time transcription of live audio streams. This flexibility allows for transcribing pre-recorded content as well as live conversations, such as those in call centers or live events.", "multi": false}, {"num": 45, "text": "Which AWS AI service uses machine learning to deliver highly accurate demand forecasts for business planning, optimizing inventory, and resource allocation?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Forecast"}, {"letter": "C", "text": "Amazon Rekognition"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Forecast is a fully managed service that uses machine learning to deliver highly accurate forecasts. It is specifically designed for time-series forecasting, making it ideal for predicting future demand, optimizing inventory levels, and planning resource allocation.", "multi": false}, {"num": 46, "text": "A data scientist wants to experiment with different machine learning models and algorithms in a fully managed Jupyter environment. Which Amazon SageMaker component would they use?", "options": [{"letter": "A", "text": "Amazon SageMaker Batch Transform"}, {"letter": "B", "text": "Amazon SageMaker Ground Truth"}, {"letter": "C", "text": "Amazon SageMaker Canvas"}, {"letter": "D", "text": "Amazon SageMaker Notebook Instances"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Notebook Instances provide a fully managed, web-based Jupyter notebook environment. This allows data scientists to interactively explore data, write code, build, train, and test machine learning models using their preferred frameworks and algorithms without managing servers.", "multi": false}, {"num": 47, "text": "Which type of machine learning involves an agent interacting with an environment, performing actions, and receiving rewards or penalties to learn an optimal policy?", "options": [{"letter": "A", "text": "Reinforcement Learning"}, {"letter": "B", "text": "Semi-supervised Learning"}, {"letter": "C", "text": "Unsupervised Learning"}, {"letter": "D", "text": "Supervised Learning"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nReinforcement Learning (RL) is a machine learning paradigm where an agent learns to make decisions by trial and error. It observes the environment, takes an action, and receives a reward or penalty. The goal is to learn a policy that maximizes the cumulative reward over time.", "multi": false}, {"num": 48, "text": "A company wants to automatically extract key insights and sentiment from news articles written in multiple languages. Which two AWS services would be most useful? (Choose two)", "options": [{"letter": "A", "text": "Amazon Translate"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Lex"}, {"letter": "D", "text": "Amazon Comprehend"}, {"letter": "E", "text": "Amazon Textract"}], "correct": ["A", "D"], "explanation": "<strong>Explanation:</strong>\nTo analyze multilingual news articles, you would first use Amazon Translate to convert them into a common language (e.g., English) if they are in various languages. Then, Amazon Comprehend would perform natural language processing tasks like sentiment analysis and key phrase extraction on the translated text to extract insights.", "multi": true}, {"num": 49, "text": "What is the primary role of \"AWS Lambda\" when used in conjunction with AWS AI services?", "options": [{"letter": "A", "text": "To visualize the performance metrics of AI models."}, {"letter": "B", "text": "To deploy and host trained machine learning models."}, {"letter": "C", "text": "To trigger and orchestrate AI service calls, often in response to events (e.g., S3 object uploads)."}, {"letter": "D", "text": "To store large volumes of data for AI model training."}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAWS Lambda is a serverless compute service commonly used to glue together different AWS services. For AI workloads, Lambda functions are frequently used to trigger AI service operations (e.g., call Amazon Rekognition when an image is uploaded to S3, invoke Amazon Transcribe when an audio file arrives), preprocess data for AI services, or post-process their outputs.", "multi": false}, {"num": 50, "text": "Which AWS service provides a comprehensive suite of tools for data scientists and developers to build, train, and deploy machine learning models at scale, including capabilities like data labeling, feature engineering, and model monitoring?", "options": [{"letter": "A", "text": "Amazon Redshift"}, {"letter": "B", "text": "Amazon DynamoDB"}, {"letter": "C", "text": "Amazon SageMaker"}, {"letter": "D", "text": "AWS Glue"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker is an end-to-end machine learning service designed to simplify every step of the ML workflow. It offers a broad range of capabilities, from data labeling (Ground Truth) and feature engineering to model training, deployment, and monitoring (Model Monitor), making it a complete platform for ML practitioners.", "multi": false}, {"num": 51, "text": "Which AWS service provides a real-time language translation capability, allowing you to translate text, documents, or even live speech into dozens of languages?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Translate is a neural machine translation service that enables high-quality and fast translation between languages. It supports real-time text translation, batch document translation, and can be integrated with other services for speech translation. Comprehend is for NLP, Transcribe for speech-to-text, and Polly for text-to-speech.", "multi": false}, {"num": 52, "text": "A company wants to identify patterns in unlabeled customer reviews to discover natural groupings of feedback without predefined categories. Which machine learning technique is most appropriate?", "options": [{"letter": "A", "text": "Classification"}, {"letter": "B", "text": "Reinforcement Learning"}, {"letter": "C", "text": "Clustering"}, {"letter": "D", "text": "Regression"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nClustering is an unsupervised learning technique used to group data points that are similar to each other. When you have unlabeled data like customer reviews and want to discover inherent patterns or segments without prior categories, clustering algorithms are the suitable choice.", "multi": false}, {"num": 53, "text": "Which AWS AI service can convert text into lifelike speech, offering a broad selection of standard voices and more natural-sounding Neural Text-to-Speech (NTTS) voices?", "options": [{"letter": "A", "text": "Amazon Transcribe"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Translate"}, {"letter": "D", "text": "Amazon Lex"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly is the Text-to-Speech (TTS) service that excels at synthesizing human-like speech from text. It provides both standard and NTTS voices, which are generated using deep learning to achieve a very natural and expressive sound.", "multi": false}, {"num": 54, "text": "A legal firm needs to digitize thousands of contracts that contain both typed clauses and handwritten signatures and annotations. They need to extract text from all of these elements. Which AWS service handles both printed and handwritten text extraction?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Kendra"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract uses machine learning to extract printed text, handwriting, tables, and other data from scanned documents. It handles both typed and handwritten content accurately. Amazon Comprehend analyzes text meaning but does not perform OCR. Rekognition handles image analysis but is not optimized for document text extraction. Kendra is a search service, not a text extraction service.", "multi": false}, {"num": 55, "text": "A retail business wants to build a recommendation system for its website. They have user interaction data (clicks, views, purchases) and item metadata. Which AWS service can help them build a custom recommendation engine without requiring deep ML expertise?", "options": [{"letter": "A", "text": "Amazon Forecast"}, {"letter": "B", "text": "Amazon Personalize"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon SageMaker"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Personalize is a fully managed machine learning service specifically designed for creating personalized recommendation systems. It leverages Amazon.com's recommendation technology and allows developers to build custom recommenders using their own data, often with minimal ML expertise required.", "multi": false}, {"num": 56, "text": "Which AWS service offers a fully integrated development environment (IDE) for data scientists and developers to perform every step of the machine learning workflow, from data preparation to model deployment?", "options": [{"letter": "A", "text": "Amazon S3"}, {"letter": "B", "text": "Amazon EC2"}, {"letter": "C", "text": "AWS Lambda"}, {"letter": "D", "text": "Amazon SageMaker Studio"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Studio is the first fully integrated development environment (IDE) for machine learning. It provides a single, web-based visual interface where you can perform all ML development steps, making the ML workflow more efficient and accessible.", "multi": false}, {"num": 57, "text": "Which ethical principle in AI concerns the ability to understand how an AI system arrived at a particular decision or prediction?", "options": [{"letter": "A", "text": "Reproducibility"}, {"letter": "B", "text": "Explainability"}, {"letter": "C", "text": "Fairness"}, {"letter": "D", "text": "Transparency"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nExplainability in AI refers to the capacity to interpret and understand the reasoning behind an AI system's output or decision. It's about making the \"black box\" of AI more understandable to humans, which is essential for building trust and for debugging or auditing AI systems.", "multi": false}, {"num": 58, "text": "What is the primary purpose of Amazon SageMaker Ground Truth?", "options": [{"letter": "A", "text": "To monitor machine learning models in production."}, {"letter": "B", "text": "To deploy machine learning models."}, {"letter": "C", "text": "To create high-quality, labeled datasets for machine learning."}, {"letter": "D", "text": "To train machine learning models."}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Ground Truth is a data labeling service. Its main purpose is to help users efficiently build accurate training datasets for their machine learning models by simplifying the process of labeling data (images, video, text, etc.), using either human workforces or machine learning.", "multi": false}, {"num": 59, "text": "A security team wants to monitor large volumes of social media posts for mentions of specific threats or critical events in real-time. Which two AWS services would be crucial for this task? (Choose two)", "options": [{"letter": "A", "text": "Amazon Lex (for conversational AI)"}, {"letter": "B", "text": "Amazon Kinesis (for real-time data streaming)"}, {"letter": "C", "text": "Amazon S3 (for storage)"}, {"letter": "D", "text": "Amazon Comprehend (for threat detection/NLP)"}, {"letter": "E", "text": "Amazon Rekognition (for image/video analysis)"}], "correct": ["B", "D"], "explanation": "<strong>Explanation:</strong>\nAmazon Kinesis would be used to ingest and process the streaming social media data in real-time. Once the data is in a stream, Amazon Comprehend's natural language processing capabilities, including custom entity recognition or topic modeling, could be used to identify specific threats or events mentioned in the posts.", "multi": true}, {"num": 60, "text": "Which of the following is considered an \"AWS AI Service\" (pre-trained, fully managed, API-driven) rather than an \"AWS ML Service\" (platform for custom ML)?", "options": [{"letter": "A", "text": "Amazon Rekognition"}, {"letter": "B", "text": "AWS DeepRacer"}, {"letter": "C", "text": "Amazon SageMaker"}, {"letter": "D", "text": "Amazon SageMaker Canvas"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition is an AWS AI Service, offering pre-trained, ready-to-use computer vision capabilities via API calls. Amazon SageMaker is a broader ML platform for building custom models. AWS DeepRacer is a service for learning reinforcement learning, and SageMaker Canvas is a no-code tool within the SageMaker family.", "multi": false}, {"num": 61, "text": "Which AWS AI service can analyze patient-doctor conversations (audio) to automatically generate summaries and extract key medical information?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Comprehend Medical"}, {"letter": "C", "text": "A combination of Amazon Transcribe Medical and Amazon Comprehend Medical"}, {"letter": "D", "text": "Amazon Transcribe Medical"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nTo analyze audio conversations, you first need to convert the speech to text. Amazon Transcribe Medical is designed for accurate transcription of medical speech. Once the audio is transcribed, Amazon Comprehend Medical can then be used to perform NLP on that text, extracting medical entities, relationships, and potentially summarizing the conversation.", "multi": false}, {"num": 62, "text": "When developing an AI system, what does \"Bias\" primarily refer to in the context of training data?", "options": [{"letter": "A", "text": "The statistical distribution of the dataset being perfectly balanced."}, {"letter": "B", "text": "The model's complexity being too high."}, {"letter": "C", "text": "The hardware architecture used for training."}, {"letter": "D", "text": "The data being unrepresentative or skewed, leading to unfair or inaccurate model predictions for certain groups."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nIn AI, data bias occurs when the training data does not accurately reflect the real-world population or problem, often due to underrepresentation or overrepresentation of certain groups or characteristics. This can lead the model to learn and perpetuate harmful stereotypes or make consistently unfair predictions for specific demographics.", "multi": false}, {"num": 63, "text": "Which AWS service provides the capability to detect the sentiment (positive, negative, neutral, mixed) of unstructured text, such as customer reviews, social media posts, or news articles?", "options": [{"letter": "A", "text": "Amazon Rekognition"}, {"letter": "B", "text": "Amazon Translate"}, {"letter": "C", "text": "Amazon Polly"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend is a natural language processing (NLP) service that includes robust sentiment analysis capabilities. It can analyze text and return an overall sentiment score, as well as scores for positive, negative, and neutral sentiments, helping businesses understand opinions expressed in text.", "multi": false}, {"num": 64, "text": "A data engineer needs to enable business users to search through millions of internal documents, FAQs, and knowledge articles using natural language questions rather than keyword queries. Which AWS service provides this intelligent enterprise search capability?", "options": [{"letter": "A", "text": "Amazon OpenSearch Service"}, {"letter": "B", "text": "Amazon CloudSearch"}, {"letter": "C", "text": "Amazon Kendra"}, {"letter": "D", "text": "Amazon Athena"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Kendra is an intelligent enterprise search service powered by machine learning that understands natural language queries and returns specific answers from unstructured content. OpenSearch and CloudSearch are traditional search engines that primarily rely on keyword matching. Athena is for querying structured data in S3 using SQL.", "multi": false}, {"num": 65, "text": "A manufacturing company wants to detect anomalies in sensor data from their machinery to predict potential equipment failures. Which type of machine learning problem is this?", "options": [{"letter": "A", "text": "Reinforcement Learning"}, {"letter": "B", "text": "Classification"}, {"letter": "C", "text": "Anomaly Detection (Unsupervised Learning)"}, {"letter": "D", "text": "Regression"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAnomaly detection is typically an unsupervised learning task where the goal is to identify rare events or observations that deviate significantly from the majority of the data. In this scenario, the model would learn the normal operating patterns of the machinery and flag any significant deviations as potential anomalies or failures.", "multi": false}, {"num": 66, "text": "Which AWS service would you use to build a virtual assistant that interacts with users via text or voice, and can understand user intent to fulfill requests, often integrating with backend systems?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Lex"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Lex is the service for building conversational interfaces (chatbots and voicebots). It uses automatic speech recognition (ASR) to convert speech to text and natural language understanding (NLU) to comprehend user intent, allowing it to fulfill requests by integrating with various backend services.", "multi": false}, {"num": 67, "text": "Which AWS AI service can identify prominent faces, objects, and activities in both images and stored video files, and provide labels for them?", "options": [{"letter": "A", "text": "Amazon Rekognition"}, {"letter": "B", "text": "Amazon Comprehend"}, {"letter": "C", "text": "Amazon Forecast"}, {"letter": "D", "text": "Amazon Textract"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition is a machine learning service that provides various computer vision capabilities, including object and scene detection, facial analysis, and activity recognition in both images and videos. It automatically generates labels describing what it sees.", "multi": false}, {"num": 68, "text": "A marketing manager with no programming experience wants to build a machine learning model to predict customer churn using historical CRM data. Which AWS tool provides a visual, no-code interface specifically designed for this user persona?", "options": [{"letter": "A", "text": "Amazon SageMaker Studio"}, {"letter": "B", "text": "Amazon SageMaker Autopilot"}, {"letter": "C", "text": "Amazon SageMaker Canvas"}, {"letter": "D", "text": "Amazon QuickSight ML Insights"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Canvas provides a no-code visual interface specifically designed for business users and analysts without ML expertise. SageMaker Studio is an IDE for developers/data scientists. Autopilot automates model building but still requires some technical knowledge to use via the API or Studio. QuickSight ML Insights provides anomaly detection in dashboards but is not a model-building tool.", "multi": false}, {"num": 69, "text": "What is the main advantage of using pre-trained AWS AI services (like Rekognition or Comprehend) over building custom models for common tasks like sentiment analysis or object detection?", "options": [{"letter": "A", "text": "Greater flexibility in choosing specific algorithms and architectures."}, {"letter": "B", "text": "Guaranteed higher accuracy for all possible use cases."}, {"letter": "C", "text": "Significantly reduced development time and operational overhead."}, {"letter": "D", "text": "More control over the underlying compute infrastructure."}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nPre-trained AWS AI services are fully managed and ready to use via simple API calls. This drastically cuts down on the time and effort required to develop, train, and deploy ML models from scratch, as AWS handles all the underlying infrastructure, scaling, and model maintenance.", "multi": false}, {"num": 70, "text": "Which AWS AI service helps identify and classify entities, key phrases, and sentiments in text data, making it useful for understanding customer feedback or social media trends?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Transcribe"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Personalize"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend is a natural language processing (NLP) service that uses machine learning to uncover insights and relationships in text. Its capabilities include extracting key phrases, identifying entities, and analyzing sentiment, which are all highly valuable for understanding large volumes of text data like customer feedback.", "multi": false}, {"num": 71, "text": "Which AWS service provides a fully managed solution for building and deploying machine learning models, offering a broad range of capabilities including data labeling, data preparation, algorithm selection, and model training/deployment?", "options": [{"letter": "A", "text": "AWS Lambda"}, {"letter": "B", "text": "Amazon EC2"}, {"letter": "C", "text": "Amazon SageMaker"}, {"letter": "D", "text": "Amazon DynamoDB"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker is an end-to-end machine learning service that encompasses the entire ML workflow. It offers tools for every stage, from preparing data (e.g., Ground Truth, Data Wrangler) to building, training, and deploying models, making it a comprehensive platform for ML practitioners.", "multi": false}, {"num": 72, "text": "Which ethical principle of AI focuses on providing users with understandable information about how an AI system works, its purpose, and its limitations?", "options": [{"letter": "A", "text": "Accountability"}, {"letter": "B", "text": "Fairness"}, {"letter": "C", "text": "Transparency"}, {"letter": "D", "text": "Privacy"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nTransparency in AI refers to the ability to clearly explain an AI system's purpose, how it functions, what data it uses, and its potential limitations. This is crucial for building trust, allowing users to understand the AI's role, and ensuring responsible deployment.", "multi": false}, {"num": 73, "text": "A multinational company receives customer support emails in dozens of languages. They need to automatically detect the source language and translate messages to English before routing them to support agents. Which AWS service combination best addresses this need?", "options": [{"letter": "A", "text": "Amazon Comprehend for detection and Amazon Polly for translation"}, {"letter": "B", "text": "Amazon Lex for detection and Amazon Translate for translation"}, {"letter": "C", "text": "Amazon Rekognition for detection and Amazon Comprehend for translation"}, {"letter": "D", "text": "Amazon Translate for both automatic language detection and translation"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Translate provides both automatic source language detection and neural machine translation in a single service. You do not need a separate service for language detection. Amazon Comprehend can detect language but cannot translate. Polly converts text to speech. Lex is for conversational interfaces. Rekognition handles images, not text.", "multi": false}, {"num": 74, "text": "A company wants to identify and extract specific items from a large inventory of historical purchase orders in PDF format. The data includes item names, quantities, and prices, and the layout varies between orders. Which AWS AI service is designed to intelligently extract structured data from such documents?", "options": [{"letter": "A", "text": "Amazon Kendra"}, {"letter": "B", "text": "Amazon Textract"}, {"letter": "C", "text": "Amazon Rekognition"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract is a machine learning service that goes beyond simple OCR to automatically extract text, handwriting, and data from scanned documents. It excels at identifying structured data in forms and tables, even when layouts vary, making it ideal for processing purchase orders.", "multi": false}, {"num": 75, "text": "Which AWS service allows you to create custom-trained computer vision models for specific object detection or image classification tasks, using a small set of labeled images, without requiring deep ML expertise?", "options": [{"letter": "A", "text": "Amazon SageMaker Canvas"}, {"letter": "B", "text": "Amazon Comprehend Custom Classification"}, {"letter": "C", "text": "AWS DeepLens"}, {"letter": "D", "text": "Amazon Rekognition Custom Labels"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition Custom Labels enables you to train custom models to detect objects and scenes in images unique to your business. It significantly simplifies the process by requiring only a small number of labeled images and abstracting away the underlying machine learning complexities.", "multi": false}, {"num": 76, "text": "What is the primary role of an \"Intent\" in Amazon Lex?", "options": [{"letter": "A", "text": "To collect specific data from the user."}, {"letter": "B", "text": "To generate the bot's response to the user."}, {"letter": "C", "text": "To represent the goal or desired action the user wants to achieve."}, {"letter": "D", "text": "To define the specific phrases users might say."}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nIn Amazon Lex, an \"Intent\" is the core concept that represents the user's goal or purpose when interacting with the bot (e.g., \"BookFlight,\" \"OrderPizza\"). Intents are associated with \"utterances\" (sample phrases) that trigger them and \"slots\" (data points) that need to be collected to fulfill the intent.", "multi": false}, {"num": 77, "text": "Which type of machine learning problem involves categorizing data into one of several predefined classes, such as identifying spam emails or diagnosing diseases?", "options": [{"letter": "A", "text": "Clustering"}, {"letter": "B", "text": "Classification"}, {"letter": "C", "text": "Anomaly Detection"}, {"letter": "D", "text": "Regression"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nClassification is a supervised learning task where the model learns to assign an input data point to one of a finite set of discrete categories or classes. Examples include classifying emails as spam or not spam, or categorizing images (e.g., cat, dog, bird).", "multi": false}, {"num": 78, "text": "Which AWS service would you use to convert unstructured text, like customer reviews or social media posts, into a structured format by extracting entities, key phrases, and detecting sentiment?", "options": [{"letter": "A", "text": "Amazon Translate"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Textract"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend is a natural language processing (NLP) service that specializes in analyzing unstructured text. It can automatically identify and extract key information (entities, key phrases) and analyze the emotional tone (sentiment), transforming raw text into valuable structured insights.", "multi": false}, {"num": 79, "text": "A data science team wants to organize their machine learning experiments, track hyperparameters across training runs, compare model metrics, and reproduce previous results. Which SageMaker capability provides this integrated experiment management?", "options": [{"letter": "A", "text": "SageMaker Model Registry"}, {"letter": "B", "text": "SageMaker Pipelines"}, {"letter": "C", "text": "SageMaker Experiments"}, {"letter": "D", "text": "SageMaker Debugger"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nSageMaker Experiments allows you to organize, track, compare, and evaluate machine learning experiments and model versions. It captures inputs, parameters, configurations, and results of training iterations. Model Registry stores and manages model versions for deployment. Pipelines orchestrates ML workflows. Debugger identifies training issues in real time.", "multi": false}, {"num": 80, "text": "Which AWS service provides the capability to detect objects, scenes, and activities in real-time video streams, making it suitable for security, monitoring, or public safety applications?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Rekognition Image"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Rekognition Video"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition Video is specifically designed for analyzing video streams (live or stored). It can detect objects, scenes, activities, and faces in real-time, providing powerful computer vision capabilities for various video analytics applications. Rekognition Image is for static images, Transcribe for speech, and Comprehend for text.", "multi": false}, {"num": 81, "text": "Which AWS service provides a fully managed machine learning service that enables developers to easily build, train, and deploy custom fraud detection models?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Fraud Detector"}, {"letter": "C", "text": "Amazon Rekognition"}, {"letter": "D", "text": "Amazon Kendra"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Fraud Detector is a specialized, fully managed service that leverages machine learning and over 20 years of fraud detection expertise from Amazon.com to help you identify potentially fraudulent online activities. It provides a straightforward way to build, train, and deploy custom fraud detection models.", "multi": false}, {"num": 82, "text": "What is the primary purpose of \"data augmentation\" in machine learning, especially in computer vision tasks?", "options": [{"letter": "A", "text": "To increase the size and diversity of the training dataset by creating modified versions of existing data."}, {"letter": "B", "text": "To reduce the dimensionality of the input features."}, {"letter": "C", "text": "To encrypt the training data for security."}, {"letter": "D", "text": "To split the dataset into training and testing sets."}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nData augmentation is a technique used to expand the training dataset by creating new, slightly altered copies of existing data. For computer vision, this might involve rotations, flips, zooms, or color adjustments. It helps prevent overfitting and improves the model's ability to generalize to new data.", "multi": false}, {"num": 83, "text": "True or False: Amazon Polly can generate speech in many different languages and voices, but it does not support generating speech with emotions or expressive tones.", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly, particularly with its Neural Text-to-Speech (NTTS) voices, supports expressive speech synthesis, allowing you to generate speech with various emotional and conversational styles (e.g., joyful, sad, serious, excited, conversational) to make the output sound more natural and engaging.", "multi": false}, {"num": 84, "text": "Which AWS AI service allows users to automatically extract detailed information from financial documents like invoices and receipts, including line items and totals, without defining templates?", "options": [{"letter": "A", "text": "Amazon Rekognition Custom Labels"}, {"letter": "B", "text": "Amazon Comprehend"}, {"letter": "C", "text": "Amazon Textract AnalyzeDocument"}, {"letter": "D", "text": "Amazon Textract AnalyzeExpense"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract AnalyzeExpense is a specialized API within Textract specifically designed to understand the structure and content of invoices and receipts. It automatically extracts key data fields, line items, and totals without the need for pre-defined templates or manual configuration, making it highly efficient for financial document processing.", "multi": false}, {"num": 85, "text": "Which AWS service is designed to help customers integrate AI into their contact centers, providing capabilities like real-time call transcription, sentiment analysis, and agent assistance?", "options": [{"letter": "A", "text": "Amazon Connect Contact Lens"}, {"letter": "B", "text": "Amazon Lex"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Polly"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Connect Contact Lens is a feature of Amazon Connect (AWS's cloud contact center service) that uses machine learning to provide advanced analytics for customer conversations. It offers capabilities like real-time transcription, sentiment analysis, identification of call drivers, and agent performance insights specifically within a contact center context.", "multi": false}, {"num": 86, "text": "What is the primary benefit of using Amazon SageMaker JumpStart?", "options": [{"letter": "A", "text": "To offer a curated set of pre-built ML solutions, models, and notebooks to accelerate development."}, {"letter": "B", "text": "To automatically label large datasets for computer vision tasks."}, {"letter": "C", "text": "To monitor deployed ML models for data drift."}, {"letter": "D", "text": "To provide a no-code visual interface for ML development."}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker JumpStart provides a hub of pre-built machine learning solutions, foundation models, algorithms, and notebooks. It allows developers to quickly get started with common ML use cases by deploying ready-to-use models or solutions with just a few clicks, significantly accelerating the development process.", "multi": false}, {"num": 87, "text": "Which ethical consideration in AI highlights the importance of protecting sensitive personal information collected and processed by AI systems?", "options": [{"letter": "A", "text": "Explainability"}, {"letter": "B", "text": "Fairness"}, {"letter": "C", "text": "Accountability"}, {"letter": "D", "text": "Privacy and Security"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nPrivacy and Security are paramount ethical considerations in AI. They involve ensuring that personal data used by AI systems is protected from unauthorized access, misuse, or breaches, and that AI systems are designed to respect individuals' privacy rights.", "multi": false}, {"num": 88, "text": "A company wants to build a new recommendation
