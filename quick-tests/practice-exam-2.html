 engine for an existing e-commerce platform. They have historical user interaction data (clicks, views, purchases). Which AWS service can help them achieve this quickly without building complex ML models from scratch?", "options": [{"letter": "A", "text": "Amazon Kendra"}, {"letter": "B", "text": "Amazon Personalize"}, {"letter": "C", "text": "Amazon Forecast"}, {"letter": "D", "text": "Amazon SageMaker"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Personalize is a fully managed machine learning service designed specifically for creating personalized recommendation systems. It allows businesses to leverage their existing user interaction data to build custom recommenders quickly and effectively, without requiring deep ML expertise.", "multi": false}, {"num": 89, "text": "Which AWS service would you use to translate live audio streams (e.g., a speech, a meeting) into text in a different language in real-time?", "options": [{"letter": "A", "text": "Amazon Lex and Amazon Translate"}, {"letter": "B", "text": "Amazon Transcribe and Amazon Translate"}, {"letter": "C", "text": "Amazon Transcribe and Amazon Polly"}, {"letter": "D", "text": "Amazon Polly and Amazon Translate"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nTo translate live audio streams, you would first use Amazon Transcribe to convert the spoken words into text in the source language. Then, Amazon Translate would take that transcribed text and translate it into the desired target language, providing a real-time translation experience.", "multi": false}, {"num": 90, "text": "A product team wants to quickly prototype an AI-powered application idea without writing any code or setting up AWS infrastructure. They want to experiment with foundation models using a simple web interface. Which AWS offering enables this rapid prototyping?", "options": [{"letter": "A", "text": "Amazon Bedrock Console"}, {"letter": "B", "text": "Amazon SageMaker JumpStart"}, {"letter": "C", "text": "Amazon Q Developer"}, {"letter": "D", "text": "Amazon PartyRock"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon PartyRock is a free, no-code playground built on Amazon Bedrock that lets anyone build generative AI-powered apps through a simple web interface without needing an AWS account or infrastructure setup. The Bedrock Console requires an AWS account and some technical knowledge. SageMaker JumpStart requires SageMaker setup. Q Developer is a coding assistant.", "multi": false}, {"num": 91, "text": "Which AWS AI service allows you to extract specific custom entities from text, such as product codes, industry-specific terms, or unique identifiers, that are not part of the pre-trained Comprehend entity types?", "options": [{"letter": "A", "text": "Amazon Comprehend Custom Entities"}, {"letter": "B", "text": "Amazon Comprehend Key Phrases"}, {"letter": "C", "text": "Amazon Comprehend PII Detection"}, {"letter": "D", "text": "Amazon Comprehend Targeted Sentiment"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend Custom Entities enables you to define and train your own custom entity types. This allows the service to identify and extract entities that are specific to your domain or business, beyond the general entities that pre-trained Comprehend can detect.", "multi": false}, {"num": 92, "text": "When deploying an Amazon SageMaker model for real-time predictions, what is the primary purpose of a \"Production Variant\"?", "options": [{"letter": "A", "text": "To specify the data preprocessing steps for inference."}, {"letter": "B", "text": "To store the model artifacts in S3."}, {"letter": "C", "text": "To trigger model retraining jobs."}, {"letter": "D", "text": "To define the hardware configuration and traffic distribution for a deployed model."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nIn Amazon SageMaker, when you deploy a model to an endpoint, you define one or more \"Production Variants.\" Each variant specifies the compute instance type, the number of instances, and how traffic should be routed to that particular model version. This allows for A/B testing, blue/green deployments, and scaling of different model versions.", "multi": false}, {"num": 93, "text": "An enterprise search solution needs to index content from SharePoint, Confluence, Amazon S3, and several relational databases to provide a unified search experience for employees. Which AWS service natively supports connectors to these diverse data sources?", "options": [{"letter": "A", "text": "Amazon OpenSearch Service"}, {"letter": "B", "text": "Amazon CloudSearch"}, {"letter": "C", "text": "Amazon Kendra"}, {"letter": "D", "text": "AWS Glue"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Kendra provides native data source connectors for a wide variety of enterprise repositories including S3, SharePoint, Confluence, Salesforce, ServiceNow, databases, and more. OpenSearch and CloudSearch require custom ingestion pipelines. AWS Glue is an ETL service for data transformation, not enterprise search.", "multi": false}, {"num": 94, "text": "Which machine learning paradigm involves training a model to find hidden patterns or structures in unlabeled data, such as segmenting customers or detecting anomalies?", "options": [{"letter": "A", "text": "Supervised Learning"}, {"letter": "B", "text": "Transfer Learning"}, {"letter": "C", "text": "Reinforcement Learning"}, {"letter": "D", "text": "Unsupervised Learning"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nUnsupervised learning deals with unlabeled datasets. Its goal is to discover underlying patterns, groupings (clustering), or anomalies without any explicit output variables provided during training. Customer segmentation and anomaly detection are classic examples.", "multi": false}, {"num": 95, "text": "A company wants to identify the dominant emotion (e.g., happy, sad, angry) in faces detected in user-uploaded images. Which AWS service provides this capability?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition offers advanced facial analysis capabilities that include detecting emotions in faces. It can identify emotions like happy, sad, angry, surprised, calm, confused, or disgusted, along with confidence scores, within images and videos.", "multi": false}, {"num": 96, "text": "Which AWS service is specifically designed to provide personalized content recommendations (e.g., movies, music, news articles) based on user behavior and item metadata?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Forecast"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Personalize is a fully managed machine learning service purpose-built for creating real-time personalized recommendation systems. It allows developers to build custom recommendation engines leveraging Amazon.com's technology, using user interaction data and item/user metadata.", "multi": false}, {"num": 97, "text": "Which ethical principle in AI requires that AI systems are designed and developed to avoid negative impacts on protected groups and ensure equitable outcomes?", "options": [{"letter": "A", "text": "Explainability"}, {"letter": "B", "text": "Robustness"}, {"letter": "C", "text": "Transparency"}, {"letter": "D", "text": "Fairness"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nFairness in AI is concerned with preventing AI systems from perpetuating or amplifying societal biases. It aims to ensure that models produce equitable and unbiased outcomes across different demographic groups, preventing discrimination and promoting inclusive AI.", "multi": false}, {"num": 98, "text": "True or False: Amazon SageMaker Model Monitor can only detect data drift, but not concept drift or model quality issues.", "options": [{"letter": "A", "text": "True"}, {"letter": "B", "text": "False"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon SageMaker Model Monitor is a comprehensive tool that continuously monitors deployed ML models for various types of performance degradation. This includes data drift (changes in input data characteristics), concept drift (changes in the relationship between input and target variables), and overall model quality metrics.", "multi": false}, {"num": 99, "text": "A journalist needs to transcribe a long audio interview to text quickly and accurately. Which AWS service should they use?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Translate"}, {"letter": "C", "text": "Amazon Transcribe"}, {"letter": "D", "text": "Amazon Lex"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Transcribe is an automatic speech recognition (ASR) service that converts audio into accurate and readable text. It is ideal for transcribing interviews, meetings, and other audio content, and can handle both short and long audio files.", "multi": false}, {"num": 100, "text": "What is the primary benefit of using a \"managed service\" for AI (e.g., Amazon Comprehend, Rekognition) compared to deploying an open-source ML model on an EC2 instance?", "options": [{"letter": "A", "text": "It is always a cheaper option for very high-volume, continuous processing."}, {"letter": "B", "text": "It offers more control over the operating system and underlying hardware."}, {"letter": "C", "text": "It allows for custom modification of the core ML algorithm."}, {"letter": "D", "text": "It reduces operational overhead, maintenance, and scaling complexity."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nManaged AWS AI services abstract away the infrastructure management. AWS handles the provisioning, scaling, patching, and maintenance of the underlying ML models and infrastructure. This significantly reduces the operational burden on developers, allowing them to focus on application development rather than managing servers, which is not the case when deploying open-source models on EC2.", "multi": false}, {"num": 101, "text": "Which AWS AI service provides a fully managed solution for adding speech-to-text capabilities to applications, including features like custom vocabulary and speaker diarization?", "options": [{"letter": "A", "text": "Amazon Polly"}, {"letter": "B", "text": "Amazon Translate"}, {"letter": "C", "text": "Amazon Lex"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Transcribe is the dedicated automatic speech recognition (ASR) service. It not only converts speech to text but also offers advanced features such as custom vocabularies (to improve accuracy for domain-specific terms) and speaker diarization (to identify different speakers in an audio file).", "multi": false}, {"num": 102, "text": "A data scientist is preparing a dataset for a supervised machine learning model. What is the process of cleaning, transforming, and structuring raw data into a format suitable for model training called?", "options": [{"letter": "A", "text": "Data Preprocessing"}, {"letter": "B", "text": "Data Visualization"}, {"letter": "C", "text": "Hyperparameter Tuning"}, {"letter": "D", "text": "Model Deployment"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nData preprocessing is a crucial step in the machine learning workflow. It involves a series of operations like cleaning missing values, handling outliers, normalizing numerical features, encoding categorical variables, and transforming data to make it suitable and effective for training machine learning models.", "multi": false}, {"num": 103, "text": "A company has deployed an ML model in production and notices that prediction accuracy has degraded over 6 months. The data science team suspects the input data distribution has shifted from what the model was trained on. Which SageMaker feature specifically monitors for this issue?", "options": [{"letter": "A", "text": "SageMaker Debugger"}, {"letter": "B", "text": "SageMaker Experiments"}, {"letter": "C", "text": "SageMaker Autopilot"}, {"letter": "D", "text": "SageMaker Model Monitor"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nSageMaker Model Monitor continuously monitors the quality of ML models in production by detecting data drift, model quality drift, bias drift, and feature attribution drift. It alerts teams when the input data distribution deviates from the training baseline. Debugger is for training issues. Experiments tracks training runs. Autopilot builds models automatically.", "multi": false}, {"num": 104, "text": "Which AWS service provides the capability to detect key phrases, entities, and sentiment in text, and can be used for custom classification of documents based on your own labels?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Personalize"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Comprehend is a natural language processing (NLP) service that offers capabilities like key phrase extraction, entity recognition, and sentiment analysis. Crucially, it also supports Custom Classification, allowing you to train models to categorize text into your own defined categories.", "multi": false}, {"num": 105, "text": "Which ethical principle in AI emphasizes the need for transparency in how AI systems are built and operated, allowing for human oversight and intervention when necessary?", "options": [{"letter": "A", "text": "Data Privacy"}, {"letter": "B", "text": "Fairness"}, {"letter": "C", "text": "Accountability"}, {"letter": "D", "text": "Human Oversight"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nWhile transparency and accountability are related, \"Human Oversight\" specifically emphasizes the importance of keeping humans in control of AI systems. This means designing systems that allow for human review, intervention, and the ability to override AI decisions when appropriate, ensuring that AI serves human values.", "multi": false}, {"num": 106, "text": "A company wants to provide voice control for their mobile application. They need a service that can convert spoken commands into text and then understand the user's intent to trigger specific actions. Which AWS service would handle the Automatic Speech Recognition (ASR) and Natural Language Understanding (NLU) parts?", "options": [{"letter": "A", "text": "Amazon Transcribe and Amazon Comprehend"}, {"letter": "B", "text": "Amazon Lex"}, {"letter": "C", "text": "Amazon Polly and Amazon Translate"}, {"letter": "D", "text": "Amazon Transcribe and Amazon Lex"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Lex is a service for building conversational interfaces, and it provides both ASR (Automatic Speech Recognition) to convert speech to text and NLU (Natural Language Understanding) to comprehend the intent of the text. It's designed as an all-in-one service for building voice and text bots. While Transcribe and Comprehend could be chained, Lex provides a more integrated solution for this specific use case.", "multi": false}, {"num": 107, "text": "Which AWS AI service can convert text into lifelike speech in various languages, offering a wide range of voices including male, female, and child voices?", "options": [{"letter": "A", "text": "Amazon Lex"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Translate"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly is a text-to-speech (TTS) service that offers a diverse selection of voices across multiple languages, including different genders and even child voices, to suit various application needs.", "multi": false}, {"num": 108, "text": "A financial services company needs their internal search system to understand complex analyst queries like \"What were the key factors behind Q3 revenue decline?\" and return specific passages from earnings reports rather than just document links. Which AWS service provides this natural language understanding for search?", "options": [{"letter": "A", "text": "Amazon Athena"}, {"letter": "B", "text": "Amazon OpenSearch Service"}, {"letter": "C", "text": "Amazon Kendra"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon Kendra uses machine learning to understand the intent and context of natural language queries and returns specific, relevant passages (not just documents) as answers. This semantic search capability goes beyond keyword matching. Athena queries structured data with SQL. OpenSearch is primarily keyword-based. Comprehend analyzes text but does not provide search functionality.", "multi": false}, {"num": 109, "text": "Which AWS service is commonly used as a highly durable and scalable storage solution for machine learning model artifacts (e.g., trained models, checkpoints) generated by Amazon SageMaker?", "options": [{"letter": "A", "text": "Amazon RDS"}, {"letter": "B", "text": "Amazon EC2"}, {"letter": "C", "text": "Amazon S3"}, {"letter": "D", "text": "Amazon EBS"}], "correct": ["C"], "explanation": "<strong>Explanation:</strong>\nAmazon S3 (Simple Storage Service) is the go-to service for storing machine learning model artifacts. Its high durability, scalability, and integration with SageMaker make it ideal for storing trained models, datasets, and other assets securely and reliably.", "multi": false}, {"num": 110, "text": "What is the concept of \"Data Drift\" in the context of machine learning operations (MLOps)?", "options": [{"letter": "A", "text": "Changes in the underlying relationship between input features and the target variable."}, {"letter": "B", "text": "Changes in the distribution of the input data used by a deployed model over time."}, {"letter": "C", "text": "The process of migrating data from one storage system to another."}, {"letter": "D", "text": "Changes in the model's architecture or algorithms during retraining."}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nData drift occurs when the statistical properties of the input data (features) to a deployed machine learning model change over time. This can cause the model's performance to degrade, as it was trained on a different data distribution. Monitoring for data drift is a key aspect of MLOps. Concept drift (A) is a related but distinct issue.", "multi": false}, {"num": 111, "text": "Which AWS AI service provides a fully managed solution to generate personalized recommendations for users, leveraging machine learning, and integrates with existing applications via APIs?", "options": [{"letter": "A", "text": "Amazon Personalize"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Forecast"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Personalize is a specialized, fully managed ML service for creating personalized recommendation systems. It allows you to generate recommendations based on user interactions and item metadata, which can then be integrated into your applications through APIs.", "multi": false}, {"num": 112, "text": "Which concept describes the outcome when an AI system's performance deteriorates because the relationship between the input data and the target variable changes over time, even if the input data distribution remains stable?", "options": [{"letter": "A", "text": "Data Drift"}, {"letter": "B", "text": "Model Bias"}, {"letter": "C", "text": "Overfitting"}, {"letter": "D", "text": "Concept Drift"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nConcept drift occurs when the statistical properties of the target variable, which the model is trying to predict, change over time. This means the underlying relationship between the input features and the target changes, making the model's past learned patterns less accurate. Data drift refers to changes in the input feature distribution.", "multi": false}, {"num": 113, "text": "An insurance company processes thousands of claims documents daily that contain tables with complex layouts including merged cells, nested headers, and multi-page tables. They need to extract structured data without creating templates for each document type. Which AWS service handles this automatically?", "options": [{"letter": "A", "text": "Amazon Comprehend"}, {"letter": "B", "text": "Amazon Rekognition"}, {"letter": "C", "text": "AWS Glue DataBrew"}, {"letter": "D", "text": "Amazon Textract"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract uses deep learning to automatically extract text, tables, and forms from documents without requiring predefined templates. It handles complex table layouts including merged cells and nested structures. Comprehend performs NLP on extracted text. Rekognition handles images but is not optimized for document processing. Glue DataBrew is for data transformation, not document extraction.", "multi": false}, {"num": 114, "text": "Which AWS service provides an automatic speech recognition (ASR) capability for converting spoken language into text, specifically optimized for healthcare and medical domains?", "options": [{"letter": "A", "text": "Amazon Transcribe Medical"}, {"letter": "B", "text": "Amazon Comprehend Medical"}, {"letter": "C", "text": "Amazon Polly"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Transcribe Medical is a specialized service for transcribing medical terminology, drug names, and procedures with high accuracy. It's built for healthcare-specific use cases, unlike the general Amazon Transcribe service.", "multi": false}, {"num": 115, "text": "A company wants to quickly train an image classification model without deep ML expertise to detect specific product defects in their manufacturing line. They have a dataset of defect images. Which AWS service would be most suitable?", "options": [{"letter": "A", "text": "AWS DeepLens"}, {"letter": "B", "text": "Amazon SageMaker Studio"}, {"letter": "C", "text": "Amazon SageMaker Canvas"}, {"letter": "D", "text": "Amazon Rekognition Custom Labels"}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAmazon Rekognition Custom Labels is ideal for this scenario. It allows you to train a custom computer vision model for object detection or image classification (like product defects) using your own labeled images, without requiring code or deep machine learning knowledge. Canvas is for general no-code ML, but Custom Labels is specifically for vision.", "multi": false}, {"num": 116, "text": "Which AWS AI service uses deep learning to generate human-like speech from text, providing high-quality audio output for applications like virtual assistants, e-learning content, and audiobooks?", "options": [{"letter": "A", "text": "Amazon Translate"}, {"letter": "B", "text": "Amazon Polly"}, {"letter": "C", "text": "Amazon Lex"}, {"letter": "D", "text": "Amazon Transcribe"}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAmazon Polly is the Text-to-Speech (TTS) service that synthesizes lifelike speech from text. It's designed to provide natural-sounding voices, including Neural TTS options, for a wide range of applications requiring high-quality audio output.", "multi": false}, {"num": 117, "text": "What is the primary role of \"AWS Identity and Access Management (IAM)\" in securing AWS AI services?", "options": [{"letter": "A", "text": "To encrypt all data processed by AI services."}, {"letter": "B", "text": "To monitor the performance and health of AI service endpoints."}, {"letter": "C", "text": "To manage billing and cost allocation for AI services."}, {"letter": "D", "text": "To control who can access and use AWS AI services and resources."}], "correct": ["D"], "explanation": "<strong>Explanation:</strong>\nAWS IAM is fundamental for security. It allows you to manage access to AWS services and resources securely. With IAM, you can define users, groups, and roles, and attach policies that grant or deny specific permissions (e.g., calling Rekognition APIs, accessing S3 buckets where data for AI services is stored).", "multi": false}, {"num": 118, "text": "Which AWS AI service allows you to perform real-time optical character recognition (OCR) on image files and PDFs, extracting text, forms, and tables as structured data?", "options": [{"letter": "A", "text": "Amazon Textract"}, {"letter": "B", "text": "Amazon Kendra"}, {"letter": "C", "text": "Amazon Comprehend"}, {"letter": "D", "text": "Amazon Rekognition"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Textract is specifically designed for OCR tasks, going beyond simple text extraction to identify and extract data from forms and tables in a structured format. It works with both image files and PDF documents, making it versatile for various document processing needs.", "multi": false}, {"num": 119, "text": "What is the primary purpose of a \"Lambda function\" when integrated with Amazon Lex in a conversational AI application?", "options": [{"letter": "A", "text": "To convert the user's speech into text for Lex processing."}, {"letter": "B", "text": "To handle the fulfillment of user intents by executing business logic or integrating with backend systems."}, {"letter": "C", "text": "To store the conversational history between the user and the bot."}, {"letter": "D", "text": "To define the natural language understanding (NLU) model for the bot."}], "correct": ["B"], "explanation": "<strong>Explanation:</strong>\nAWS Lambda functions are commonly used as fulfillment handlers for Amazon Lex bots. Once Lex identifies a user's intent and gathers necessary slots, it can invoke a Lambda function. This function then executes custom business logic, makes API calls to other services, or interacts with databases to fulfill the user's request.", "multi": false}, {"num": 120, "text": "Which AWS service provides a fully managed, intelligent search solution that uses natural language processing (NLP) to allow users to ask questions and find relevant information across various enterprise data sources?", "options": [{"letter": "A", "text": "Amazon Kendra"}, {"letter": "B", "text": "Amazon Elasticsearch Service (OpenSearch Service)"}, {"letter": "C", "text": "Amazon Textract"}, {"letter": "D", "text": "Amazon Comprehend"}], "correct": ["A"], "explanation": "<strong>Explanation:</strong>\nAmazon Kendra is purpose-built for intelligent enterprise search. It differentiates itself by using NLP to understand natural language queries and provide precise answers and relevant documents from an organization's internal data sources, rather than just keyword matching. Comprehend is for general NLP, Textract for OCR, and OpenSearch Service is for raw search and analytics.", "multi": false}];
const TOTAL = QUESTIONS.length;
let answeredCount = 0;
let correctCount = 0;

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildQuiz() {
  const container = document.getElementById('questions');
  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q${idx}`;

    const multiBadge = q.multi ? `<span class="multi-badge">Select 2</span>` : '';
    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q${q.num}</span>
        <span class="q-text">${escHtml(q.text)}${multiBadge}</span>
      </div>
      <div class="options" id="opts_${idx}">
        ${q.options.map(o => `
          <label class="option-label" id="lbl_${idx}_${o.letter}">
            <input type="${q.multi ? 'checkbox' : 'radio'}" name="q${idx}" value="${o.letter}" />
            <span class="letter">${o.letter})</span>
            <span>${escHtml(o.text)}</span>
          </label>`).join('')}
      </div>
      <button class="submit-btn" onclick="submitAnswer(${idx})">Check Answer</button>
      <div id="badge_${idx}" style="margin-top:12px;"></div>
      <details class="explanation" id="exp_${idx}">
        <summary>💡 Explanation</summary>
        <div class="explanation-body">${q.explanation}</div>
      </details>
    `;
    container.appendChild(card);
  });
}

function getSelected(idx) {
  const inputs = document.querySelectorAll(`[name="q${idx}"]:checked`);
  return Array.from(inputs).map(i => i.value);
}

function submitAnswer(idx) {
  const q = QUESTIONS[idx];
  const selected = getSelected(idx);
  if (selected.length === 0) return;

  // Disable all inputs
  document.querySelectorAll(`[name="q${idx}"]`).forEach(inp => inp.disabled = true);
  document.querySelector(`#q${idx} .submit-btn`).disabled = true;

  // Apply visual feedback
  q.options.forEach(o => {
    const lbl = document.getElementById(`lbl_${idx}_${o.letter}`);
    lbl.classList.add('disabled');
    const isCorrect = q.correct.includes(o.letter);
    const isSelected = selected.includes(o.letter);
    if (isCorrect) lbl.classList.add('correct');
    else if (isSelected && !isCorrect) lbl.classList.add('wrong');
  });

  // Determine result
  const correctSet = new Set(q.correct);
  const selectedSet = new Set(selected);
  let result;
  if (q.multi) {
    const allCorrect = q.correct.every(l => selectedSet.has(l)) && selected.every(l => correctSet.has(l));
    const partialCorrect = q.correct.some(l => selectedSet.has(l));
    result = allCorrect ? 'correct' : (partialCorrect ? 'partial' : 'wrong');
  } else {
    result = (selected.length === 1 && selected[0] === q.correct[0]) ? 'correct' : 'wrong';
  }

  const badge = document.getElementById(`badge_${idx}`);
  if (result === 'correct') {
    badge.innerHTML = `<span class="result-badge correct">✓ Correct!</span>`;
    document.getElementById(`q${idx}`).classList.add('answered-correct');
    correctCount++;
  } else if (result === 'partial') {
    const corrStr = q.correct.join(', ');
    badge.innerHTML = `<span class="result-badge partial">Partially Correct — full answer: ${corrStr}</span>`;
    document.getElementById(`q${idx}`).classList.add('answered-partial');
  } else {
    const corrStr = q.correct.join(', ');
    badge.innerHTML = `<span class="result-badge wrong">✗ Incorrect — correct answer: ${corrStr}</span>`;
    document.getElementById(`q${idx}`).classList.add('answered-wrong');
  }

  // Auto-open explanation
  document.getElementById(`exp_${idx}`).setAttribute('open', '');

  answeredCount++;
  updateProgress();

  if (answeredCount === TOTAL) showScore();
}

function updateProgress() {
  const pct = (answeredCount / TOTAL) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${answeredCount} / ${TOTAL} answered`;
}

function showScore() {
  const panel = document.getElementById('score-panel');
  panel.style.display = 'block';
  document.getElementById('score-correct').textContent = correctCount;
  document.getElementById('score-pct').textContent = `out of ${TOTAL} questions (${Math.round(correctCount/TOTAL*100)}%)`;
  const pct = correctCount / TOTAL * 100;
  let grade;
  if (pct >= 90) grade = "Excellent — you're exam-ready!";
  else if (pct >= 75) grade = "Good — review your misses and try again.";
  else if (pct >= 60) grade = "Needs more study — keep going!";
  else grade = "Keep practicing — you'll get there!";
  document.getElementById('score-grade').textContent = grade;
  panel.scrollIntoView({ behavior: 'smooth' });
}

buildQuiz();
updateProgress();
</script>
